// ══════════════════════════════════════════════════════════════
// FILTROS — multi-seleção (checkbox + Todos + Somente) e intervalo de datas
// ══════════════════════════════════════════════════════════════

// Markup de um filtro multi-seleção — usar dentro da filter-bar de cada aba.
function msFilterHtml(id, label, placeholder) {
  return `
    <div class="filter-item">
      <label class="form-label">${label}</label>
      <div class="ms-wrap">
        <div class="ms-box" onclick="toggleDropdown('${id}')">
          <span class="ms-box-label" id="text-${id}">${placeholder || 'Todos'}</span>
          <span class="ms-box-arrow">▾</span>
        </div>
        <div class="dropdown-menu hidden" id="menu-${id}"><div class="ms-list" id="list-${id}"></div></div>
      </div>
    </div>`;
}

function toggleDropdown(id) {
  document.querySelectorAll('.dropdown-menu').forEach(m => { if (m.id !== 'menu-' + id) m.classList.add('hidden'); });
  const menu = document.getElementById('menu-' + id);
  if (menu) menu.classList.toggle('hidden');
}

document.addEventListener('click', (e) => {
  document.querySelectorAll('.dropdown-menu:not(.hidden)').forEach(menu => {
    const wrap = menu.closest('.ms-wrap');
    if (wrap && !wrap.contains(e.target)) menu.classList.add('hidden');
  });
});

const _msCallbacks = {};

// options: array de strings. selected: array já selecionado (vazio = "Todos"). onChange: chamado a cada clique.
function populateMultiSelect(id, options, selected, onChange) {
  if (onChange) _msCallbacks[id] = onChange;
  const listEl = document.getElementById('list-' + id);
  if (!listEl) return;
  const sel = selected || [];
  const isAll = sel.length === 0 || sel.length === options.length;
  let html = `<label class="ms-all-row"><input type="checkbox" class="ms-all-${id}" ${isAll ? 'checked' : ''} onchange="toggleAllMultiSelect('${id}')"><span>Todos</span></label>`;
  if (options.length === 0) {
    html += '<div class="ms-empty">Nenhuma opção</div>';
  } else {
    options.forEach(opt => {
      const checked  = isAll || sel.includes(opt);
      const safeAttr = String(opt).replace(/"/g, '&quot;');
      const safeJs   = String(opt).replace(/'/g, "\\'");
      html += `<div class="ms-opt-row">
        <label><input type="checkbox" class="ms-item-${id}" value="${safeAttr}" ${checked ? 'checked' : ''} onchange="handleItemMultiSelect('${id}')"><span title="${safeAttr}">${opt}</span></label>
        <button type="button" class="ms-only-btn" onclick="selectOnlyMultiSelect('${id}','${safeJs}')">Somente</button>
      </div>`;
    });
  }
  listEl.innerHTML = html;
  _updateMultiSelectText(id);
}

function getSelectedMulti(id) {
  const allCb = document.querySelector('.ms-all-' + id);
  if (allCb && allCb.checked) return [];
  return Array.from(document.querySelectorAll('.ms-item-' + id)).filter(c => c.checked).map(c => c.value);
}

function _updateMultiSelectText(id) {
  const textEl = document.getElementById('text-' + id);
  if (!textEl) return;
  const items   = Array.from(document.querySelectorAll('.ms-item-' + id));
  const checked = items.filter(c => c.checked);
  if (items.length === 0 || checked.length === items.length) textEl.textContent = 'Todos';
  else if (checked.length === 0) textEl.textContent = 'Nenhum';
  else if (checked.length === 1) textEl.textContent = checked[0].value;
  else textEl.textContent = checked.length + ' selecionados';
}

function toggleAllMultiSelect(id) {
  const allCb = document.querySelector('.ms-all-' + id);
  document.querySelectorAll('.ms-item-' + id).forEach(c => c.checked = !!(allCb && allCb.checked));
  _updateMultiSelectText(id);
  if (_msCallbacks[id]) _msCallbacks[id]();
}

function handleItemMultiSelect(id) {
  const items = document.querySelectorAll('.ms-item-' + id);
  const allCb = document.querySelector('.ms-all-' + id);
  if (allCb) allCb.checked = Array.from(items).every(c => c.checked);
  _updateMultiSelectText(id);
  if (_msCallbacks[id]) _msCallbacks[id]();
}

function selectOnlyMultiSelect(id, val) {
  document.querySelectorAll('.ms-item-' + id).forEach(c => c.checked = (c.value === val));
  const allCb = document.querySelector('.ms-all-' + id);
  if (allCb) allCb.checked = false;
  _updateMultiSelectText(id);
  const menu = document.getElementById('menu-' + id);
  if (menu) menu.classList.add('hidden');
  if (_msCallbacks[id]) _msCallbacks[id]();
}

// ── Calendário de intervalo de datas (flatpickr com atalhos + rodapé) ──────
// A instância "externa" (em cima do input visível) só controla abrir/fechar o
// painel, guarda o resultado final (selectedDates, lido por getDateRangeFilter)
// e formata o texto exibido — seu próprio grid de dias nunca é mostrado.
// No lugar, o painel mostra 2 mini-calendários independentes (inline), um pra
// "Data de início" e outro pra "Data de término", cada um com sua própria seta
// de mês/ano — dá pra navegar um lado sem mexer no outro (como no Data Studio).
// Período padrão do painel inteiro: ao abrir qualquer aba pela primeira vez,
// o filtro já vem de 01/01/2026 até hoje (em vez de vazio/sem filtro) — o
// usuário ainda pode limpar ou trocar o período normalmente depois.
const PERIODO_PADRAO_INICIO = '2026-01-01';
function initDateRangePicker(inputId, onApply) {
  const el = document.getElementById(inputId);
  if (!el || el._flatpickr) return;
  flatpickr(el, {
    mode: 'range', locale: 'pt', defaultDate: [PERIODO_PADRAO_INICIO, new Date()],
    dateFormat: 'Y-m-d', altInput: true, altFormat: 'd/m/Y', animate: false,
    onOpen: function (selectedDates, dateStr, instance) {
      // Reabrindo: sincroniza os 2 mini-calendários com o que já está aplicado.
      const dIni = selectedDates[0];
      const dFim = selectedDates[1] || selectedDates[0];
      if (instance._fpIni) { if (dIni) { instance._fpIni.setDate(dIni, false); instance._fpIni.jumpToDate(dIni); } else instance._fpIni.clear(); }
      if (instance._fpFim) { if (dFim) { instance._fpFim.setDate(dFim, false); instance._fpFim.jumpToDate(dFim); } else instance._fpFim.clear(); }
    },
    onReady: function (selectedDates, dateStr, instance) {
      const container = instance.calendarContainer;
      if (!container.querySelector('.flatpickr-shortcuts-sidebar')) {
        const sidebar = document.createElement('div');
        sidebar.className = 'flatpickr-shortcuts-sidebar';
        const opts = [
          { label: 'Hoje', range: [new Date(), new Date()] },
          { label: 'Ontem', range: (() => { const d = new Date(); d.setDate(d.getDate() - 1); return [d, d]; })() },
          { label: 'Últimos 7 dias', range: (() => { const d = new Date(); d.setDate(d.getDate() - 7); return [d, new Date()]; })() },
          { label: 'Últimos 30 dias', range: (() => { const d = new Date(); d.setDate(d.getDate() - 30); return [d, new Date()]; })() },
          { label: 'Este mês', range: (() => { const d = new Date(); return [new Date(d.getFullYear(), d.getMonth(), 1), new Date(d.getFullYear(), d.getMonth() + 1, 0)]; })() },
          { label: 'Mês passado', range: (() => { const d = new Date(); return [new Date(d.getFullYear(), d.getMonth() - 1, 1), new Date(d.getFullYear(), d.getMonth(), 0)]; })() },
          { label: 'Este ano', range: (() => { const d = new Date(); return [new Date(d.getFullYear(), 0, 1), new Date(d.getFullYear(), 11, 31)]; })() },
          { label: 'Limpar', range: [] }
        ];
        opts.forEach(opt => {
          const btn = document.createElement('div');
          btn.className = 'fp-shortcut-item';
          btn.textContent = opt.label;
          btn.onclick = () => {
            if (opt.range.length > 0) { instance.setDate(opt.range, false); instance.jumpToDate(opt.range[0]); }
            else { instance.clear(); instance.jumpToDate(new Date()); }
            container.querySelectorAll('.fp-shortcut-item').forEach(x => x.classList.remove('active'));
            btn.classList.add('active');
            // Mesmo comportamento do "Aplicar": já filtra e fecha na hora.
            if (onApply) onApply();
            instance.close();
          };
          sidebar.appendChild(btn);
        });
        container.prepend(sidebar);
      }
      if (!container.querySelector('.fp-calendar-main')) {
        // O grid nativo (showMonths) some — os 2 mini-calendários abaixo tomam o lugar dele.
        const innerContainer = container.querySelector('.flatpickr-innerContainer');
        const monthsNav      = container.querySelector('.flatpickr-months');
        if (innerContainer) innerContainer.style.display = 'none';
        if (monthsNav) monthsNav.style.display = 'none';

        const main = document.createElement('div');
        main.className = 'fp-calendar-main';

        const dualWrap = document.createElement('div');
        dualWrap.className = 'fp-dual-wrap';
        dualWrap.innerHTML = `
          <div class="fp-dual-col"><div class="fp-header-text">Data de início</div><input type="text" class="fp-dual-input"></div>
          <div class="fp-dual-col"><div class="fp-header-text">Data de término</div><input type="text" class="fp-dual-input"></div>`;
        main.appendChild(dualWrap);

        const footer = document.createElement('div');
        footer.className = 'fp-footer';
        footer.innerHTML = `<button type="button" class="fp-footer-btn fp-btn-cancel">Cancelar</button><button type="button" class="fp-footer-btn fp-btn-apply">Aplicar</button>`;
        main.appendChild(footer);
        container.appendChild(main);

        const [iniInput, fimInput] = dualWrap.querySelectorAll('.fp-dual-input');
        const atual = instance.selectedDates;
        instance._fpIni = flatpickr(iniInput, {
          inline: true, locale: 'pt', dateFormat: 'Y-m-d', monthSelectorType: 'dropdown', animate: false,
          defaultDate: atual[0] || null
        });
        instance._fpFim = flatpickr(fimInput, {
          inline: true, locale: 'pt', dateFormat: 'Y-m-d', monthSelectorType: 'dropdown', animate: false,
          defaultDate: atual[1] || atual[0] || null
        });

        footer.querySelector('.fp-btn-cancel').onclick = () => instance.close();
        footer.querySelector('.fp-btn-apply').onclick = () => {
          const d1 = instance._fpIni.selectedDates[0];
          const d2 = instance._fpFim.selectedDates[0] || d1;
          if (d1) instance.setDate(d2 && d2 < d1 ? [d2, d1] : [d1, d2], false);
          if (onApply) onApply();
          instance.close();
        };
      }
    }
  });
}

// Lê as datas selecionadas direto da instância flatpickr (nunca faz parse do texto
// do input — o separador de intervalo muda por locale, ex.: "to" em inglês vira
// "até" em pt, o que quebrava o split e misturava início/fim numa string só).
function getDateRangeFilter(inputId) {
  const el = document.getElementById(inputId);
  const dates = el && el._flatpickr ? el._flatpickr.selectedDates : [];
  if (!dates || dates.length === 0) return { data_inicio: '', data_fim: '' };
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return { data_inicio: iso(dates[0]), data_fim: iso(dates[dates.length - 1]) };
}

function clearDateRangePicker(inputId) {
  const el = document.getElementById(inputId);
  if (el && el._flatpickr) el._flatpickr.clear();
}

function _renderKpisPedidos(r) {
  document.getElementById('pKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value stat-verde">${fmtNum(r.total_pedidos)}</div><div class="stat-label">Pedidos</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.total_linhas)}</div><div class="stat-label">Itens</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.total_solicitado)}</div><div class="stat-label">Solicitado</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtKg(r.total_kg_solicitado)}</div><div class="stat-label">Kg Solicitado</div></div>`;
}

function _destroyChart(store, key) { if (store[key]) { store[key].destroy(); delete store[key]; } }

// ── HELPERS DE GRÁFICO (estilo "pill label": barras cheias, arredondadas, com
// rótulo branco em cápsula escura na ponta — mesmo visual usado no SPG Estufa) ──

// Esconde o <canvas> e mostra a mensagem de "sem dados" ao lado dele — nunca
// substitui o innerHTML do container (isso apagava o <canvas> pra sempre, e a
// próxima troca de filtro com dados de verdade não achava mais o elemento
// pelo id e desistia de desenhar, deixando a mensagem antiga presa na tela).
function _emptyStateNoCanvas(ctx) {
  ctx.style.display = 'none';
  if (!ctx.parentElement.querySelector('.empty-state')) {
    const msg = document.createElement('div');
    msg.className = 'empty-state';
    msg.textContent = 'Sem dados para os filtros atuais.';
    ctx.parentElement.appendChild(msg);
  }
}
// Contrapartida: tira a mensagem e reexibe o <canvas> antes de tentar
// desenhar de novo — chamada sempre no início de cada createXChart, pra um
// filtro que passou a ter dados voltar a mostrar o gráfico normalmente.
function _clearEmptyState(ctx) {
  ctx.style.display = '';
  const msg = ctx.parentElement.querySelector('.empty-state');
  if (msg) msg.remove();
}

// Barra única (vertical ou horizontal via opts.horizontal), 1 série.
// opts: { store, key, horizontal, color, colors(array por barra), suffix, formatter, tooltipCallbacks }
function createModernBarChart(canvasId, labels, data, opts = {}) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  _clearEmptyState(ctx);
  if (opts.store) _destroyChart(opts.store, opts.key);
  if (!labels || labels.length === 0) { _emptyStateNoCanvas(ctx); return null; }
  const fmt = opts.formatter || (v => fmtNum(Math.round(v)) + (opts.suffix || ''));
  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: opts.label || '',
        data,
        backgroundColor: opts.colors || opts.color || COR_SOLICITADO,
        borderRadius: 6,
        barPercentage: 0.85,
        categoryPercentage: 0.8
      }]
    },
    options: {
      indexAxis: opts.horizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,0.92)', padding: 10, cornerRadius: 8,
          callbacks: opts.tooltipCallbacks
        },
        datalabels: {
          display: c => AppMostrarRotulos && c.dataset.data[c.dataIndex] != null && c.dataset.data[c.dataIndex] !== 0,
          anchor: 'end',
          align: opts.horizontal ? 'left' : 'top',
          color: '#fff',
          backgroundColor: 'rgba(15,23,42,0.72)',
          borderRadius: 4,
          padding: { top: 2, bottom: 2, left: 5, right: 5 },
          font: { weight: '800', size: 9 },
          formatter: fmt
        }
      },
      scales: opts.horizontal
        ? { x: { display: false, beginAtZero: true, max: opts.max }, y: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 }, color: '#475569' } } }
        : { y: { display: false, beginAtZero: true, max: opts.max }, x: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 }, color: '#475569' } } }
    }
  });
  if (opts.store) opts.store[opts.key] = chart;
  return chart;
}

// Barra agrupada, várias séries. opts.datasets: [{ label, data, color }]
function createModernGroupedBarChart(canvasId, labels, datasets, opts = {}) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  _clearEmptyState(ctx);
  if (opts.store) _destroyChart(opts.store, opts.key);
  if (!labels || labels.length === 0) { _emptyStateNoCanvas(ctx); return null; }
  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: datasets.map(d => ({
        label: d.label, data: d.data, backgroundColor: d.color,
        borderRadius: 5, barPercentage: 0.8, categoryPercentage: 0.75
      }))
    },
    options: {
      indexAxis: opts.horizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, font: { size: 10, weight: '700' } } },
        tooltip: { backgroundColor: 'rgba(15,23,42,0.92)', padding: 10, cornerRadius: 8, callbacks: opts.tooltipCallbacks },
        datalabels: {
          display: c => AppMostrarRotulos && c.dataset.data[c.dataIndex] != null && c.dataset.data[c.dataIndex] !== 0,
          anchor: 'end',
          align: opts.horizontal ? 'right' : 'top',
          color: '#fff',
          backgroundColor: 'rgba(15,23,42,0.72)',
          borderRadius: 4,
          padding: { top: 2, bottom: 2, left: 5, right: 5 },
          font: { weight: '800', size: 9 },
          formatter: v => fmtNum(Math.round(v))
        }
      },
      scales: opts.horizontal
        ? { x: { beginAtZero: true, grid: { color: '#f1f5f9' } }, y: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 } } } }
        : { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 } } } }
    }
  });
  if (opts.store) opts.store[opts.key] = chart;
  return chart;
}

// Barra agrupada com 2 eixos Y (esquerda/direita) — para séries com escalas bem diferentes
// (ex.: kg × unidades). opts.datasets: [{ label, data, color, axis: 'y'|'y1' }]
function createDualAxisBarChart(canvasId, labels, datasets, opts = {}) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  _clearEmptyState(ctx);
  if (opts.store) _destroyChart(opts.store, opts.key);
  if (!labels || labels.length === 0) { _emptyStateNoCanvas(ctx); return null; }
  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: datasets.map(d => ({
        label: d.label, data: d.data, backgroundColor: d.color, yAxisID: d.axis || 'y',
        borderRadius: 5, barPercentage: 0.8, categoryPercentage: 0.75
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, font: { size: 10, weight: '700' } } },
        tooltip: { backgroundColor: 'rgba(15,23,42,0.92)', padding: 10, cornerRadius: 8, callbacks: opts.tooltipCallbacks },
        datalabels: {
          display: c => AppMostrarRotulos && c.dataset.data[c.dataIndex] != null && c.dataset.data[c.dataIndex] !== 0,
          anchor: 'end',
          align: 'top',
          color: '#fff',
          backgroundColor: 'rgba(15,23,42,0.72)',
          borderRadius: 4,
          padding: { top: 2, bottom: 2, left: 5, right: 5 },
          font: { weight: '800', size: 9 },
          formatter: v => fmtNum(Math.round(v))
        }
      },
      scales: Object.assign(
        { x: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 } } },
          y: { beginAtZero: true, position: 'left', grid: { color: '#f1f5f9' }, title: { display: true, text: opts.yLabel || '', font: { weight: '700', size: 10 } } } },
        datasets.some(d => d.axis === 'y1')
          ? { y1: { beginAtZero: true, position: 'right', grid: { display: false }, title: { display: true, text: opts.y1Label || '', font: { weight: '700', size: 10 } } } }
          : {}
      )
    }
  });
  if (opts.store) opts.store[opts.key] = chart;
  return chart;
}

// Doughnut com legenda à direita/embaixo e % em cápsula escura sobre a fatia.
function createModernDoughnutChart(canvasId, labels, data, colors, opts = {}) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  _clearEmptyState(ctx);
  if (opts.store) _destroyChart(opts.store, opts.key);
  const total = (data || []).reduce((a, b) => a + b, 0);
  if (!labels || labels.length === 0 || total === 0) { _emptyStateNoCanvas(ctx); return null; }
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: { display: true, position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, padding: 10, font: { size: 10, weight: '600' }, color: '#64748b' } },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,0.92)', padding: 10, cornerRadius: 8,
          callbacks: { label: c => ` ${c.label}: ${fmtNum(c.raw)} (${total > 0 ? ((c.raw / total) * 100).toFixed(1) : 0}%)` }
        },
        datalabels: {
          display: c => AppMostrarRotulos && c.dataset.data[c.dataIndex] > 0,
          color: '#fff', backgroundColor: 'rgba(0,0,0,0.45)', borderRadius: 4,
          font: { weight: '800', size: 9 },
          formatter: v => total > 0 ? ((v / total) * 100).toFixed(1) + '%' : ''
        }
      }
    }
  });
  if (opts.store) opts.store[opts.key] = chart;
  return chart;
}

function _renderChartsPedidos(dash) {
  const store = AppState.pedidos.charts;

  createModernBarChart('cPSemana', dash.porSemana.map(s => 'Sem ' + s.semana), dash.porSemana.map(s => s.solicitado),
    { store, key: 'semana', color: COR_SOLICITADO });

  createModernBarChart('cPClientes', dash.porCliente.map(c => c.cliente), dash.porCliente.map(c => c.qtde),
    { store, key: 'clientes', horizontal: true, color: COR_SOLICITADO });
}

function _renderTabelaPedidos(linhas) {
  linhas = _ordenarPorData(linhas, 'pedidos');
  document.getElementById('pContagem').textContent = linhas.length + ' item(ns)';
  const tbody = document.getElementById('pTabela');
  if (linhas.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Nenhum pedido encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = linhas.map(r => {
    const descartado = _pedidoDevolvido(r);
    const aproveitado = Math.max(0, r.qtde_solicitada - descartado);
    const pct = _pedidoPctAproveitamento(r);
    return `
    <tr>
      <td>${r.semana ?? '—'}</td>
      <td>${fmtDate(r.data)}</td>
      <td>${r.numero_pedido}</td>
      <td>${r.nfe || '—'}</td>
      <td>${r.cliente}</td>
      <td>${r.produto}</td>
      <td>${fmtQtde(r.qtde_solicitada, r.tipo)}</td>
      <td>${descartado > 0 ? fmtQtde(descartado, r.tipo) : '—'}</td>
      <td>${fmtQtde(aproveitado, r.tipo)} ${pct != null ? `<span class="badge" style="background:${_corAproveitamento(pct)}20;color:${_corAproveitamento(pct)};">${pct}%</span>` : ''}</td>
      <td>${r.peso_identificado ? fmtKgComUnidades(r.kg_solicitado, r.unidades_estimadas_solicitado) : '—'}</td>
    </tr>`;
  }).join('');
}

function gerarRelatorioPedidos() {
  if (!AppState.pedidos.resumo) { toast('Aguarde os dados carregarem antes de gerar o relatório.', 'error'); return; }
  _pedirPeriodoRelatorio('fpPeriodo', periodo => {
    const f = { ..._filtrosPedidos(), data_inicio: periodo.data_inicio, data_fim: periodo.data_fim };
    showLoading(true);
    Promise.all([
      gsCached('listarPedidos', App.token, {}),
      gsCached('listarDevolucoes', App.token, {})
    ]).then(([todosRaw, devolucoesRaw]) => {
      showLoading(false);
      const todos  = _comCultura(todosRaw, 'produto');
      const dash   = _dashboardPedidosJS(todos, f);
      const linhas = _filtrarPedidosJS(todos, f);
      const devolvidoMap = {};
      (devolucoesRaw || []).forEach(d => {
        const chave = d.numero_pedido + '|' + d.produto;
        devolvidoMap[chave] = (devolvidoMap[chave] || 0) + Number(d.quantidade || 0);
      });
      const r = dash.resumo;
      abrirRelatorioA4({
        titulo: 'Calendário de Pedidos',
        subtitulo: 'Pedidos',
        tituloTabela: 'Mapa de Pedidos',
        parametros: [
          { label: 'Período', valor: _relPeriodo(f) },
          { label: 'Cliente', valor: _relLista(f.clientes) },
          { label: 'Produto', valor: _relLista(f.produtos) }
        ],
        resumo: [
          { label: 'Total de Pedidos', valor: fmtNum(r.total_pedidos) },
          { label: 'Solicitado', valor: fmtNum(r.total_solicitado) }
        ],
        colunas: ['Semana', 'Data', 'Pedido', 'NFe', 'Cliente', 'Produto', 'Solicitado', 'Descartado', 'Aproveitado'],
        linhas: linhas.map(x => {
          const descartado = devolvidoMap[x.numero_pedido + '|' + x.produto] || 0;
          const aproveitado = Math.max(0, x.qtde_solicitada - descartado);
          const pct = x.qtde_solicitada > 0 ? +((aproveitado / x.qtde_solicitada) * 100).toFixed(1) : null;
          return [
            x.semana ?? '—', fmtDate(x.data), x.numero_pedido, x.nfe || '—', x.cliente, x.produto,
            fmtQtde(x.qtde_solicitada, x.tipo),
            descartado > 0 ? fmtQtde(descartado, x.tipo) : '—',
            fmtQtde(aproveitado, x.tipo) + (pct != null ? ' (' + pct + '%)' : '')
          ];
        })
      });
    }).catch(err => { showLoading(false); toast(err.message, 'error'); });
  });
}

<script>
// ── ABA: PARCEIROS ──────────────────────────────────────────
function renderParceirosTab() {
  const el = document.getElementById('aba_parceiros');
  el.innerHTML = `
    <div class="card mb-3 card-filtros">
      <div class="card-body" style="padding:12px 16px;">
        <div class="filter-bar">
          <div class="filter-item" style="min-width:230px;">
            <label class="form-label">Período</label>
            <input type="text" id="faPeriodo" class="form-control" placeholder="Período automático">
          </div>
          <div class="filter-item" style="min-width:160px;">
            <label class="form-label">NFe</label>
            <input type="text" id="faNfe" class="form-control" placeholder="Buscar por NFe" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" oninput="_debouncedLoadParceiros()">
          </div>
          ${msFilterHtml('faParceiro', 'Parceiro')}
          ${msFilterHtml('faCliente', 'Cliente')}
          ${msFilterHtml('faProduto', 'Produto')}
          ${msFilterHtml('faCultura', 'Cultura')}
          <div class="filter-item" style="flex:0 0 auto;display:flex;gap:8px;">
            <button class="btn btn-secondary" onclick="limparFiltrosParceiros()">Limpar</button>
            <button class="btn btn-secondary" title="Ignorar cache e buscar dados novos" onclick="gsCacheClear();loadParceiros();">🔄</button>
          </div>
        </div>
      </div>
    </div>
    <div class="stats-grid mb-3" id="aKpis"></div>
    <div class="card mb-3">
      <div class="card-header">
        <h3>Fornecimento por Período (kg)</h3>
        <div style="display:flex;gap:4px;" id="aGranBotoes">
          <button class="btn btn-sm" id="btnGran_dia" onclick="setGranularidadeParceiros('dia')">Dia</button>
          <button class="btn btn-sm" id="btnGran_semana" onclick="setGranularidadeParceiros('semana')">Semana</button>
          <button class="btn btn-sm" id="btnGran_mes" onclick="setGranularidadeParceiros('mes')">Mês</button>
          <button class="btn btn-sm" id="btnGran_ano" onclick="setGranularidadeParceiros('ano')">Ano</button>
        </div>
      </div>
      <div class="card-body"><canvas id="cAPeriodo" height="220"></canvas></div>
    </div>
    <div class="grid-auto mb-3">
      <div class="card"><div class="card-header"><h3>Participação por Parceiro (quantidade)</h3></div><div class="card-body"><canvas id="cAParceiro" height="220"></canvas></div></div>
      <div class="card"><div class="card-header"><h3>Quantidade por Produto</h3></div><div class="card-body"><canvas id="cAProduto" height="220"></canvas></div></div>
    </div>
    <div class="card mb-3">
      <div class="card-header"><h3>🤝 Resumo por Parceiro</h3></div>
      <div class="table-wrap table-scroll" style="max-height:400px;"><table>
        <thead><tr><th>Parceiro</th><th>Quantidade</th><th>Kg</th><th>% Participação</th><th>Nº Pedidos</th><th>Pedidos Devolvidos</th></tr></thead>
        <tbody id="aResumoParceiro"></tbody>
      </table></div>
    </div>
    <div class="card mb-3">
      <div class="card-header"><h3>🏷️ Resumo por Parceiro e Produto</h3><span class="text-muted" id="apContagem"></span><button class="btn btn-secondary btn-sm" onclick="gerarRelatorioParceiroProduto()">🖨️ Relatório</button></div>
      <div class="table-wrap table-scroll" style="max-height:400px;"><table>
        <thead><tr><th>Parceiro</th><th>Produto</th><th>Qtde Vendida</th><th>Kg Vendido</th><th>Kg Comprado do Parceiro</th></tr></thead>
        <tbody id="aResumoParceiroProduto"></tbody>
      </table></div>
      <p class="text-muted" style="padding:8px 20px 14px;">Qtde/Kg Vendido = distribuído para pedidos daquele produto específico (aba "Distribuição Parceiros"). Kg Comprado do Parceiro = total entregue pelo parceiro no período (aba "Entregas Parceiros"), somando todas as culturas — não dá pra separar por produto/embalagem porque a entrega não é registrada nesse nível de detalhe.</p>
    </div>
    <div class="card">
      <div class="card-header"><h3>📋 Distribuição — Registros</h3><span class="text-muted" id="aContagem"></span>${_btnOrdemDataHtml('parceiros')}<button class="btn btn-secondary btn-sm" onclick="gerarRelatorioParceiros()">🖨️ Relatório</button></div>
      <div class="table-wrap table-scroll"><table>
        <thead><tr><th>Data</th><th>Semana</th><th>Pedido</th><th>NFe</th><th>Cliente</th><th>Parceiro</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Kg</th><th>Devolvido</th></tr></thead>
        <tbody id="aTabela"></tbody>
      </table></div>
      <p class="text-muted" style="padding:8px 20px 14px;">Data/Ano/Mês são obtidos cruzando o Número do Pedido com a aba "Controle de Pedidos". "Devolvido" é marcado quando existe um registro na aba "Devoluções" para o mesmo pedido, produto e parceiro.</p>
    </div>`;
  initDateRangePicker('faPeriodo', loadParceiros);
  _atualizarBotoesGranularidade();
}

const _debouncedLoadParceiros = _debounce(loadParceiros, 300);

function limparFiltrosParceiros() {
  clearDateRangePicker('faPeriodo');
  document.getElementById('faNfe').value = '';
  const f = (AppState.parceiros.resumo && AppState.parceiros.resumo.filtros) || {};
  populateMultiSelect('faParceiro', f.parceiros || [], [], loadParceiros);
  populateMultiSelect('faCliente',  f.clientes  || [], [], loadParceiros);
  populateMultiSelect('faProduto',  f.produtos  || [], [], loadParceiros);
  populateMultiSelect('faCultura',  f.culturas  || [], [], loadParceiros);
  loadParceiros();
}

function _filtrosParceiros() {
  const { data_inicio, data_fim } = getDateRangeFilter('faPeriodo');
  return {
    data_inicio, data_fim,
    parceiros: getSelectedMulti('faParceiro'),
    clientes:  getSelectedMulti('faCliente'),
    produtos:  getSelectedMulti('faProduto'),
    culturas:  getSelectedMulti('faCultura'),
    nfe: (document.getElementById('faNfe') || {}).value || ''
  };
}

function loadParceiros() {
  const f = _filtrosParceiros();
  showLoading(true);
  Promise.all([
    gsCached('listarDistribuicaoParceiros', App.token, {}),
    gsCached('listarDevolucoes', App.token, {}),
    gsCached('listarEntregas', App.token, {})
  ]).then(([todosRaw, devolucoesRaw, entregasRaw]) => {
    showLoading(false);
    const todos = _comCultura(todosRaw, 'produto');
    // O campo "devolvido" que vinha pronto do servidor era baseado no Status
    // do pedido, que não existe mais — recalcula aqui cruzando com a
    // quantidade real devolvida na aba Devoluções (por pedido + produto + parceiro).
    const devolvidoMap = {};
    (devolucoesRaw || []).forEach(d => {
      const chave = d.numero_pedido + '|' + d.produto + '|' + d.parceiro;
      devolvidoMap[chave] = (devolvidoMap[chave] || 0) + Number(d.quantidade || 0);
    });
    todos.forEach(r => {
      r.devolvido_qtde = devolvidoMap[r.numero_pedido + '|' + r.produto + '|' + r.parceiro] || 0;
      r.devolvido = r.devolvido_qtde > 0;
    });
    const dash   = _dashboardParceirosJS(todos, f);
    const linhas = _filtrarDistribuicaoJS(todos, f);
    AppState.parceiros.resumo = dash;
    AppState.parceiros.dados  = linhas;

    // Kg Comprado do Parceiro = total entregue (Entregas Parceiros) no mesmo
    // período/parceiro(s) filtrados na tela — Entregas não tem Cliente/Produto
    // pra cruzar com esses outros filtros, então só período e parceiro valem aqui.
    const entregasFiltradas = _filtrarPorLista(_filtrarPorData(entregasRaw || [], f, 'dia'), f.parceiros, 'parceiro');
    const kgCompradoPorParceiro = {};
    entregasFiltradas.forEach(r => {
      kgCompradoPorParceiro[r.parceiro] = (kgCompradoPorParceiro[r.parceiro] || 0) + Number(r.peso_kg || 0);
    });
    const resumoParceiroProduto = _resumoParceiroProdutoJS(linhas, kgCompradoPorParceiro);

    populateMultiSelect('faParceiro', dash.filtros.parceiros, f.parceiros, loadParceiros);
    populateMultiSelect('faCliente',  dash.filtros.clientes,  f.clientes,  loadParceiros);
    populateMultiSelect('faProduto',  dash.filtros.produtos,  f.produtos,  loadParceiros);
    populateMultiSelect('faCultura',  dash.filtros.culturas,  f.culturas,  loadParceiros);
    _renderKpisParceiros(dash.resumo);
    _renderChartsParceiros(dash);
    _renderResumoParceiros(dash.porParceiro);
    _renderResumoParceiroProduto(resumoParceiroProduto);
    _renderTabelaParceiros(linhas);
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function _renderResumoParceiroProduto(lista) {
  document.getElementById('apContagem').textContent = lista.length + ' item(ns)';
  const tbody = document.getElementById('aResumoParceiroProduto');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Nenhum registro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(r => `
    <tr>
      <td><strong>${r.parceiro}</strong></td>
      <td><span class="badge badge-${corProduto(r.produto)}">${r.produto}</span></td>
      <td>${fmtQtde(r.qtde, r.tipo)}</td>
      <td>${fmtKg(r.kg)}</td>
      <td>${fmtKg(r.kg_comprado)}</td>
    </tr>`).join('');
}

function _renderKpisParceiros(r) {
  document.getElementById('aKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value stat-verde">${fmtNum(r.total_fornecido)}</div><div class="stat-label">Total Fornecido</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${fmtKg(r.total_kg_fornecido)}</div><div class="stat-label">Total em Kg</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.num_parceiros)}</div><div class="stat-label">Parceiros</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.num_produtos)}</div><div class="stat-label">Produtos</div></div>
    <div class="stat-card"><div class="stat-value stat-vermelho">${fmtNum(r.total_pedidos_devolvidos)}</div><div class="stat-label">Pedidos Devolvidos</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--ink-2);">${fmtNum(r.total_linhas)}</div><div class="stat-label">Registros</div></div>`;
}

function setGranularidadeParceiros(g) {
  AppState.parceiros.granularidade = g;
  _atualizarBotoesGranularidade();
  if (AppState.parceiros.resumo) _renderChartPeriodoParceiros(AppState.parceiros.resumo);
}

function _atualizarBotoesGranularidade() {
  ['dia', 'semana', 'mes', 'ano'].forEach(g => {
    const btn = document.getElementById('btnGran_' + g);
    if (btn) btn.className = 'btn btn-sm ' + (g === AppState.parceiros.granularidade ? 'btn-primary' : 'btn-secondary');
  });
}

function _dadosPeriodoParceiros(dash, g) {
  if (g === 'dia')    return { labels: dash.porDia.map(s => fmtDate(s.periodo)),    valores: dash.porDia.map(s => s.kg) };
  if (g === 'mes')    return { labels: dash.porMes.map(s => fmtMesLabel(s.periodo)), valores: dash.porMes.map(s => s.kg) };
  if (g === 'ano')    return { labels: dash.porAno.map(s => s.periodo),              valores: dash.porAno.map(s => s.kg) };
  return { labels: dash.porSemana.map(s => 'Sem ' + s.semana), valores: dash.porSemana.map(s => s.kg) };
}

function _renderChartPeriodoParceiros(dash) {
  const store = AppState.parceiros.charts;
  const { labels, valores } = _dadosPeriodoParceiros(dash, AppState.parceiros.granularidade);
  createModernBarChart('cAPeriodo', labels, valores, { store, key: 'periodo', color: COR_CONCLUIDO, suffix: ' kg' });
}

function _renderChartsParceiros(dash) {
  const store = AppState.parceiros.charts;

  createModernBarChart('cAParceiro', dash.porParceiro.map(p => p.parceiro), dash.porParceiro.map(p => p.qtde), {
    store, key: 'parceiro', horizontal: true, color: COR_CONCLUIDO,
    tooltipCallbacks: { afterLabel: ctx => 'Kg: ' + fmtKg(dash.porParceiro[ctx.dataIndex].kg) }
  });

  createModernBarChart('cAProduto', dash.porProduto.map(p => p.produto), dash.porProduto.map(p => p.qtde), {
    store, key: 'produto', color: COR_SOLICITADO,
    tooltipCallbacks: { afterLabel: ctx => 'Kg: ' + fmtKg(dash.porProduto[ctx.dataIndex].kg) }
  });

  _renderChartPeriodoParceiros(dash);
}

function _renderResumoParceiros(porParceiro) {
  const tbody = document.getElementById('aResumoParceiro');
  if (porParceiro.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum parceiro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = porParceiro.map(p => `
    <tr>
      <td><strong>${p.parceiro}</strong></td>
      <td>${fmtNum(p.qtde)}</td>
      <td>${fmtKg(p.kg)}</td>
      <td>${p.pct}%</td>
      <td>${fmtNum(p.num_pedidos)}</td>
      <td>${p.pedidos_devolvidos > 0 ? `<span class="badge badge-vermelho">${p.pedidos_devolvidos}</span>` : '—'}</td>
    </tr>`).join('');
}

function _renderTabelaParceiros(linhas) {
  linhas = _ordenarPorData(linhas, 'parceiros');
  document.getElementById('aContagem').textContent = linhas.length + ' registro(s)';
  const tbody = document.getElementById('aTabela');
  if (linhas.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" class="empty-state">Nenhum registro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = linhas.map(r => `
    <tr>
      <td>${fmtDate(r.data)}</td>
      <td>${r.semana ?? '—'}</td>
      <td>${r.numero_pedido}</td>
      <td>${r.nfe || '—'}</td>
      <td>${r.cliente}</td>
      <td>${r.parceiro}</td>
      <td><span class="badge badge-${corProduto(r.produto)}">${r.produto}</span></td>
      <td>${r.tipo || '—'}</td>
      <td>${fmtNum(r.quantidade)}</td>
      <td>${r.peso_identificado ? fmtKgComUnidades(r.kg, r.unidades_estimadas) : '—'}</td>
      <td>${r.devolvido_qtde > 0 ? `<span class="badge badge-vermelho">${fmtQtde(r.devolvido_qtde, r.tipo)}</span>` : '—'}</td>
    </tr>`).join('');
}

function gerarRelatorioParceiros() {
  if (!AppState.parceiros.resumo) { toast('Aguarde os dados carregarem antes de gerar o relatório.', 'error'); return; }
  _pedirPeriodoRelatorio('faPeriodo', periodo => {
    const f = { ..._filtrosParceiros(), data_inicio: periodo.data_inicio, data_fim: periodo.data_fim };
    showLoading(true);
    Promise.all([
      gsCached('listarDistribuicaoParceiros', App.token, {}),
      gsCached('listarDevolucoes', App.token, {})
    ]).then(([todosRaw, devolucoesRaw]) => {
      showLoading(false);
      const todos = _comCultura(todosRaw, 'produto');
      const devolvidoMap = {};
      (devolucoesRaw || []).forEach(d => {
        const chave = d.numero_pedido + '|' + d.produto + '|' + d.parceiro;
        devolvidoMap[chave] = (devolvidoMap[chave] || 0) + Number(d.quantidade || 0);
      });
      todos.forEach(r => {
        r.devolvido_qtde = devolvidoMap[r.numero_pedido + '|' + r.produto + '|' + r.parceiro] || 0;
        r.devolvido = r.devolvido_qtde > 0;
      });
      const dash   = _dashboardParceirosJS(todos, f);
      const linhas = _filtrarDistribuicaoJS(todos, f);
      const r = dash.resumo;
      abrirRelatorioA4({
        titulo: 'Distribuição por Parceiros',
        subtitulo: 'Parceiros',
        tituloTabela: 'Registros de Distribuição',
        parametros: [
          { label: 'Período', valor: _relPeriodo(f) },
          { label: 'Parceiro', valor: _relLista(f.parceiros) },
          { label: 'Cliente', valor: _relLista(f.clientes) },
          { label: 'Produto', valor: _relLista(f.produtos) }
        ],
        resumo: [
          { label: 'Total Fornecido', valor: fmtNum(r.total_fornecido) },
          { label: 'Total em Kg', valor: fmtKg(r.total_kg_fornecido) },
          { label: 'Parceiros', valor: fmtNum(r.num_parceiros) },
          { label: 'Pedidos Devolvidos', valor: fmtNum(r.total_pedidos_devolvidos) }
        ],
        colunas: ['Data', 'Semana', 'Pedido', 'NFe', 'Cliente', 'Parceiro', 'Produto', 'Tipo', 'Quantidade', 'Devolvido'],
        linhas: linhas.map(x => [
          fmtDate(x.data), x.semana ?? '—', x.numero_pedido, x.nfe || '—', x.cliente, x.parceiro, x.produto,
          x.tipo || '—', fmtNum(x.quantidade), x.devolvido_qtde > 0 ? fmtQtde(x.devolvido_qtde, x.tipo) : '—'
        ])
      });
    }).catch(err => { showLoading(false); toast(err.message, 'error'); });
  });
}

function gerarRelatorioParceiroProduto() {
  if (!AppState.parceiros.resumo) { toast('Aguarde os dados carregarem antes de gerar o relatório.', 'error'); return; }
  _pedirPeriodoRelatorio('faPeriodo', periodo => {
    const f = { ..._filtrosParceiros(), data_inicio: periodo.data_inicio, data_fim: periodo.data_fim };
    showLoading(true);
    Promise.all([
      gsCached('listarDistribuicaoParceiros', App.token, {}),
      gsCached('listarEntregas', App.token, {})
    ]).then(([todosRaw, entregasRaw]) => {
      showLoading(false);
      const todos  = _comCultura(todosRaw, 'produto');
      const linhas = _filtrarDistribuicaoJS(todos, f);
      const entregasFiltradas = _filtrarPorLista(_filtrarPorData(entregasRaw || [], f, 'dia'), f.parceiros, 'parceiro');
      const kgCompradoPorParceiro = {};
      entregasFiltradas.forEach(r => {
        kgCompradoPorParceiro[r.parceiro] = (kgCompradoPorParceiro[r.parceiro] || 0) + Number(r.peso_kg || 0);
      });
      const lista = _resumoParceiroProdutoJS(linhas, kgCompradoPorParceiro);
      const totalKgVendido = lista.reduce((s, x) => s + x.kg, 0);
      const totalKgComprado = Object.values(kgCompradoPorParceiro).reduce((s, v) => s + v, 0);
      abrirRelatorioA4({
        titulo: 'Resumo por Parceiro e Produto',
        subtitulo: 'Parceiros',
        tituloTabela: 'Vendido por Produto x Comprado do Parceiro',
        parametros: [
          { label: 'Período', valor: _relPeriodo(f) },
          { label: 'Parceiro', valor: _relLista(f.parceiros) },
          { label: 'Produto', valor: _relLista(f.produtos) }
        ],
        resumo: [
          { label: 'Parceiros', valor: fmtNum(new Set(lista.map(x => x.parceiro)).size) },
          { label: 'Produtos', valor: fmtNum(new Set(lista.map(x => x.produto)).size) },
          { label: 'Total Kg Vendido', valor: fmtKg(totalKgVendido) },
          { label: 'Total Kg Comprado', valor: fmtKg(totalKgComprado) }
        ],
        colunas: ['Parceiro', 'Produto', 'Qtde Vendida', 'Kg Vendido', 'Kg Comprado do Parceiro'],
        linhas: lista.map(x => [
          x.parceiro, x.produto, fmtQtde(x.qtde, x.tipo), fmtKg(x.kg), fmtKg(x.kg_comprado)
        ])
      });
    }).catch(err => { showLoading(false); toast(err.message, 'error'); });
  });
}
</script>
<script>

  el.innerHTML = `

    </div>
    <div class="card mb-3">
      <div class="card-header"><h3>Ranking por Parceiro (kg)</h3></div>
      <div class="card-body"><canvas id="cERanking" height="260"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>🚚 Resumo por Parceiro</h3><button class="btn btn-secondary btn-sm" onclick="gerarRelatorioEntregas()">🖨️ Relatório</button></div>
      <div class="table-wrap table-scroll" style="max-height:440px;"><table>
        <thead><tr><th>Parceiro</th><th>Kg</th><th>Unidades</th><th>Média g/Un</th><th>Dias c/ Entrega</th><th>Média Kg/Dia</th></tr></thead>
        <tbody id="eResumoParceiro"></tbody>
      </table></div>

  _atualizarBotoesGranularidadeEntregas();
}

function limparFiltrosEntregas() {
  clearDateRangePicker('fePeriodo');
  const f = (AppState.entregas.resumo && AppState.entregas.resumo.filtros) || {};
  populateMultiSelect('feParceiro', f.parceiros || [], [], loadEntregas);
  populateMultiSelect('feClasse',   f.classes   || [], [], loadEntregas);
  populateMultiSelect('feCultura',  f.culturas  || [], [], loadEntregas);
  loadEntregas();
}

function _filtrosEntregas() {
  const { data_inicio, data_fim } = getDateRangeFilter('fePeriodo');
  return {
    data_inicio, data_fim,
    parceiros: getSelectedMulti('feParceiro'),
    classes:   getSelectedMulti('feClasse'),
    culturas:  getSelectedMulti('feCultura')
  };
}

function loadEntregas() {
  const f = _filtrosEntregas();
  showLoading(true);
  gsCached('listarEntregas', App.token, {}).then(todosRaw => {
    showLoading(false);
    const todos = _comCultura(todosRaw, 'classe');
    const dash  = _dashboardEntregasJS(todos, f);
    AppState.entregas.resumo = dash;
    populateMultiSelect('feParceiro', dash.filtros.parceiros, f.parceiros, loadEntregas);
    populateMultiSelect('feClasse',   dash.filtros.classes,   f.classes,   loadEntregas);
    populateMultiSelect('feCultura',  dash.filtros.culturas,  f.culturas,  loadEntregas);
    _renderKpisEntregas(dash.resumo);
    _renderChartPeriodoEntregas(dash);
    _renderChartRankingEntregas(dash);
    _renderResumoEntregas(dash.porParceiro);
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function _renderKpisEntregas(r) {
  document.getElementById('eKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value stat-verde">${fmtKg(r.total_kg)}</div><div class="stat-label">Total Entregue</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.total_unidades)}</div><div class="stat-label">Unidades</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${r.media_g_un ?? '—'}</div><div class="stat-label">Média g/Un</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${fmtNum(r.dias_com_entrega)}</div><div class="stat-label">Dias c/ Entrega</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.total_parceiros)}</div><div class="stat-label">Parceiros</div></div>`;
}

function setGranularidadeEntregas(g) {
  AppState.entregas.granularidade = g;
  _atualizarBotoesGranularidadeEntregas();
  if (AppState.entregas.resumo) _renderChartPeriodoEntregas(AppState.entregas.resumo);
}

function _atualizarBotoesGranularidadeEntregas() {
  ['dia', 'semana', 'mes'].forEach(g => {
    const btn = document.getElementById('btnGranE_' + g);
    if (btn) btn.className = 'btn btn-sm ' + (g === AppState.entregas.granularidade ? 'btn-primary' : 'btn-secondary');
  });
}

function _dadosPeriodoEntregas(dash, g) {
  if (g === 'dia')    return { labels: dash.porDia.map(s => fmtDate(s.data)), valores: dash.porDia.map(s => s.peso_kg) };
  if (g === 'semana') return { labels: dash.porSemana.map(s => s.periodo),    valores: dash.porSemana.map(s => s.peso_kg) };
  return { labels: dash.porMes.map(s => fmtMesLabel(s.periodo)), valores: dash.porMes.map(s => s.peso_kg) };
}

function _renderChartPeriodoEntregas(dash) {
  const store = AppState.entregas.charts;
  const { labels, valores } = _dadosPeriodoEntregas(dash, AppState.entregas.granularidade);
  createModernBarChart('cEPeriodo', labels, valores, { store, key: 'periodo', color: COR_CONCLUIDO, suffix: ' kg' });
}

function _renderChartRankingEntregas(dash) {
  const store = AppState.entregas.charts;
  createModernBarChart('cERanking', dash.porParceiro.map(p => p.parceiro), dash.porParceiro.map(p => p.peso_kg),
    { store, key: 'ranking', horizontal: true, color: COR_SOLICITADO, suffix: ' kg' });
}

function _renderResumoEntregas(porParceiro) {
  const tbody = document.getElementById('eResumoParceiro');
  if (porParceiro.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum parceiro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = porParceiro.map(p => `
    <tr>
      <td><strong>${p.parceiro}</strong></td>
      <td>${fmtKg(p.peso_kg)}</td>
      <td>${fmtNum(p.unidades)}</td>
      <td>${p.media_g_un ?? '—'}</td>
      <td>${fmtNum(p.dias_com_entrega)}</td>
      <td>${fmtKg(p.media_kg_dia)}</td>
    </tr>`).join('');
}

function gerarRelatorioEntregas() {
  if (!AppState.entregas.resumo) { toast('Aguarde os dados carregarem antes de gerar o relatório.', 'error'); return; }
  _pedirPeriodoRelatorio('fePeriodo', periodo => {
    const f = { ..._filtrosEntregas(), data_inicio: periodo.data_inicio, data_fim: periodo.data_fim };
    showLoading(true);
    gsCached('listarEntregas', App.token, {}).then(todosRaw => {
      showLoading(false);
      const todos = _comCultura(todosRaw, 'classe');
      const dash  = _dashboardEntregasJS(todos, f);
      const r = dash.resumo;
      abrirRelatorioA4({
        titulo: 'Entregas de Parceiros',
        subtitulo: 'Entregas',
        tituloTabela: 'Resumo por Parceiro',
        parametros: [
          { label: 'Período', valor: _relPeriodo(f) },
          { label: 'Parceiro', valor: _relLista(f.parceiros) },
          { label: 'Classe', valor: _relLista(f.classes) }
        ],
        resumo: [
          { label: 'Total Entregue', valor: fmtKg(r.total_kg) },
          { label: 'Unidades', valor: fmtNum(r.total_unidades) },
          { label: 'Dias c/ Entrega', valor: fmtNum(r.dias_com_entrega) },
          { label: 'Parceiros', valor: fmtNum(r.total_parceiros) }
        ],
        colunas: ['Parceiro', 'Kg', 'Unidades', 'Média g/Un', 'Dias c/ Entrega', 'Média Kg/Dia'],
        linhas: dash.porParceiro.map(p => [
          p.parceiro, fmtKg(p.peso_kg), fmtNum(p.unidades), p.media_g_un ?? '—', fmtNum(p.dias_com_entrega), fmtKg(p.media_kg_dia)
        ])
      });
    }).catch(err => { showLoading(false); toast(err.message, 'error'); });
  });
}
</script>
<script>
// ── ABA: DESCARTES (descartes no packing) ───────────────────
function renderDescartesTab() {

function limparFiltrosDescartes() {

}

function _filtrosDescartes() {
  const { data_inicio, data_fim } = getDateRangeFilter('fdPeriodo');

    data_inicio, data_fim,
    parceiros: getSelectedMulti('fdParceiro'),
    motivos:   getSelectedMulti('fdMotivo'),
    culturas:  getSelectedMulti('fdCultura')
  };
}

function loadDescartes() {
  const f = _filtrosDescartes();
  showLoading(true);
  gsCached('listarDescartes', App.token, {}).then(todosRaw => {
    showLoading(false);
    const todos  = _comCultura(todosRaw, 'classe');
    const dash   = _dashboardDescartesJS(todos, f);
    const linhas = _filtrarDescartesJS(todos, f);

    populateMultiSelect('fdParceiro', dash.filtros.parceiros, f.parceiros, loadDescartes);
    populateMultiSelect('fdMotivo',   dash.filtros.motivos,   f.motivos,   loadDescartes);

function _renderKpisDescartes(r) {
  document.getElementById('dKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value stat-vermelho">${fmtNum(r.total_descarte)}</div><div class="stat-label">Total Descarte</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${fmtKg(r.total_producao_kg)}</div><div class="stat-label">Produção (kg)</div></div>
    <div class="stat-card"><div class="stat-value stat-ambar">${r.pct_descarte !== null ? r.pct_descarte + '%' : '—'}</div><div class="stat-label">% Descarte</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.num_parceiros)}</div><div class="stat-label">Parceiros</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--ink-2);">${fmtNum(r.total_linhas)}</div><div class="stat-label">Registros</div></div>`;
}

function _renderChartsDescartes(dash) {
  const store = AppState.descartes.charts;
  const mapaCor = {};

  // Top 5 (já vêm ordenados por descarte desc) — com muito motivo/parceiro
  // diferente a legenda/barras ficavam grandes demais e o gráfico "quebrava".
  const top5Motivo    = dash.porMotivo.slice(0, 5);
  const top5Parceiro  = dash.porParceiro.slice(0, 5);

  createModernDoughnutChart('cDMotivo', top5Motivo.map(m => m.motivo), top5Motivo.map(m => m.descarte),
    top5Motivo.map(m => corPaleta(m.motivo, mapaCor)), { store, key: 'motivo' });

  createModernBarChart('cDParceiro', top5Parceiro.map(p => p.parceiro), top5Parceiro.map(p => p.descarte),
    { store, key: 'parceiro', horizontal: true, color: COR_DEVOLVIDO });

function _renderResumoDescartes(porParceiro) {
  const tbody = document.getElementById('dResumoParceiro');

    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Nenhum parceiro encontrado para os filtros atuais.</td></tr>';

  tbody.innerHTML = porParceiro.map(p => `
    <tr>
      <td><strong>${p.parceiro}</strong></td>
      <td>${fmtNum(p.descarte)}</td>
      <td>${fmtKg(p.producao_kg)}</td>
      <td>${p.pct !== null ? p.pct + '%' : '—'}</td>

}

function _renderTabelaDescartes(linhas) {
  linhas = _ordenarPorData(linhas, 'descartes');
  document.getElementById('dContagem').textContent = linhas.length + ' registro(s)';
  const tbody = document.getElementById('dTabela');
  if (linhas.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum registro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = linhas.map(r => `
    <tr>
      <td>${fmtDate(r.data)}</td>
      <td>${r.parceiro}</td>
      <td>${fmtKg(r.producao_kg)}</td>
      <td>${fmtNum(r.descarte)}</td>
      <td>${r.motivo || '—'}</td>
      <td>${r.classe || '—'}</td>

}

function gerarRelatorioDescartes() {

      showLoading(false);
      const todos  = _comCultura(todosRaw, 'classe');

      const linhas = _filtrarDescartesJS(todos, f);

      abrirRelatorioA4({
        titulo: 'Descarte de Parceiros',
        subtitulo: 'Descartes',
        tituloTabela: 'Registros de Descarte',
        parametros: [
          { label: 'Período', valor: _relPeriodo(f) },
          { label: 'Parceiro', valor: _relLista(f.parceiros) },
          { label: 'Motivo', valor: _relLista(f.motivos) }
        ],
        resumo: [
          { label: 'Total Descarte', valor: fmtNum(r.total_descarte) },
          { label: 'Produção (kg)', valor: fmtKg(r.total_producao_kg) },
          { label: '% Descarte', valor: r.pct_descarte !== null ? r.pct_descarte + '%' : '—' },
          { label: 'Parceiros', valor: fmtNum(r.num_parceiros) }
        ],
        colunas: ['Data', 'Parceiro', 'Produção (kg)', 'Descarte', 'Motivo', 'Classe'],
        linhas: linhas.map(x => [
          fmtDate(x.data), x.parceiro, fmtKg(x.producao_kg), fmtNum(x.descarte), x.motivo || '—', x.classe || '—'
        ])
      });

}
</script>

  const modo = AppState.devolucoes.modo;

    data_inicio, data_fim,
    parceiros: getSelectedMulti('fvParceiro'),
    clientes:  getSelectedMulti('fvCliente'),

    motivos:   getSelectedMulti('fvMotivo')

}

function loadDevolucoes() {
  const f  = _filtrosDevolucoes();
  const fn = AppState.devolucoes.modo === 'bonificacoes' ? 'listarBonificacoes' : 'listarDevolucoes';

    const dash   = _dashboardRegistroJS(todosRaw, f);

function _renderKpisDevolucoes(r) {
  document.getElementById('vKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value" style="color:var(--ink-2);">${fmtNum(r.total_linhas)}</div><div class="stat-label">Registros</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.total_quantidade)}</div><div class="stat-label">Quantidade</div></div>
    <div class="stat-card"><div class="stat-value stat-vermelho">${fmtKg(r.total_kg)}</div><div class="stat-label">Total (kg)</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.num_parceiros)}</div><div class="stat-label">Parceiros</div></div>`;
}

function _renderChartDevolucoes(porParceiro, porMotivo) {
  const store = AppState.devolucoes.charts;
  const cor = AppState.devolucoes.modo === 'bonificacoes' ? COR_CONCLUIDO : COR_DEVOLVIDO;
  createModernBarChart('cVRanking', porParceiro.map(p => p.parceiro), porParceiro.map(p => p.kg),
    { store, key: 'ranking', horizontal: true, color: cor, suffix: ' kg' });

  const mapaCor = {};
  createModernDoughnutChart('cVMotivo', porMotivo.map(m => m.motivo), porMotivo.map(m => m.kg),
    porMotivo.map(m => corPaleta(m.motivo, mapaCor)), { store, key: 'motivo' });
}

// Mostra só a conversão (o que NÃO foi digitado) — se Tipo de Unidade já é "kg",
// repetir o mesmo kg na coluna é redundante; mostra a estimativa em unidades, e
// vice-versa.
function _fmtConversaoRegistro(r) {
  if (!r.peso_identificado) return '—';
  const ehKg = String(r.tipo || '').toLowerCase().includes('kg');
  if (ehKg) return r.unidades_estimadas != null ? `≈${fmtNum(r.unidades_estimadas)} un` : '—';
  return fmtKg(r.kg);
}

function _renderTabelaDevolucoes(linhas) {
  linhas = _ordenarPorData(linhas, 'devolucoes');
  document.getElementById('vContagem').textContent = linhas.length + ' registro(s)';
  const tbody = document.getElementById('vTabela');
  if (linhas.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Nenhum registro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = linhas.map(r => `
    <tr>
      <td>${fmtDate(r.data_pedido)}</td>
      <td>${fmtDate(r.data)}</td>
      <td>${r.numero_pedido || '—'}</td>
      <td>${r.cliente || '—'}</td>
      <td>${r.parceiro || '—'}</td>
      <td>${r.produto}</td>
      <td>${fmtNum(r.quantidade)}</td>
      <td>${r.tipo || '—'}</td>
      <td>${_fmtConversaoRegistro(r)}</td>
      <td>${r.motivo || '—'}</td>
    </tr>`).join('');
}

function gerarRelatorioDevolucoes() {
  if (!AppState.devolucoes.resumo) { toast('Aguarde os dados carregarem antes de gerar o relatório.', 'error'); return; }
  const ehBonificacao = AppState.devolucoes.modo === 'bonificacoes';
  _pedirPeriodoRelatorio('fvPeriodo', periodo => {
    const f = { ..._filtrosDevolucoes(), data_inicio: periodo.data_inicio, data_fim: periodo.data_fim };
    const fn = ehBonificacao ? 'listarBonificacoes' : 'listarDevolucoes';
    showLoading(true);
    gsCached(fn, App.token, {}).then(todosRaw => {
      showLoading(false);
      const dash   = _dashboardRegistroJS(todosRaw, f);
      const linhas = _filtrarRegistroJS(todosRaw, f);
      const r = dash.resumo;
      abrirRelatorioA4({
        titulo: ehBonificacao ? 'Bonificações' : 'Devoluções',
        subtitulo: ehBonificacao ? 'Bonificações' : 'Devoluções',
        tituloTabela: 'Registros de ' + (ehBonificacao ? 'Bonificação' : 'Devolução'),
        parametros: [
          { label: 'Período', valor: _relPeriodo(f) },
          { label: 'Parceiro', valor: _relLista(f.parceiros) },
          { label: 'Cliente', valor: _relLista(f.clientes) },
          { label: 'Motivo', valor: _relLista(f.motivos) }
        ],
        resumo: [
          { label: 'Registros', valor: fmtNum(r.total_linhas) },
          { label: 'Quantidade', valor: fmtNum(r.total_quantidade) },
          { label: 'Total (kg)', valor: fmtKg(r.total_kg) },
          { label: 'Parceiros', valor: fmtNum(r.num_parceiros) }
        ],
        colunas: ['Data do Pedido', 'Data do Registro', 'Pedido', 'NFe', 'Cliente', 'Parceiro', 'Produto', 'Qtde', 'Tipo', 'Kg/Unid', 'Motivo'],
        linhas: linhas.map(x => [
          fmtDate(x.data_pedido), fmtDate(x.data), x.numero_pedido || '—', x.nfe || '—', x.cliente || '—', x.parceiro || '—', x.produto,
          fmtNum(x.quantidade), x.tipo || '—', _fmtConversaoRegistro(x), x.motivo || '—'
        ])
      });
    }).catch(err => { showLoading(false); toast(err.message, 'error'); });
  });
}
</script>
<script>
// ── ABA: RESUMO (visão executiva por parceiro) ──────────────
// Junta 5 números de 5 abas diferentes por parceiro: quanto entregou (Entregas
// Parceiros), quanto foi vendido/distribuído para pedidos (Distribuição Parceiros),
// quanto voltou do cliente final (lançado direto na aba Devoluções), quanto foi
// bonificado (lançado direto na aba Bonificações) e quanto foi descartado no
// packing (Descarte Parceiros).
const COR_DEVOLVIDO        = '#e34948';
const COR_BONIFICADO       = '#8b5cf6';
const COR_DESCARTE_PACKING = '#eb6834';
const CULTURA_ICONES = { 'Brócolis': '🥦', 'Tomate': '🍅', 'Pepino': '🥒', 'Couve-flor': '🌸', 'Alface': '🥬', 'Repolho': '🥬' };
function _iconeCultura(c) { return CULTURA_ICONES[c] || '🌱'; }

function renderResumoTab() {
  const el = document.getElementById('aba_resumo');
  el.innerHTML = `
    <div class="card mb-3 card-filtros">
      <div class="card-body" style="padding:12px 16px;">
        <div class="filter-bar">
          <div class="filter-item" style="min-width:230px;">
            <label class="form-label">Período</label>
            <input type="text" id="frPeriodo" class="form-control" placeholder="Período automático">
          </div>
          ${msFilterHtml('frParceiro', 'Parceiro')}
          ${msFilterHtml('frCultura', 'Cultura')}
          <div class="filter-item" style="flex:0 0 auto;display:flex;gap:8px;">
            <button class="btn btn-secondary" onclick="limparFiltrosResumo()">Limpar</button>
            <button class="btn btn-secondary" title="Ignorar cache e buscar dados novos" onclick="gsCacheClear();loadResumo();">🔄</button>
          </div>
        </div>
      </div>
    </div>
    <div class="card mb-3" style="padding:14px 16px;">
      <div id="rPills" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    </div>
    <div class="stats-grid mb-3" id="rKpis"></div>
    <div class="grid-auto mb-3">
      <div class="card">
        <div class="card-header"><h3>Comprado × Vendido (Kg)</h3></div>
        <div class="card-body"><canvas id="cRComparativo" height="300"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Vendido × Devolvido × Bonificado (Kg)</h3></div>
        <div class="card-body"><canvas id="cRVendidoDevolvido" height="300"></canvas></div>
      </div>
    </div>
    <div class="card mb-3">
      <div class="card-header"><h3>🛒 Comprado por Parceiro (Kg e Unidades)</h3></div>
      <div class="card-body"><canvas id="cRComprado" height="260"></canvas></div>
      <p class="text-muted" style="padding:0 20px 14px;">Kg e Unidades entregues por cada parceiro (campo "entrega de parceiro"), independente dos pedidos de clientes.</p>
    </div>
    <div class="card mb-3">
      <div class="card-header"><h3>🌱 Resumo por Cultura</h3></div>
      <div class="card-body"><div class="grid-auto" id="rCardsCultura"></div></div>
    </div>
    <div class="card mb-3">
      <div class="card-header"><h3>📊 Resumo por Parceiro</h3><button class="btn btn-secondary btn-sm" onclick="gerarRelatorioResumoParceiros()">🖨️ Relatório</button></div>
      <div class="table-wrap table-scroll" style="max-height:420px;"><table>
        <thead><tr>
          <th>Parceiro</th><th>Entregue</th><th>Vendido</th><th>Devolvido</th><th>Bonificado</th>
          <th>Líquido</th><th>% Dev.</th><th>% Aprov.</th>
        </tr></thead>
        <tbody id="rTabela"></tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>🏆 Ranking dos Parceiros</h3>
        <div style="display:flex;gap:4px;flex-wrap:wrap;" id="rRankBotoes">
          <button class="btn btn-sm" id="btnRank_liquido" onclick="setRankingResumo('liquido')">Venda Líquida</button>
          <button class="btn btn-sm" id="btnRank_devolucao" onclick="setRankingResumo('devolucao')">% Devolução</button>
          <button class="btn btn-sm" id="btnRank_aproveitamento" onclick="setRankingResumo('aproveitamento')">% Aproveitamento</button>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Parceiro</th><th>Vendido Líquido</th><th>% Devolução</th><th>% Aproveitamento</th></tr></thead>
        <tbody id="rRankingTabela"></tbody>
      </table></div>
      <div style="padding:10px 20px 14px;" id="rRankingToggle"></div>
      <p class="text-muted" style="padding:0 20px 14px;">
        Entregue = produção real (aba "Entregas Parceiros"). Vendido = kg alocado para atender pedidos de clientes (aba "Distribuição Parceiros").
        Devolvido = lançado direto na aba "Devoluções". Bonificado = lançado direto na aba "Bonificações" (não entra no cálculo de líquido/aproveitamento).
        % Aproveitamento = (Vendido − Devolvido) ÷ Entregue.
      </p>
    </div>`;
  initDateRangePicker('frPeriodo', loadResumo);
  _atualizarBotoesRankingResumo();
}

function limparFiltrosResumo() {
  clearDateRangePicker('frPeriodo');
  const f = (AppState.resumo.resumo && AppState.resumo.resumo.filtros) || {};
  populateMultiSelect('frParceiro', f.parceiros || [], [], loadResumo);
  populateMultiSelect('frCultura',  f.culturas  || [], [], loadResumo);
  loadResumo();
}

function _filtrosResumo() {
  const { data_inicio, data_fim } = getDateRangeFilter('frPeriodo');
  return {
    data_inicio, data_fim,
    parceiros: getSelectedMulti('frParceiro'),
    culturas:  getSelectedMulti('frCultura')
  };
}

// Pills de cultura — atalho visual pro mesmo filtro multi-seleção "frCultura".
function filtrarCulturaResumoTodos() {
  const allCb = document.querySelector('.ms-all-frCultura');
  if (allCb) { allCb.checked = true; toggleAllMultiSelect('frCultura'); }
}
function filtrarCulturaResumo(cultura) {
  selectOnlyMultiSelect('frCultura', cultura);
}
function _renderPillsCultura(culturas, selecionadas) {
  const el = document.getElementById('rPills');
  if (!el) return;
  const isTodos = !selecionadas || selecionadas.length === 0;
  let html = `<button type="button" class="pill-cultura ${isTodos ? 'active' : ''}" onclick="filtrarCulturaResumoTodos()">🌍 Todos</button>`;
  html += (culturas || []).map(c => {
    const ativo = !isTodos && selecionadas.includes(c);
    const safeJs = String(c).replace(/'/g, "\\'");
    return `<button type="button" class="pill-cultura ${ativo ? 'active' : ''}" onclick="filtrarCulturaResumo('${safeJs}')">${_iconeCultura(c)} ${c}</button>`;
  }).join('');
  el.innerHTML = html;
}

function loadResumo() {
  const f = _filtrosResumo();
  showLoading(true);
  Promise.all([
    gsCached('listarEntregas', App.token, {}),
    gsCached('listarDistribuicaoParceiros', App.token, {}),
    gsCached('listarDescartes', App.token, {}),
    gsCached('listarDevolucoes', App.token, {}),
    gsCached('listarBonificacoes', App.token, {})
  ]).then(([entregasRaw, distribRaw, descartesRaw, devolucoesRaw, bonificacoesRaw]) => {
    showLoading(false);
    const entregas     = _comCultura(entregasRaw, 'classe');
    const distrib      = _comCultura(distribRaw, 'produto');
    const descartes    = _comCultura(descartesRaw, 'classe');
    const devolucoes   = _comCultura(devolucoesRaw, 'produto');
    const bonificacoes = _comCultura(bonificacoesRaw, 'produto');
    const dash = _resumoParceirosJS(entregas, distrib, descartes, devolucoes, bonificacoes, f);
    AppState.resumo.resumo = dash;
    populateMultiSelect('frParceiro', dash.filtros.parceiros, f.parceiros, loadResumo);
    populateMultiSelect('frCultura',  dash.filtros.culturas,  f.culturas,  loadResumo);
    _renderPillsCultura(dash.filtros.culturas, f.culturas);
    _renderKpisResumo(dash.resumo);
    _renderChartsResumo(dash.porParceiro);
    _renderCardsCultura(dash.porCultura);
    _renderTabelaResumo(dash.porParceiro);
    _renderRankingResumo(dash.porParceiro);
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

// Antes de gerar o relatório, pergunta qual período usar (em vez de silenciosamente
// pegar o que já está no filtro da tela) — a pessoa pode querer imprimir um período
// diferente do que está navegando no momento, sem precisar mexer no filtro visível.
let _relPeriodoCallback = null;
// filtroId = id do input de período já visível na tela da aba (ex.: "frPeriodo",
// "fpPeriodo") — só pra pré-preencher o modal com o que já estava filtrado;
// passe null/vazio quando a aba não tiver um filtro de período próprio.
function _pedirPeriodoRelatorio(filtroId, callback) {
  _relPeriodoCallback = callback;
  const { data_inicio, data_fim } = filtroId ? getDateRangeFilter(filtroId) : {};
  document.getElementById('relPeriodoInicio').value = data_inicio || '';
  document.getElementById('relPeriodoFim').value = data_fim || '';
  document.getElementById('modalPeriodoRelatorio').classList.add('show');
}
function _confirmarPeriodoRelatorio() {
  const data_inicio = document.getElementById('relPeriodoInicio').value || '';
  const data_fim = document.getElementById('relPeriodoFim').value || '';
  fecharModal('modalPeriodoRelatorio');
  const cb = _relPeriodoCallback;
  _relPeriodoCallback = null;
  if (cb) cb({ data_inicio, data_fim });
}

function gerarRelatorioResumoParceiros() {
  if (!AppState.resumo.resumo) { toast('Aguarde os dados carregarem antes de gerar o relatório.', 'error'); return; }
  _pedirPeriodoRelatorio('frPeriodo', periodo => {
    const f = { ..._filtrosResumo(), data_inicio: periodo.data_inicio, data_fim: periodo.data_fim };
    showLoading(true);
    Promise.all([
      gsCached('listarEntregas', App.token, {}),
      gsCached('listarDistribuicaoParceiros', App.token, {}),
      gsCached('listarDescartes', App.token, {}),
      gsCached('listarDevolucoes', App.token, {}),
      gsCached('listarBonificacoes', App.token, {})
    ]).then(([entregasRaw, distribRaw, descartesRaw, devolucoesRaw, bonificacoesRaw]) => {
      showLoading(false);
      const entregas     = _comCultura(entregasRaw, 'classe');
      const distrib      = _comCultura(distribRaw, 'produto');
      const descartes    = _comCultura(descartesRaw, 'classe');
      const devolucoes   = _comCultura(devolucoesRaw, 'produto');
      const bonificacoes = _comCultura(bonificacoesRaw, 'produto');
      const dash = _resumoParceirosJS(entregas, distrib, descartes, devolucoes, bonificacoes, f);
      const r = dash.resumo;
      abrirRelatorioA4({
        titulo: 'Resumo Executivo por Parceiro',
        subtitulo: 'Resumo',
        tituloTabela: 'Resumo por Parceiro',
        parametros: [
          { label: 'Período', valor: _relPeriodo(f) },
          { label: 'Parceiro', valor: _relLista(f.parceiros) },
          { label: 'Cultura', valor: _relLista(f.culturas) }
        ],
        resumo: [
          { label: 'Total Entregue', valor: fmtKg(r.total_entregue_kg) },
          { label: 'Total Vendido', valor: fmtKg(r.total_vendido_kg) },
          { label: 'Total Devolvido', valor: fmtKg(r.total_devolvido_kg) },
          { label: '% Aproveitamento', valor: r.pct_aproveitamento != null ? r.pct_aproveitamento + '%' : '—' }
        ],
        colunas: ['Parceiro', 'Entregue', 'Vendido', 'Devolvido', 'Bonificado', 'Líquido', '% Dev.', '% Aprov.'],
        linhas: dash.porParceiro.map(p => [
          p.parceiro, fmtKg(p.entregue_kg), fmtKg(p.vendido_kg), fmtKg(p.devolvido_kg), fmtKg(p.bonificado_kg),
          fmtKg(p.vendido_liquido_kg), p.pct_devolucao != null ? p.pct_devolucao + '%' : '—',
          p.pct_aproveitamento != null ? p.pct_aproveitamento + '%' : '—'
        ])
      });
    }).catch(err => { showLoading(false); toast(err.message, 'error'); });
  });
}

function _renderKpisResumo(r) {
  document.getElementById('rKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value stat-azul">${fmtKg(r.total_entregue_kg)}</div><div class="stat-label">Entregue</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${fmtKg(r.total_vendido_kg)}</div><div class="stat-label">Vendido</div></div>
    <div class="stat-card"><div class="stat-value stat-vermelho">${fmtKg(r.total_devolvido_kg)}</div><div class="stat-label">Devolvido</div></div>
    <div class="stat-card"><div class="stat-value" style="color:${COR_BONIFICADO};">${fmtKg(r.total_bonificado_kg)}</div><div class="stat-label">Bonificado</div></div>
    <div class="stat-card"><div class="stat-value" style="color:${COR_DESCARTE_PACKING};">${fmtKg(r.total_descarte_packing_kg)}</div><div class="stat-label">Descarte Packing</div></div>
    <div class="stat-card"><div class="stat-value stat-vermelho">${r.pct_devolucao ?? '—'}%</div><div class="stat-label">% Devolução</div></div>
    <div class="stat-card"><div class="stat-value" style="color:${COR_DESCARTE_PACKING};">${r.pct_descarte_packing ?? '—'}%</div><div class="stat-label">% Descarte Packing</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${r.pct_aproveitamento ?? '—'}%</div><div class="stat-label">% Aproveitamento</div></div>`;
}

function _corAproveitamento(pct) {
  if (pct === null || pct === undefined) return '#94a3b8';
  if (pct >= 80) return '#16a34a';
  if (pct >= 50) return '#d97706';
  return '#dc2626';
}

function _renderChartsResumo(porParceiro) {
  const store = AppState.resumo.charts;

  createDualAxisBarChart('cRComparativo', porParceiro.map(p => p.parceiro), [
    { label: 'Comprado', data: porParceiro.map(p => p.entregue_kg), color: COR_SOLICITADO, axis: 'y' },
    { label: 'Vendido',  data: porParceiro.map(p => p.vendido_kg),  color: COR_CONCLUIDO,  axis: 'y' }
  ], { store, key: 'comparativo', yLabel: 'Kg' });

  createDualAxisBarChart('cRVendidoDevolvido', porParceiro.map(p => p.parceiro), [
    { label: 'Vendido',    data: porParceiro.map(p => p.vendido_kg),    color: COR_CONCLUIDO,  axis: 'y' },
    { label: 'Devolvido',  data: porParceiro.map(p => p.devolvido_kg),  color: COR_DEVOLVIDO,  axis: 'y' },
    { label: 'Bonificado', data: porParceiro.map(p => p.bonificado_kg), color: COR_BONIFICADO, axis: 'y' }
  ], { store, key: 'vendidoDevolvido', yLabel: 'Kg' });

  createDualAxisBarChart('cRComprado', porParceiro.map(p => p.parceiro), [
    { label: 'Comprado (Kg)',       data: porParceiro.map(p => p.entregue_kg),       color: COR_SOLICITADO, axis: 'y' },
    { label: 'Comprado (Unidades)', data: porParceiro.map(p => p.entregue_unidades), color: COR_CONCLUIDO,  axis: 'y1' }
  ], { store, key: 'comprado', yLabel: 'Kg', y1Label: 'Unidades' });
}

function _renderCardsCultura(porCultura) {
  const el = document.getElementById('rCardsCultura');
  if (!el) return;
  if (porCultura.length === 0) {
    el.innerHTML = '<div class="empty-state">Nenhuma cultura encontrada para os filtros atuais.</div>';
    return;
  }
  el.innerHTML = porCultura.map(c => `
    <div class="card cultura-card">
      <div class="cultura-icone">${_iconeCultura(c.cultura)}</div>
      <div class="cultura-nome">${c.cultura}</div>
      <div class="cultura-linha"><span>Entregue</span><strong>${fmtKg(c.entregue_kg)}</strong></div>
      <div class="cultura-linha"><span>Vendido</span><strong>${fmtKg(c.vendido_kg)}</strong></div>
      <div class="cultura-linha"><span>Devolvido</span><strong>${fmtKg(c.devolvido_kg)}</strong></div>
      <div class="cultura-linha"><span>Bonificado</span><strong>${fmtKg(c.bonificado_kg)}</strong></div>
      <div class="cultura-linha"><span>Líquido</span><strong>${fmtKg(c.vendido_liquido_kg)}</strong></div>
      <div class="cultura-rodape">
        <span style="font-weight:800;color:${COR_DEVOLVIDO};">${c.pct_devolucao ?? '—'}%</span>
        <span style="font-weight:800;color:${_corAproveitamento(c.pct_aproveitamento)};">${c.pct_aproveitamento ?? '—'}%</span>
      </div>
    </div>`).join('');
}

function _renderTabelaResumo(porParceiro) {
  const tbody = document.getElementById('rTabela');
  if (porParceiro.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Nenhum parceiro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = porParceiro.map(p => `
    <tr>
      <td><strong>${p.parceiro}</strong></td>
      <td>${fmtKg(p.entregue_kg)}</td>
      <td>${fmtKg(p.vendido_kg)}</td>
      <td>${p.devolvido_kg > 0 ? `<span class="badge badge-vermelho">${fmtKg(p.devolvido_kg)}</span>` : fmtKg(0)}</td>
      <td>${p.bonificado_kg > 0 ? `<span class="badge" style="background:${COR_BONIFICADO}20;color:${COR_BONIFICADO};">${fmtKg(p.bonificado_kg)}</span>` : fmtKg(0)}</td>
      <td>${fmtKg(p.vendido_liquido_kg)}</td>
      <td>${p.pct_devolucao ?? '—'}%</td>
      <td><span class="badge" style="background:${_corAproveitamento(p.pct_aproveitamento)}20;color:${_corAproveitamento(p.pct_aproveitamento)};">${p.pct_aproveitamento ?? '—'}%</span></td>
    </tr>`).join('');
}

// ── Ranking dos Parceiros — 3 modos de ordenação + top 5 / ver todos ──
const MEDALHAS_RANKING = ['🥇', '🥈', '🥉'];
function setRankingResumo(modo) {
  AppState.resumo.rankOrdenacao = modo;
  _atualizarBotoesRankingResumo();
  if (AppState.resumo.resumo) _renderRankingResumo(AppState.resumo.resumo.porParceiro);
}
function _atualizarBotoesRankingResumo() {
  ['liquido', 'devolucao', 'aproveitamento'].forEach(m => {
    const btn = document.getElementById('btnRank_' + m);
    if (btn) btn.className = 'btn btn-sm ' + (m === AppState.resumo.rankOrdenacao ? 'btn-primary' : 'btn-secondary');
  });
}
function toggleRankingCompletoResumo() {
  AppState.resumo.rankMostrarTodos = !AppState.resumo.rankMostrarTodos;
  if (AppState.resumo.resumo) _renderRankingResumo(AppState.resumo.resumo.porParceiro);
}
function _renderRankingResumo(porParceiro) {
  const tbody = document.getElementById('rRankingTabela');
  if (!tbody) return;
  const comparadores = {
    liquido:        (a, b) => b.vendido_liquido_kg - a.vendido_liquido_kg,
    devolucao:      (a, b) => (a.pct_devolucao ?? 999) - (b.pct_devolucao ?? 999),
    aproveitamento: (a, b) => (b.pct_aproveitamento ?? -1) - (a.pct_aproveitamento ?? -1)
  };
  const ordenado = [...porParceiro].sort(comparadores[AppState.resumo.rankOrdenacao] || comparadores.liquido);
  const mostrarTodos = AppState.resumo.rankMostrarTodos;
  const lista = mostrarTodos ? ordenado : ordenado.slice(0, 5);

  if (lista.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Nenhum parceiro encontrado para os filtros atuais.</td></tr>';
  } else {
    tbody.innerHTML = lista.map((p, i) => `
      <tr>
        <td>${MEDALHAS_RANKING[i] || (i + 1)}</td>
        <td><strong>${p.parceiro}</strong></td>
        <td>${fmtKg(p.vendido_liquido_kg)}</td>
        <td>${p.pct_devolucao ?? '—'}%</td>
        <td><span class="badge" style="background:${_corAproveitamento(p.pct_aproveitamento)}20;color:${_corAproveitamento(p.pct_aproveitamento)};">${p.pct_aproveitamento ?? '—'}%</span></td>
      </tr>`).join('');
  }

  const toggleEl = document.getElementById('rRankingToggle');
  if (toggleEl) {
    toggleEl.innerHTML = ordenado.length > 5
      ? `<a href="#" onclick="toggleRankingCompletoResumo();return false;" style="font-size:12.5px;font-weight:700;color:var(--verde);">${mostrarTodos ? '← Ver top 5' : 'Ver todos os parceiros (' + ordenado.length + ') →'}</a>`
      : '';
  }
}
</script>

let _lpProdutoSeq = 0, _lpParceiroSeq = 0;
function _lpProdutoBlocoHtml(produtoId) {
