<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SPG · Controle de Pedidos</title>

  <!-- PWA: instalável como aplicativo (manifest.json serve de fallback estático;
       applyBrandAssets() abaixo regrava tudo em runtime, então funciona mesmo se o
       arquivo manifest.json não estiver disponível no host) -->
  <link rel="manifest" id="siteManifest" href="manifest.json">
  <meta name="theme-color" content="#087a4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SPG Pedidos">
  <link rel="icon" id="siteFavicon" href="https://i.imgur.com/vOyYWgp.png">
  <link rel="apple-touch-icon" id="siteAppleTouchIcon" href="https://i.imgur.com/vOyYWgp.png">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script>
    if (window.Chart && window.ChartDataLabels) {
      Chart.register(ChartDataLabels);
      Chart.defaults.set('plugins.datalabels', { display: false });
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
  <style>
    :root{
      color-scheme:light;
      --page:#f3f6f4; --surface:#ffffff; --surface-2:#f6faf7; --surface-3:#eef4f0;
      --surface-translucent:rgba(255,255,255,.88);
      --ink:#101f16; --ink-2:#43534a; --muted:#75837b; --line:#e1e8e3; --line-strong:#ccd8d0; --border:rgba(14,28,20,.08);
      --brand:#087a4a; --brand-dark:#065c38; --brand-light:#12a565; --brand-soft:#e7f4ed; --brand-soft-strong:#cfeadd;
      --critical:#cf3b3b; --critical-soft:#fdeeee; --good:#0ca30c; --warning:#f5a913; --warning-soft:rgba(245,169,19,.14); --warning-ink:#a06908;
      --cloud:#1769a6; --cloud-soft:#e8f2fd; --cloud-soft-strong:#cfe4f7;
      --shadow-sm:0 2px 10px rgba(9,40,25,.05); --shadow-md:0 12px 32px rgba(9,40,25,.09); --shadow-lg:0 28px 64px rgba(9,40,25,.15);
      --verde:var(--brand); --verde-med:var(--brand-light); --vermelho:var(--critical);
    }
    @media(prefers-color-scheme:dark){
      :root:where(:not([data-theme="light"])){
        color-scheme:dark;
        --page:#0c0f0d; --surface:#161a17; --surface-2:#1b201d; --surface-3:#212723;
        --surface-translucent:rgba(22,26,23,.84);
        --ink:#f2f6f3; --ink-2:#c4cdc6; --muted:#8a968e; --line:#293029; --line-strong:#39443b; --border:rgba(255,255,255,.09);
        --brand:#1fbf6d; --brand-dark:#189254; --brand-light:#4fd68c; --brand-soft:rgba(31,191,109,.13); --brand-soft-strong:rgba(31,191,109,.26);
        --critical:#e87070; --critical-soft:rgba(232,112,112,.15); --good:#22c55e; --warning:#fbbf24; --warning-soft:rgba(251,191,36,.16); --warning-ink:#fbbf24;
        --cloud:#6fb2ef; --cloud-soft:rgba(56,142,220,.16); --cloud-soft-strong:rgba(56,142,220,.32);
        --shadow-sm:0 2px 12px rgba(0,0,0,.35); --shadow-md:0 14px 36px rgba(0,0,0,.45); --shadow-lg:0 30px 72px rgba(0,0,0,.55);
      }
    }
    :root[data-theme="dark"]{
      color-scheme:dark;
      --page:#0c0f0d; --surface:#161a17; --surface-2:#1b201d; --surface-3:#212723;
      --surface-translucent:rgba(22,26,23,.84);
      --ink:#f2f6f3; --ink-2:#c4cdc6; --muted:#8a968e; --line:#293029; --line-strong:#39443b; --border:rgba(255,255,255,.09);
      --brand:#1fbf6d; --brand-dark:#189254; --brand-light:#4fd68c; --brand-soft:rgba(31,191,109,.13); --brand-soft-strong:rgba(31,191,109,.26);
      --critical:#e87070; --critical-soft:rgba(232,112,112,.15); --good:#22c55e; --warning:#fbbf24; --warning-soft:rgba(251,191,36,.16); --warning-ink:#fbbf24;
      --cloud:#6fb2ef; --cloud-soft:rgba(56,142,220,.16); --cloud-soft-strong:rgba(56,142,220,.32);
      --shadow-sm:0 2px 12px rgba(0,0,0,.35); --shadow-md:0 14px 36px rgba(0,0,0,.45); --shadow-lg:0 30px 72px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box;}
    /* overflow-x:hidden só no <html> (não no <body>) — colocar em ambos faz o
       body virar seu próprio container de rolagem (mesmo só com overflow-x),
       e isso quebra o position:sticky da .navbar: ela some ao rolar em vez de
       ficar grudada no topo. Com overflow só no html, o body fica com overflow
       padrão (visible) e a .navbar gruda certinho no viewport de verdade. */
    html{overflow-x:hidden;max-width:100%;background:var(--page);}
    body{margin:0;max-width:100%;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);
      background:radial-gradient(circle at 0 -10%,rgba(18,165,101,.08),transparent 34rem),var(--page);
      min-height:100vh;transition:background .2s,color .2s;}
    .navbar{position:sticky;top:12px;z-index:40;margin:12px 16px 0;background:var(--surface-translucent);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;
      padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;box-shadow:var(--shadow-md);}
    .navbar-brand{display:flex;align-items:center;gap:10px;}
    .navbar-brand img{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:3px;box-shadow:0 8px 20px rgba(8,122,74,.15);}
    .navbar-brand h1{font-size:13px;font-weight:900;margin:0;color:var(--ink);}
    .navbar-brand p{font-size:10px;color:var(--muted);margin:0;}
    .navbar-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-size:12px;font-weight:700;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s,color .15s;line-height:1;}
    .btn:hover{transform:translateY(-1px);}
    .btn:active{transform:scale(.97);}
    .btn-primary{background:linear-gradient(135deg,var(--brand-light),var(--brand-dark));color:#fff;box-shadow:0 10px 22px rgba(8,122,74,.28);}
    .btn-primary:hover{filter:brightness(1.05);}
    .btn-secondary{background:var(--surface-2);color:var(--ink-2);border-color:var(--line);}
    .btn-secondary:hover{background:var(--surface-3);border-color:var(--line-strong);}
    .btn-secondary.is-active{background:var(--brand-soft);border-color:var(--brand-soft-strong);color:var(--brand-dark);}
    .btn-danger{background:linear-gradient(135deg,#ec6b78,var(--critical));color:#fff;box-shadow:0 10px 22px rgba(207,59,59,.26);}
    .btn-danger:hover{filter:brightness(1.05);}
    .btn-sm{padding:5px 10px;font-size:11px;border-radius:9px;}
    .btn-icon{padding:6px;border-radius:9px;background:transparent;border:none;cursor:pointer;color:var(--muted);}
    .btn-icon:hover{background:var(--surface-2);color:var(--ink);}
    /* Botões só com ícone (topbar) — quadrado arredondado, sem texto à mostra;
       o rótulo só aparece num balãozinho flutuante ao passar o mouse/focar
       (position:absolute, nunca empurra os vizinhos, então a barra não "treme"). */
    .btn-icon-only{width:38px;height:38px;padding:0;justify-content:center;border-radius:12px;}
    .btn-icon-only svg{width:18px;height:18px;flex:none;}
    .btn-grow{position:relative;}
    .btn-grow .btn-label{
      position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
      background:var(--ink);color:var(--page);padding:6px 11px;border-radius:8px;
      font-size:12px;font-weight:700;white-space:nowrap;
      opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s ease;
      box-shadow:var(--shadow-md);z-index:60;
    }
    .btn-grow:hover .btn-label,.btn-grow:focus .btn-label,.btn-grow:focus-visible .btn-label{opacity:1;visibility:visible;}
    .card{background:var(--surface);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;max-width:100%;min-width:0;transition:box-shadow .15s,border-color .15s,background .2s,color .2s;}
    .card-filtros{overflow:visible;}
    canvas{max-width:100%;}
    .card-header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;}
    .card-header h3{margin:0;font-size:13px;font-weight:700;color:var(--ink);flex:1 1 auto;min-width:0;overflow-wrap:break-word;word-break:break-word;}
    .card-header > button, .card-header > a{flex-shrink:0;}
    .card-body{padding:20px;}
    .form-group{margin-bottom:14px;}
    .form-label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:5px;letter-spacing:.05em;}
    .form-control{width:100%;padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:12px;font-size:13px;background:var(--surface-2);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s,background .15s;}
    .form-control:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft);}
    .form-row{display:grid;gap:0 14px;}
    .form-row.cols-2{grid-template-columns:1fr 1fr;}
    @media(max-width:640px){.form-row.cols-2{grid-template-columns:1fr;}}
    .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
    .filter-item{min-width:140px;flex:1 1 140px;}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;}
    .grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
    .pill-cultura{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:800;color:var(--ink-2);cursor:pointer;transition:all .15s;}
    .pill-cultura:hover{border-color:var(--verde);}
    .pill-cultura.active{background:var(--verde);border-color:var(--verde);color:#fff;}
    .cultura-card{text-align:center;padding:16px 14px;}
    .cultura-card .cultura-icone{font-size:30px;line-height:1;}
    .cultura-card .cultura-nome{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 12px;color:var(--ink);}
    .cultura-card .cultura-linha{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--ink-2);}
    .cultura-card .cultura-rodape{display:flex;justify-content:space-around;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
    .tabbar{border-bottom:1px solid var(--line);display:flex;gap:28px;overflow-x:auto;margin-bottom:20px;}
    .tab-btn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 2px 12px;border:none;background:none;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;white-space:nowrap;color:var(--muted);transition:color .2s ease;flex-shrink:0;}
    .tab-btn::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--verde);border-radius:3px 3px 0 0;transform:scaleX(0);transform-origin:left;transition:transform .3s ease;}
    .tab-btn:hover{color:var(--ink-2);}
    .tab-btn.active{color:var(--ink);font-weight:800;}
    .tab-btn.active::after{transform:scaleX(1);}
    .tab-icon{width:15px;height:15px;flex-shrink:0;}
    .tab-label{line-height:1;}
    .stat-card{background:var(--surface);border-radius:16px;padding:14px;border:1px solid var(--line);box-shadow:var(--shadow-sm);text-align:center;}
    .stat-value{font-size:20px;font-weight:900;line-height:1.1;}
    .stat-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}
    .stat-verde{color:var(--verde);} .stat-azul{color:var(--cloud);} .stat-ambar{color:var(--warning);} .stat-vermelho{color:var(--critical);}
    .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap;}
    .badge-verde{background:var(--brand-soft);color:var(--brand-dark);} .badge-amarelo{background:var(--warning-soft);color:var(--warning-ink);}
    .badge-vermelho{background:var(--critical-soft);color:var(--critical);} .badge-azul{background:var(--cloud-soft);color:var(--cloud);} .badge-cinza{background:var(--surface-2);color:var(--ink-2);}
    .table-wrap{overflow-x:auto;}
    .table-scroll{max-height:560px;overflow-y:auto;}
    .table-scroll thead th{position:sticky;top:0;z-index:1;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th{padding:8px 12px;text-align:left;background:var(--surface-2);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line);}
    td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;}
    tr:hover td{background:var(--surface-2);}
    .modal-overlay{position:fixed;inset:0;background:rgba(4,10,7,.5);z-index:50;display:none;justify-content:center;align-items:center;backdrop-filter:blur(4px);}
    .modal-overlay.show{display:flex;}
    .modal{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:20px;padding:24px;width:90%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .2s ease;}
    .modal.modal-lg{max-width:920px;}
    @keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
    .modal-header h3{margin:0;font-size:15px;font-weight:800;color:var(--ink);}
    .modal-footer{display:flex;gap:8px;margin-top:18px;}
    .modal-footer .btn{flex:1;justify-content:center;}
    .toast-container{position:fixed;bottom:20px;right:20px;left:20px;z-index:99;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
    .toast{padding:12px 16px;border-radius:12px;font-size:12px;font-weight:600;box-shadow:var(--shadow-md);animation:slideUp .2s;display:flex;align-items:center;gap:8px;min-width:220px;max-width:320px;width:100%;}
    .toast-success{background:var(--good);color:#fff;} .toast-error{background:var(--critical);color:#fff;} .toast-info{background:var(--cloud);color:#fff;}
    .spinner{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-overlay{position:fixed;inset:0;background:var(--surface-translucent);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
    .hidden{display:none!important;} .text-center{text-align:center;} .text-muted{color:var(--muted);font-size:11px;}
    .mb-3{margin-bottom:12px;} .mt-2{margin-top:8px;} .font-mono{font-family:monospace;}
    .empty-state{padding:32px 16px;text-align:center;color:var(--muted);font-size:12px;}
    /* ── Hub "Gerenciar sistema" da aba Admin ──────────────── */
    .sys-section{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px;}
    .sys-section:first-child{margin-top:0;}
    .sys-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .sys-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;
      background:var(--surface-2);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;
      transition:transform .15s,box-shadow .15s,border-color .15s;}
    .sys-item:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
    .sys-item .sys-ico{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;
      background:var(--brand-soft);color:var(--brand-dark);}
    .sys-item .sys-ico svg{width:19px;height:19px;}
    .sys-item .sys-ico.cloud{background:var(--cloud-soft);color:var(--cloud);}
    .sys-txt{min-width:0;}
    .sys-txt strong{display:block;font-size:13px;font-weight:800;color:var(--ink);}
    .sys-txt span{display:block;margin-top:2px;font-size:11.5px;color:var(--muted);line-height:1.4;}
    @media(max-width:640px){.sys-grid{grid-template-columns:1fr;}}
    .theme-toggle{position:relative;}
    .theme-toggle svg{width:17px;height:17px;}
    @media(max-width:640px){.hide-mobile{display:none;}}
    @media(max-width:520px){
      .navbar{padding:8px 10px;}
      .navbar-brand img{width:26px;height:26px;}
      .navbar-brand h1{font-size:12px;}
      .card-body{padding:14px;}
      .card-header{padding:10px 14px;}
      .card-header h3{font-size:12px;}
      .modal{padding:18px;width:94%;}
      .stat-value{font-size:17px;}
      table{font-size:11px;}
      th,td{padding:7px 8px;}
    }
    @media(max-width:700px){
      .tabbar{
        position:fixed;left:0;right:0;bottom:0;z-index:45;
        overflow-x:visible;justify-content:space-around;
        border-bottom:none;border-top:1px solid var(--line);
        box-shadow:0 -8px 24px rgba(9,40,25,.08);
        padding:6px 2px calc(6px + env(safe-area-inset-bottom));
        background:var(--surface-translucent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:0;
      }
      .tab-btn{
        position:relative;flex:1;min-width:0;flex-direction:column;justify-content:center;
        gap:3px;padding:8px 2px 6px;font-weight:600;text-transform:none;letter-spacing:normal;
        border-bottom:none;border-radius:0;color:var(--muted);
      }
      .tab-btn::after{display:none;}
      .tab-icon{width:20px;height:20px;padding:3px 14px;border-radius:999px;box-sizing:content-box;transition:background-color .15s;}
      .tab-label{font-size:9.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:font-weight .15s;}
      .tab-btn.active{color:var(--verde);}
      .tab-btn.active .tab-icon{background:var(--brand-soft);}
      .tab-btn.active .tab-label{font-weight:800;}
      .tab-btn.active::before{
        content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
        width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--verde);
      }
      body{padding-bottom:64px;}
    }

    /* ── Multi-seleção (dropdown checkbox + "Todos" + "Somente") ─────── */
    .ms-wrap{position:relative;}
    .ms-box{width:100%;padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:12px;font-size:13px;background:var(--surface-2);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;height:38px;}
    .ms-box:hover{border-color:var(--verde);}
    .ms-box-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ms-box-arrow{color:var(--muted);font-size:10px;flex-shrink:0;}
    .dropdown-menu{position:absolute;z-index:55;min-width:220px;max-width:320px;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;}
    .dropdown-menu .ms-list{max-height:220px;overflow-y:auto;}
    .ms-all-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--line);margin-bottom:2px;}
    .ms-all-row:hover{background:var(--surface-2);}
    .ms-all-row span{font-size:12px;font-weight:800;color:var(--ink);}
    .ms-opt-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:9px;}
    .ms-opt-row:hover{background:var(--surface-2);}
    .ms-opt-row label{display:flex;align-items:center;gap:7px;flex:1;min-width:0;cursor:pointer;}
    .ms-opt-row label span{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ms-opt-row input[type=checkbox], .ms-all-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--verde);cursor:pointer;flex-shrink:0;}
    .ms-only-btn{display:none;flex-shrink:0;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--verde);background:var(--brand-soft);border:1px solid var(--brand-soft-strong);border-radius:6px;padding:2px 6px;cursor:pointer;}
    .ms-opt-row:hover .ms-only-btn{display:inline-block;}
    .ms-empty{padding:10px;text-align:center;font-size:11px;color:var(--muted);}

    /* ── Combobox moderno (substitui o <input list="..."> nativo do navegador) ── */
    /* position:fixed (não absolute) e anexado direto no <body> pelo JS — os
       cards do painel usam overflow:hidden pros cantos arredondados, o que
       cortava/escondia o menu quando ele passava do fundo do card. Fixed +
       fora do card ignora esse recorte e a posição é calculada via JS
       (segue o campo mesmo se a página rolar). */
    .combo-menu{position:fixed;z-index:200;box-sizing:border-box;max-height:220px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;}
    .combo-menu[hidden]{display:none;}
    .combo-option{padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .combo-option:hover,.combo-option.combo-active{background:var(--surface-2);}
    .combo-empty{padding:10px 8px;text-align:center;font-size:11px;color:var(--muted);}
    .combo-field-wrap{position:relative;}
    .combo-field-wrap .form-control{padding-right:30px;}
    .combo-clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:50%;}
    .combo-clear-btn:hover{background:var(--surface-2);color:var(--ink);}
    /* :placeholder-shown só é verdadeiro com o campo vazio (por isso o combo
       sempre recebe um placeholder="", mesmo em branco) — dispensa rastrear
       o valor por JS pra saber quando exibir o "x", cobrindo até valor
       setado por código (edição/distribuir), não só o que a pessoa digita. */
    .combo-field-wrap .form-control:placeholder-shown ~ .combo-clear-btn{display:none;}

    /* ── Calendário de intervalo de datas (flatpickr custom) ──────────── */
    .flatpickr-calendar{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg) !important;border:1px solid var(--line) !important;border-radius:14px !important;overflow:hidden;width:auto !important;max-width:95vw !important;}
    .flatpickr-calendar.open, .flatpickr-calendar[style*="display: block"]{display:flex !important;flex-direction:row !important;}
    .flatpickr-day.hidden{display:flex !important;visibility:hidden !important;}
    .dayContainer{justify-content:flex-start !important;}
    .flatpickr-shortcuts-sidebar{width:170px;background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 6px;}
    .fp-shortcut-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:11px;font-weight:700;color:var(--ink-2);border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:2px;}
    .fp-shortcut-item:hover{background:var(--surface-3);color:var(--verde);}
    .fp-shortcut-item.active{background:var(--brand-soft);color:var(--brand-dark);}
    .fp-calendar-main{display:flex;flex-direction:column;background:var(--surface);}
    .flatpickr-innerContainer{padding:0 10px;}
    .flatpickr-months{position:relative !important;width:100%;}
    .flatpickr-prev-month{left:10px !important;}
    .flatpickr-next-month{right:10px !important;}
    .flatpickr-current-month,.flatpickr-monthDropdown-months,.flatpickr-weekday,.flatpickr-day{color:var(--ink) !important;}
    .flatpickr-day.flatpickr-disabled,.flatpickr-day.prevMonthDay,.flatpickr-day.nextMonthDay{color:var(--muted) !important;}
    .flatpickr-monthDropdown-months{cursor:pointer;border-radius:6px;padding:2px 6px;transition:background-color .15s;background:transparent;}
    .flatpickr-monthDropdown-months:hover{background:var(--surface-3);}
    .flatpickr-monthDropdown-months option{background:var(--surface);color:var(--ink);}
    .numInputWrapper{cursor:text;border-radius:6px;}
    .numInputWrapper input{color:var(--ink);}
    .numInputWrapper:hover{background:var(--surface-3);}
    .numInputWrapper .arrowUp, .numInputWrapper .arrowDown{opacity:.55 !important;}
    .numInputWrapper:hover .arrowUp, .numInputWrapper:hover .arrowDown{opacity:1 !important;}
    .fp-header-text{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
    /* Dois mini-calendários independentes (início / término), cada um com sua
       própria navegação de mês — em vez de um único par de setas movendo os
       dois meses juntos. */
    .fp-dual-wrap{display:flex;gap:24px;padding:14px 20px 0;}
    .fp-dual-col{flex:1;min-width:0;}
    .fp-dual-col .fp-header-text{text-align:center;margin-bottom:6px;}
    .fp-dual-input{display:none;}
    .fp-dual-col .flatpickr-calendar{
      box-shadow:none !important;border:none !important;border-radius:0 !important;
      overflow:visible !important;width:100% !important;max-width:100% !important;
      display:block !important;flex-direction:column !important;margin:0 !important;
    }
    @media(max-width:700px){.fp-dual-wrap{flex-direction:column;gap:0;}}
    .fp-footer{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:flex-end;gap:10px;background:var(--surface);}
    .fp-footer-btn{padding:6px 14px;font-size:12px;font-weight:700;border-radius:8px;transition:all .15s;border:none;cursor:pointer;background:none;}
    .fp-btn-cancel{color:var(--muted);}
    .fp-btn-cancel:hover{background:var(--surface-3);}
    .fp-btn-apply{background:var(--verde);color:#fff;}
    .fp-btn-apply:hover{background:var(--verde-med);}
    @media(max-width:700px){
      .flatpickr-calendar.open, .flatpickr-calendar[style*="display: block"]{flex-direction:column !important;}
      .flatpickr-shortcuts-sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:8px;gap:4px;}
      .fp-shortcut-item{white-space:nowrap;flex-shrink:0;margin-bottom:0;}
    }

    /* ── RELATÓRIO A4 (impressão) ──────────────────────────────
       Fica escondido na tela o tempo todo; só aparece (e só ele) quando
       manda imprimir — o resto da página vira invisible via @media print,
       assim window.print() gera só o relatório, do jeito de um PDF pronto. */
    #relatorioImprimir{display:none;}
    @media print{
      /* display:none (não visibility:hidden) nos irmãos do relatório — visibility
         mantém o elemento no fluxo normal do documento (só fica invisível), então
         a altura enorme do dashboard escondido (#appRoot) continuava contando pra
         paginação da impressão e gerava página(s) extra em branco depois do
         relatório, principalmente quando ele tinha pouco conteúdo. display:none
         remove esses irmãos do fluxo por completo, então só a altura real do
         relatório define quantas páginas saem. */
      body > *{display:none !important;}
      #relatorioImprimir{display:block !important;}
      @page{size:A4;margin:9mm 7mm;}
    }
    .rel-doc{font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:#182420;font-size:11px;width:100%;}
    .rel-header{display:grid;grid-template-columns:64px 1fr 180px;align-items:center;gap:16px;padding-bottom:14px;margin-bottom:16px;border-bottom:2.5px solid #087a4a;}
    .rel-header > div{display:flex;flex-direction:column;justify-content:center;min-width:0;}
    .rel-logo{align-items:center;justify-content:center;}
    .rel-titulo{text-align:left;}
    .rel-titulo .t1{color:#6b7a72;font-weight:800;font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;}
    .rel-titulo .t2{color:#0f1f16;font-weight:800;font-size:17px;margin-top:3px;letter-spacing:-.2px;}
    .rel-emissao{text-align:right;align-items:flex-end;}
    .rel-emissao .lbl{font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a968e;}
    .rel-emissao .val{color:#087a4a;font-weight:800;font-size:12px;margin-top:4px;}
    .rel-sub{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#087a4a;margin:-8px 0 18px;}
    .rel-secao{margin-bottom:18px;}
    .rel-secao-h{font-weight:800;font-size:10.5px;color:#0f1f16;letter-spacing:.01em;margin-bottom:9px;padding-left:9px;border-left:3px solid #087a4a;line-height:1.3;}
    .rel-grid{display:grid;gap:8px;}
    .rel-grid > div{background:#f3f7f4;border:1px solid #e1e8e3;border-radius:8px;padding:8px 12px;font-size:10px;min-width:0;}
    .rel-grid .lbl{font-weight:700;font-size:8.5px;text-transform:uppercase;letter-spacing:.03em;color:#75837b;}
    .rel-grid .val{color:#0f1f16;font-weight:700;font-size:11.5px;margin-top:3px;word-break:break-word;}
    .rel-table{width:100%;border-collapse:separate;border-spacing:0;font-size:9.5px;border:1px solid #e1e8e3;border-radius:8px;overflow:hidden;}
    .rel-table th{background:#087a4a;color:#fff;padding:6px 8px;text-align:left;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
    .rel-table td{padding:5px 8px;border-top:1px solid #e6ebe8;color:#33413a;}
    .rel-table tbody tr:nth-child(even) td{background:#f6f9f7;}
    .rel-footer{font-size:8.5px;color:#8a968e;font-style:italic;margin-top:12px;line-height:1.6;border-top:1px solid #e6ebe8;padding-top:10px;}
  </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="spinner" style="width:36px;height:36px;border-width:4px;"></div>
  <span style="font-size:13px;color:var(--ink-2);font-weight:600;">Aguarde...</span>
</div>
<div id="appRoot"></div>
<div id="relatorioImprimir"></div>
<script>
// ── ESTADO GLOBAL ───────────────────────────────────────────
const App = { token: null, papel: null, nome: null };

// paleta categórica validada (ordem fixa — nunca ciclada por rank)
const PALETA_CATEGORICA = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const COR_SOLICITADO = '#2a78d6';
const COR_CONCLUIDO  = '#0d5c3a';

// ── Tema claro/escuro ───────────────────────────────────────
const THEME_KEY = 'spgped_theme';
const THEME_ICON_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
const THEME_ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
function applyTheme(mode) {
  if (mode) document.documentElement.setAttribute('data-theme', mode);
  else document.documentElement.removeAttribute('data-theme');
  const isDark = mode ? mode === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  // Só troca o ícone (mantém o <span class="btn-label"> do balão de tooltip
  // intacto) — sobrescrever o innerHTML inteiro apagava o rótulo que aparece
  // ao passar o mouse.
  document.querySelectorAll('.theme-toggle').forEach(btn => {
    let icon = btn.querySelector('svg');
    if (!icon) { icon = document.createElement('span'); btn.prepend(icon); }
    icon.outerHTML = isDark ? THEME_ICON_MOON : THEME_ICON_SUN;
  });
}
function toggleTheme() {
  const current = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!localStorage.getItem(THEME_KEY)) applyTheme('');
});
applyTheme(localStorage.getItem(THEME_KEY) || '');

// PWA: registra o service worker (permite instalar como aplicativo / abrir offline)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// PWA: gera o manifest em runtime (data URI) e reaplica favicon/apple-touch-icon —
// assim a instalação como app funciona mesmo se manifest.json não estiver acessível no host.
const BRAND_LOGO_URL = 'https://i.imgur.com/vOyYWgp.png';

function applyBrandAssets() {
  const favicon      = document.getElementById('siteFavicon');
  const appleTouch   = document.getElementById('siteAppleTouchIcon');
  const manifestLink = document.getElementById('siteManifest');

  if (favicon)    favicon.href    = BRAND_LOGO_URL;
  if (appleTouch) appleTouch.href = BRAND_LOGO_URL;
  if (manifestLink) {
    const manifest = {
      name: 'SPG · Controle de Pedidos',
      short_name: 'SPG Pedidos',
      description: 'Dashboard de Controle de Pedidos de Clientes',
      start_url: '.',
      scope: '.',
      display: 'standalone',
      orientation: 'portrait-primary',
      background_color: '#f3f6f4',
      theme_color: '#087a4a',
      lang: 'pt-BR',
      icons: [
        { src: BRAND_LOGO_URL, sizes: '192x192', type: 'image/png' },
        { src: BRAND_LOGO_URL, sizes: '512x512', type: 'image/png' },
        { src: BRAND_LOGO_URL, sizes: '192x192', type: 'image/png', purpose: 'maskable' }
      ]
    };
    manifestLink.href = `data:application/manifest+json,${encodeURIComponent(JSON.stringify(manifest))}`;
  }
}
applyBrandAssets();

function showLoading(v) {
  document.getElementById('loadingOverlay').classList.toggle('hidden', !v);
}

function toast(msg, tipo = 'success', ms = 3500) {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  const icons = { success:'✓', error:'✗', info:'ℹ' };
  el.className = `toast toast-${tipo}`;
  el.innerHTML = `<span>${icons[tipo]||'•'}</span><span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ► URL do Web App (Code.gs) — configurável pela tela de login ("⚙ Configurar
//   conexão"), fica salva no navegador (localStorage). Nada de editar o arquivo.
const GAS_URL_KEY = 'spgped_gas_url';
function getGasUrl() { return (localStorage.getItem(GAS_URL_KEY) || '').trim(); }
function setGasUrl(url) { localStorage.setItem(GAS_URL_KEY, url.trim()); }

async function _gasCall(fn, args) {
  const url = getGasUrl();
  if (!url) throw new Error('Conexão não configurada. Clique em "Configurar conexão" na tela de login.');
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn, args })
  });
  if (!res.ok) throw new Error('Erro HTTP ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.erro || 'Erro no servidor');
  return data.data;
}
function gs(...args) { return _gasCall(args[0], args.slice(1)); }

// ► Cache client-side das leituras (dashboards/listagens) — deixa trocar de filtro
//   instantâneo quando a mesma combinação já foi buscada nesta sessão, sem esperar
//   o Apps Script de novo. Só usado nas chamadas de leitura; nunca em login/gravação.
const GS_CACHE_TTL_MS = 5 * 60 * 1000; // 5 minutos
const _gsCache = new Map();
function gsCached(...args) {
  const fn  = args[0];
  const key = fn + '|' + JSON.stringify(args.slice(1));
  const hit = _gsCache.get(key);
  if (hit && (Date.now() - hit.ts) < GS_CACHE_TTL_MS) return Promise.resolve(hit.data);
  return _gasCall(fn, args.slice(1)).then(data => {
    _gsCache.set(key, { data, ts: Date.now() });
    return data;
  });
}
function gsCacheClear() { _gsCache.clear(); }

// ══════════════════════════════════════════════════════════════
// CÁLCULO CLIENT-SIDE DOS DASHBOARDS
// Espelha 1:1 as funções getDashboardX do Code.gs, mas roda em cima dos dados
// crus já carregados no navegador (via gsCached('listarX', token, {}) — 1 busca
// por fonte, reaproveitada entre todas as abas). Assim, trocar filtro nunca mais
// chama o backend de novo: é filtro+soma em JS, instantâneo, sem tela de "aguarde".
// Os campos calculados (kg, unidades_estimadas, devolvido, ano/mes/dia) já vêm
// prontos do servidor dentro de cada linha — aqui só filtra e agrega.
// ══════════════════════════════════════════════════════════════

function _filtrarPorData(rows, f, campo) {
  let r = rows;
  if (f && f.data_inicio) r = r.filter(x => x[campo] && x[campo] >= f.data_inicio);
  if (f && f.data_fim)    r = r.filter(x => x[campo] && x[campo] <= f.data_fim);
  return r;
}
function _filtrarPorLista(rows, valores, campoRow) {
  if (!valores || valores.length === 0) return rows;
  const set = new Set(valores);
  return rows.filter(x => set.has(x[campoRow]));
}
// Busca por texto livre (ex.: NFe) — parcial e sem diferenciar maiúsculas.
function _filtrarPorTexto(rows, texto, campoRow) {
  const busca = String(texto || '').trim().toLowerCase();
  if (!busca) return rows;
  return rows.filter(x => String(x[campoRow] || '').toLowerCase().includes(busca));
}
// Espera a pessoa parar de digitar antes de refiltrar — senão um campo de
// busca livre (ex.: NFe) recalcula tabela/gráficos a cada tecla.
function _debounce(fn, ms) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

// ── Ordenar tabelas por Data (mais recentes/mais antigos) ──────────────
// Um botão no cabeçalho de cada tabela com coluna Data alterna a ordem —
// guarda o estado por chave de tabela e sabe como re-renderizar cada uma
// (usando os dados já carregados em AppState, sem precisar buscar de novo).
// 'desc' (mais recentes primeiro) é o padrão de todas.
const _ordemDataTabelas = {};
function _ordenarPorData(lista, chave) {
  const ordem = _ordemDataTabelas[chave] || 'desc';
  return [...(lista || [])].sort((a, b) => {
    const cmp = String(a.data || '').localeCompare(String(b.data || ''));
    return ordem === 'desc' ? -cmp : cmp;
  });
}
function _rendererOrdemData(chave) {
  const mapa = {
    pedidos:    () => _renderTabelaPedidos(AppState.pedidos.dados || []),
    parceiros:  () => _renderTabelaParceiros(AppState.parceiros.dados || []),
    descartes:  () => _renderTabelaDescartes(AppState.descartes.dados || []),
    devolucoes: () => _renderTabelaDevolucoes(AppState.devolucoes.dados || []),
    lancar:     () => _renderTabelaPedidosRegistrados(AppState.lancar.registrados || [])
  };
  return mapa[chave];
}
function _toggleOrdemData(chave) {
  _ordemDataTabelas[chave] = (_ordemDataTabelas[chave] || 'desc') === 'desc' ? 'asc' : 'desc';
  _atualizarBotaoOrdemData(chave);
  const renderFn = _rendererOrdemData(chave);
  if (renderFn) renderFn();
}
function _atualizarBotaoOrdemData(chave) {
  const btn = document.getElementById('btnOrdem_' + chave);
  if (!btn) return;
  const ordem = _ordemDataTabelas[chave] || 'desc';
  btn.innerHTML = ordem === 'desc' ? '↓ Mais recentes' : '↑ Mais antigos';
}
function _btnOrdemDataHtml(chave) {
  const ordem = _ordemDataTabelas[chave] || 'desc';
  return `<button class="btn btn-secondary btn-sm" id="btnOrdem_${chave}" title="Alternar ordem por Data" onclick="_toggleOrdemData('${chave}')">${ordem === 'desc' ? '↓ Mais recentes' : '↑ Mais antigos'}</button>`;
}

// Cultura = primeira palavra do nome (Produto em Pedidos/Parceiros, Classe em
// Entregas/Descartes) — ex.: "Brócolis 300g" → "Brócolis", "Tomate Cereja" → "Tomate".
function _extrairCultura(texto) {
  const t = String(texto || '').trim();
  if (!t) return '';
  return t.split(/\s+/)[0];
}
function _comCultura(rows, campo) {
  rows.forEach(r => { r.cultura = _extrairCultura(r[campo]); });
  return rows;
}

// ── Pedidos ──────────────────────────────────────────────────
function _filtrarPedidosJS(rows, f) {
  let dados = _filtrarPorData(rows, f, 'data');
  dados = _filtrarPorLista(dados, f.clientes, 'cliente');
  dados = _filtrarPorLista(dados, f.produtos, 'produto');
  dados = _filtrarPorLista(dados, f.culturas, 'cultura');
  dados = _filtrarPorTexto(dados, f.nfe, 'nfe');
  return dados;
}
function _dashboardPedidosJS(todos, f) {
  const dados = _filtrarPedidosJS(todos, f);

  const totalSolicitado = dados.reduce((s, r) => s + r.qtde_solicitada, 0);

  const mapSemana = {};
  dados.forEach(r => {
    const k = String(r.semana || '(sem semana)');
    if (!mapSemana[k]) mapSemana[k] = { semana: k, solicitado: 0 };
    mapSemana[k].solicitado += r.qtde_solicitada;
  });
  const porSemana = Object.values(mapSemana).sort((a, b) => Number(a.semana) - Number(b.semana));

  const mapCliente = {};
  dados.forEach(r => {
    if (!r.cliente) return;
    if (!mapCliente[r.cliente]) mapCliente[r.cliente] = { cliente: r.cliente, pedidos: new Set(), qtde: 0 };
    mapCliente[r.cliente].pedidos.add(r.numero_pedido);
    mapCliente[r.cliente].qtde += r.qtde_solicitada;
  });
  const porCliente = Object.values(mapCliente)
    .map(c => ({ cliente: c.cliente, qtde: c.qtde, num_pedidos: c.pedidos.size }))
    .sort((a, b) => b.qtde - a.qtde)
    .slice(0, 10);

  const mapProduto = {};
  dados.forEach(r => {
    if (!r.produto) return;
    if (!mapProduto[r.produto]) mapProduto[r.produto] = { produto: r.produto, qtde: 0, kg: 0 };
    mapProduto[r.produto].qtde += r.qtde_solicitada;
    mapProduto[r.produto].kg   += r.kg_solicitado;
  });
  const porProduto = Object.values(mapProduto)
    .map(p => ({ ...p, kg: +p.kg.toFixed(2) }))
    .sort((a, b) => b.qtde - a.qtde);

  const totalKgSolicitado = dados.reduce((s, r) => s + r.kg_solicitado, 0);
  const linhasSemPeso     = dados.filter(r => !r.peso_identificado).length;

  return {
    resumo: {
      total_linhas:                dados.length,
      total_pedidos:               new Set(dados.map(r => r.numero_pedido)).size,
      total_solicitado:            +totalSolicitado.toFixed(2),
      total_kg_solicitado:         +totalKgSolicitado.toFixed(2),
      linhas_sem_peso_identificado: linhasSemPeso
    },
    porSemana, porCliente, porProduto,
    // Cascata: cada dropdown só lista o que ainda faz sentido dado os OUTROS
    // filtros já marcados (nunca o próprio) — ex.: marcar um cliente que só
    // pediu Brócolis já esconde as outras culturas do dropdown de Cultura.
    filtros: {
      clientes: [...new Set(_filtrarPedidosJS(todos, { ...f, clientes: [] }).map(r => r.cliente).filter(Boolean))].sort(),
      produtos: [...new Set(_filtrarPedidosJS(todos, { ...f, produtos: [] }).map(r => r.produto).filter(Boolean))].sort(),
      culturas: [...new Set(_filtrarPedidosJS(todos, { ...f, culturas: [] }).map(r => r.cultura).filter(Boolean))].sort()
    }
  };
}

// ── Distribuição / Parceiros ────────────────────────────────
function _filtrarDistribuicaoJS(rows, f) {
  let dados = _filtrarPorData(rows, f, 'data');
  dados = _filtrarPorLista(dados, f.parceiros, 'parceiro');
  dados = _filtrarPorLista(dados, f.clientes, 'cliente');
  dados = _filtrarPorLista(dados, f.produtos, 'produto');
  dados = _filtrarPorLista(dados, f.culturas, 'cultura');
  dados = _filtrarPorTexto(dados, f.nfe, 'nfe');
  return dados;
}
function _dashboardParceirosJS(todos, f) {
  const dados = _filtrarDistribuicaoJS(todos, f);

  const totalFornecido = dados.reduce((s, r) => s + r.quantidade, 0);
  const totalKg          = dados.reduce((s, r) => s + r.kg, 0);
  const linhasSemPeso     = dados.filter(r => !r.peso_identificado).length;

  const mapParceiro = {};
  dados.forEach(r => {
    if (!r.parceiro) return;
    if (!mapParceiro[r.parceiro]) {
      mapParceiro[r.parceiro] = {
        parceiro: r.parceiro, qtde: 0, kg: 0,
        produtos: new Set(), pedidos: new Set(), pedidosDevolvidos: new Set()
      };
    }
    const p = mapParceiro[r.parceiro];
    p.qtde += r.quantidade;
    p.kg   += r.kg;
    if (r.produto) p.produtos.add(r.produto);
    if (r.numero_pedido) p.pedidos.add(r.numero_pedido);
    if (r.devolvido && r.numero_pedido) p.pedidosDevolvidos.add(r.numero_pedido);
  });
  const porParceiro = Object.values(mapParceiro)
    .map(p => ({
      parceiro: p.parceiro,
      qtde: p.qtde,
      kg: +p.kg.toFixed(2),
      num_produtos: p.produtos.size,
      num_pedidos: p.pedidos.size,
      pedidos_devolvidos: p.pedidosDevolvidos.size,
      pct: totalFornecido > 0 ? +((p.qtde / totalFornecido) * 100).toFixed(1) : 0
    }))
    .sort((a, b) => b.qtde - a.qtde);

  const mapProdutoParceiro = {};
  dados.forEach(r => {
    if (!r.produto) return;
    if (!mapProdutoParceiro[r.produto]) mapProdutoParceiro[r.produto] = { produto: r.produto, qtde: 0, kg: 0, porParceiro: {} };
    mapProdutoParceiro[r.produto].qtde += r.quantidade;
    mapProdutoParceiro[r.produto].kg   += r.kg;
    if (r.parceiro) {
      mapProdutoParceiro[r.produto].porParceiro[r.parceiro] =
        (mapProdutoParceiro[r.produto].porParceiro[r.parceiro] || 0) + r.quantidade;
    }
  });
  const porProduto = Object.values(mapProdutoParceiro)
    .map(p => ({ ...p, kg: +p.kg.toFixed(2) }))
    .sort((a, b) => b.qtde - a.qtde);

  const mapSemana = {};
  dados.forEach(r => {
    const k = String(r.semana || '(sem semana)');
    if (!mapSemana[k]) mapSemana[k] = { semana: k, qtde: 0, kg: 0 };
    mapSemana[k].qtde += r.quantidade;
    mapSemana[k].kg   += r.kg;
  });
  const porSemana = Object.values(mapSemana)
    .map(s => ({ ...s, kg: +s.kg.toFixed(2) }))
    .sort((a, b) => Number(a.semana) - Number(b.semana));

  const mapAno = {}, mapMes = {}, mapDia = {};
  dados.forEach(r => {
    if (r.ano) {
      if (!mapAno[r.ano]) mapAno[r.ano] = { periodo: r.ano, qtde: 0, kg: 0 };
      mapAno[r.ano].qtde += r.quantidade; mapAno[r.ano].kg += r.kg;
    }
    if (r.mes) {
      if (!mapMes[r.mes]) mapMes[r.mes] = { periodo: r.mes, qtde: 0, kg: 0 };
      mapMes[r.mes].qtde += r.quantidade; mapMes[r.mes].kg += r.kg;
    }
    if (r.dia) {
      if (!mapDia[r.dia]) mapDia[r.dia] = { periodo: r.dia, qtde: 0, kg: 0 };
      mapDia[r.dia].qtde += r.quantidade; mapDia[r.dia].kg += r.kg;
    }
  });
  const _ordenaPeriodo = (a, b) => String(a.periodo).localeCompare(String(b.periodo));
  const porAno = Object.values(mapAno).map(x => ({ ...x, kg: +x.kg.toFixed(2) })).sort(_ordenaPeriodo);
  const porMes = Object.values(mapMes).map(x => ({ ...x, kg: +x.kg.toFixed(2) })).sort(_ordenaPeriodo);
  const porDia = Object.values(mapDia).map(x => ({ ...x, kg: +x.kg.toFixed(2) })).sort(_ordenaPeriodo);

  const totalPedidosDevolvidos = new Set(dados.filter(r => r.devolvido).map(r => r.numero_pedido)).size;

  return {
    resumo: {
      total_linhas:                 dados.length,
      total_fornecido:              +totalFornecido.toFixed(2),
      total_kg_fornecido:           +totalKg.toFixed(2),
      linhas_sem_peso_identificado: linhasSemPeso,
      num_parceiros:                porParceiro.length,
      num_produtos:                 porProduto.length,
      total_pedidos_devolvidos:     totalPedidosDevolvidos
    },
    porParceiro, porProduto, porSemana, porAno, porMes, porDia,
    filtros: {
      // Lista de parceiros já respeita a cultura (e demais filtros) selecionados —
      // sem aplicar o próprio filtro de parceiro, senão escolher um já faria os
      // outros sumirem da lista. Ex.: marcar "Brócolis" em Cultura só deixa
      // aparecer, no dropdown de Parceiro, quem realmente entregou Brócolis.
      parceiros: [...new Set(_filtrarDistribuicaoJS(todos, { ...f, parceiros: [] }).map(r => r.parceiro).filter(Boolean))].sort(),
      clientes:  [...new Set(_filtrarDistribuicaoJS(todos, { ...f, clientes: [] }).map(r => r.cliente).filter(Boolean))].sort(),
      produtos:  [...new Set(_filtrarDistribuicaoJS(todos, { ...f, produtos: [] }).map(r => r.produto).filter(Boolean))].sort(),
      culturas:  [...new Set(_filtrarDistribuicaoJS(todos, { ...f, culturas: [] }).map(r => r.cultura).filter(Boolean))].sort()
    }
  };
}

// Uma linha por Parceiro + Produto: quanto vendeu daquele produto específico
// (unidades e kg, vindo de Distribuição Parceiros) e, ao lado, o total geral
// comprado do parceiro (kgCompradoPorParceiro, vindo de Entregas Parceiros) —
// repetido em cada linha porque Entregas não separa por produto/embalagem.
function _resumoParceiroProdutoJS(linhas, kgCompradoPorParceiro) {
  const mapa = {};
  linhas.forEach(r => {
    if (!r.parceiro || !r.produto) return;
    const chave = r.parceiro + '|' + r.produto;
    if (!mapa[chave]) mapa[chave] = { parceiro: r.parceiro, produto: r.produto, tipo: r.tipo, qtde: 0, kg: 0 };
    mapa[chave].qtde += r.quantidade;
    mapa[chave].kg   += r.kg;
  });
  return Object.values(mapa)
    .map(x => ({ ...x, kg: +x.kg.toFixed(2), kg_comprado: +((kgCompradoPorParceiro[x.parceiro] || 0)).toFixed(2) }))
    .sort((a, b) => a.parceiro.localeCompare(b.parceiro) || b.kg - a.kg);
}

// ── Entregas ─────────────────────────────────────────────────
function _filtrarEntregasJS(rows, f) {
  let dados = _filtrarPorData(rows, f, 'dia');
  dados = _filtrarPorLista(dados, f.parceiros, 'parceiro');
  dados = _filtrarPorLista(dados, f.classes, 'classe');
  dados = _filtrarPorLista(dados, f.culturas, 'cultura');
  return dados;
}
function _dashboardEntregasJS(rows, f) {
  const dados = _filtrarEntregasJS(rows, f);

  const mapDia = {};
  dados.forEach(r => {
    if (!mapDia[r.dia]) mapDia[r.dia] = { data: r.dia, peso_kg: 0, unidades: 0 };
    mapDia[r.dia].peso_kg  += r.peso_kg;
    mapDia[r.dia].unidades += r.unidades;
  });
  const porDia = Object.values(mapDia).sort((a, b) => a.data.localeCompare(b.data));
  porDia.forEach(d => d.peso_kg = +d.peso_kg.toFixed(1));

  const mapSemana = {};
  dados.forEach(r => {
    const k = r.ano + '-S' + String(r.semana).padStart(2, '0');
    if (!mapSemana[k]) mapSemana[k] = { periodo: k, ano: r.ano, semana: r.semana, peso_kg: 0, unidades: 0 };
    mapSemana[k].peso_kg  += r.peso_kg;
    mapSemana[k].unidades += r.unidades;
  });
  const porSemana = Object.values(mapSemana).sort((a, b) => a.periodo.localeCompare(b.periodo));
  porSemana.forEach(s => s.peso_kg = +s.peso_kg.toFixed(1));

  const mapMes = {};
  dados.forEach(r => {
    if (!r.ano || !r.mes) return;
    const k = r.ano + '-' + String(r.mes).padStart(2, '0');
    if (!mapMes[k]) mapMes[k] = { periodo: k, ano: r.ano, mes: r.mes, peso_kg: 0, unidades: 0 };
    mapMes[k].peso_kg  += r.peso_kg;
    mapMes[k].unidades += r.unidades;
  });
  const porMes = Object.values(mapMes).sort((a, b) => a.periodo.localeCompare(b.periodo));
  porMes.forEach(m => m.peso_kg = +m.peso_kg.toFixed(1));

  const mapParceiro = {};
  dados.forEach(r => {
    if (!r.parceiro) return;
    if (!mapParceiro[r.parceiro]) mapParceiro[r.parceiro] = { parceiro: r.parceiro, peso_kg: 0, unidades: 0, dias: {} };
    mapParceiro[r.parceiro].peso_kg  += r.peso_kg;
    mapParceiro[r.parceiro].unidades += r.unidades;
    if (r.dia) mapParceiro[r.parceiro].dias[r.dia] = true;
  });
  const porParceiro = Object.values(mapParceiro)
    .map(p => {
      const diasComEntrega = Object.keys(p.dias).length;
      return {
        parceiro:         p.parceiro,
        peso_kg:          +p.peso_kg.toFixed(1),
        unidades:         p.unidades,
        media_g_un:       p.unidades > 0 ? +(p.peso_kg * 1000 / p.unidades).toFixed(0) : null,
        dias_com_entrega: diasComEntrega,
        media_kg_dia:     diasComEntrega > 0 ? +(p.peso_kg / diasComEntrega).toFixed(1) : 0
      };
    })
    .sort((a, b) => b.peso_kg - a.peso_kg);

  const totalKg = dados.reduce((s, r) => s + r.peso_kg, 0);
  const totalUn = dados.reduce((s, r) => s + r.unidades, 0);

  return {
    resumo: {
      total_kg:         +totalKg.toFixed(1),
      total_unidades:   Math.round(totalUn),
      media_kg_dia:     porDia.length > 0 ? +(totalKg / porDia.length).toFixed(1) : 0,
      media_g_un:       totalUn > 0 ? +(totalKg * 1000 / totalUn).toFixed(0) : null,
      dias_com_entrega: porDia.length,
      total_parceiros:  porParceiro.length
    },
    porDia, porSemana, porMes, porParceiro,
    filtros: {
      // Cascata: a lista de parceiros respeita a cultura/classe já selecionada
      // (sem aplicar o próprio filtro de parceiro) — marcar "Brócolis" em
      // Cultura só deixa aparecer, no dropdown de Parceiro, quem entregou Brócolis.
      parceiros: [...new Set(_filtrarEntregasJS(rows, { ...f, parceiros: [] }).map(r => r.parceiro).filter(Boolean))].sort(),
      classes:   [...new Set(_filtrarEntregasJS(rows, { ...f, classes: [] }).map(r => r.classe).filter(Boolean))].sort(),
      culturas:  [...new Set(_filtrarEntregasJS(rows, { ...f, culturas: [] }).map(r => r.cultura).filter(Boolean))].sort()
    }
  };
}

// ── Descartes ────────────────────────────────────────────────
function _filtrarDescartesJS(rows, f) {
  let dados = _filtrarPorData(rows, f, 'data');
  dados = _filtrarPorLista(dados, f.parceiros, 'parceiro');
  dados = _filtrarPorLista(dados, f.motivos, 'motivo');
  dados = _filtrarPorLista(dados, f.culturas, 'cultura');
  return dados;
}
function _dashboardDescartesJS(todos, f) {
  const dados = _filtrarDescartesJS(todos, f);

  const totalDescarte = dados.reduce((s, r) => s + r.descarte, 0);

  // Produção (kg) vem cruzada da aba Entregas por Data+Parceiro (ver Code.gs) —
  // quando há mais de um registro de descarte no mesmo dia/parceiro (motivos
  // diferentes lançados em linhas separadas, por exemplo), a produção daquele
  // dia é a MESMA em todas as linhas, então só pode entrar uma vez na soma
  // (senão o mesmo dia é contado 2x, 3x...). Só o descarte soma linha a linha.
  const diasContados = new Set();
  let totalProducao = 0;
  dados.forEach(r => {
    const chaveDia = r.parceiro + '|' + r.data;
    if (diasContados.has(chaveDia)) return;
    diasContados.add(chaveDia);
    totalProducao += r.producao_kg;
  });

  const mapParceiro = {};
  const diasPorParceiro = {};
  dados.forEach(r => {
    if (!r.parceiro) return;
    if (!mapParceiro[r.parceiro]) mapParceiro[r.parceiro] = { parceiro: r.parceiro, descarte: 0, producao_kg: 0 };
    mapParceiro[r.parceiro].descarte += r.descarte;
    const diasDoParceiro = diasPorParceiro[r.parceiro] || (diasPorParceiro[r.parceiro] = new Set());
    if (!diasDoParceiro.has(r.data)) {
      diasDoParceiro.add(r.data);
      mapParceiro[r.parceiro].producao_kg += r.producao_kg;
    }
  });
  const porParceiro = Object.values(mapParceiro)
    .map(p => ({
      parceiro:    p.parceiro,
      descarte:    +p.descarte.toFixed(2),
      producao_kg: +p.producao_kg.toFixed(2),
      pct:         p.producao_kg > 0 ? +((p.descarte / p.producao_kg) * 100).toFixed(2) : null
    }))
    .sort((a, b) => b.descarte - a.descarte);

  const mapMotivo = {};
  dados.forEach(r => {
    const k = r.motivo || '(sem motivo)';
    if (!mapMotivo[k]) mapMotivo[k] = { motivo: k, descarte: 0, ocorrencias: 0 };
    mapMotivo[k].descarte += r.descarte;
    mapMotivo[k].ocorrencias++;
  });
  const porMotivo = Object.values(mapMotivo)
    .map(m => ({ ...m, descarte: +m.descarte.toFixed(2) }))
    .sort((a, b) => b.descarte - a.descarte);

  const mapMes = {};
  dados.forEach(r => {
    if (!r.ano || !r.mes) return;
    const k = r.ano + '-' + String(r.mes).padStart(2, '0');
    if (!mapMes[k]) mapMes[k] = { periodo: k, descarte: 0 };
    mapMes[k].descarte += r.descarte;
  });
  const porMes = Object.values(mapMes)
    .map(m => ({ ...m, descarte: +m.descarte.toFixed(2) }))
    .sort((a, b) => a.periodo.localeCompare(b.periodo));

  return {
    resumo: {
      total_linhas:      dados.length,
      total_descarte:    +totalDescarte.toFixed(2),
      total_producao_kg: +totalProducao.toFixed(2),
      pct_descarte:      totalProducao > 0 ? +((totalDescarte / totalProducao) * 100).toFixed(2) : null,
      num_parceiros:     porParceiro.length
    },
    porParceiro, porMotivo, porMes,
    filtros: {
      // Cascata nos três: cada dropdown respeita os OUTROS dois filtros já
      // marcados (nunca o próprio) — ex.: marcar "Fazenda Oásis" em Parceiro
      // só deixa aparecer, em Motivo e Cultura, o que esse parceiro realmente
      // tem lançado (se ele só descarta Brócolis, as outras culturas somem).
      parceiros: [...new Set(_filtrarDescartesJS(todos, { ...f, parceiros: [] }).map(r => r.parceiro).filter(Boolean))].sort(),
      motivos:   [...new Set(_filtrarDescartesJS(todos, { ...f, motivos: [] }).map(r => r.motivo).filter(Boolean))].sort(),
      culturas:  [...new Set(_filtrarDescartesJS(todos, { ...f, culturas: [] }).map(r => r.cultura).filter(Boolean))].sort()
    }
  };
}

      clientes:  [...new Set(_filtrarRegistroJS(todos, { ...f, clientes: [] }).map(r => r.cliente).filter(Boolean))].sort(),

// ── Resumo executivo (cruza Entregas + Distribuição + Descartes + Devoluções + Bonificações) ──
function _resumoParceirosJS(todosEntregas, todosDistrib, todosDescartes, todosDevolucoes, todosBonificacoes, f) {
  let entregas     = _filtrarPorLista(_filtrarPorData(todosEntregas, f, 'dia'), f.parceiros, 'parceiro');
  let descartes    = _filtrarPorLista(_filtrarPorData(todosDescartes, f, 'data'), f.parceiros, 'parceiro');
  let distrib      = _filtrarPorLista(_filtrarPorData(todosDistrib, f, 'data'), f.parceiros, 'parceiro');
  let devolucoes   = _filtrarPorLista(_filtrarPorData(todosDevolucoes, f, 'data'), f.parceiros, 'parceiro');
  let bonificacoes = _filtrarPorLista(_filtrarPorData(todosBonificacoes, f, 'data'), f.parceiros, 'parceiro');
  entregas     = _filtrarPorLista(entregas, f.culturas, 'cultura');
  descartes    = _filtrarPorLista(descartes, f.culturas, 'cultura');
  distrib      = _filtrarPorLista(distrib, f.culturas, 'cultura');
  devolucoes   = _filtrarPorLista(devolucoes, f.culturas, 'cultura');
  bonificacoes = _filtrarPorLista(bonificacoes, f.culturas, 'cultura');

  // Agrega entregas/distrib/descartes/devoluções/bonificações por uma chave qualquer
  // (parceiro ou cultura) — mesma fórmula nos dois casos, só muda o campo que agrupa.
  // Por parceiro (somenteEntregues=true), só existe linha se ele entregou algo de
  // verdade (Entregas Parceiros) — as outras fontes só completam um parceiro que já
  // existe, nunca criam um novo. Sem isso, um parceiro que só aparece em
  // Descarte/Distribuição/Devoluções/Bonificações vira barra fantasma no gráfico
  // Comprado × Vendido, sem nada "comprado" pra mostrar.
  const _agregaResumoPor = (campo, rotulo, somenteEntregues) => {
    const mapa = {};
    const linha = nome => {
      if (!mapa[nome]) mapa[nome] = { [rotulo]: nome, entregue_kg: 0, entregue_unidades: 0, vendido_kg: 0, devolvido_kg: 0, bonificado_kg: 0, descarte_packing_kg: 0 };
      return mapa[nome];
    };
    const pegar = nome => somenteEntregues ? mapa[nome] : linha(nome);
    entregas.forEach(r => {
      if (!r[campo]) return;
      const p = linha(r[campo]);
      p.entregue_kg        += r.peso_kg;
      p.entregue_unidades  += r.unidades || 0;
    });
    distrib.forEach(r => { const p = r[campo] && pegar(r[campo]); if (p) p.vendido_kg += r.kg; });
    descartes.forEach(r => { const p = r[campo] && pegar(r[campo]); if (p) p.descarte_packing_kg += r.descarte; });
    devolucoes.forEach(r => { const p = r[campo] && pegar(r[campo]); if (p) p.devolvido_kg += r.kg; });
    bonificacoes.forEach(r => { const p = r[campo] && pegar(r[campo]); if (p) p.bonificado_kg += r.kg; });

    return Object.values(mapa)
      .map(p => {
        const vendidoLiquido = p.vendido_kg - p.devolvido_kg;
        return {
          [rotulo]:              p[rotulo],
          entregue_kg:           +p.entregue_kg.toFixed(1),
          entregue_unidades:     Math.round(p.entregue_unidades),
          vendido_kg:            +p.vendido_kg.toFixed(1),
          devolvido_kg:          +p.devolvido_kg.toFixed(1),
          bonificado_kg:         +p.bonificado_kg.toFixed(1),
          vendido_liquido_kg:    +vendidoLiquido.toFixed(1),
          descarte_packing_kg:   +p.descarte_packing_kg.toFixed(1),
          pct_devolucao:         p.vendido_kg  > 0 ? +((p.devolvido_kg / p.vendido_kg) * 100).toFixed(1) : null,
          pct_descarte_packing:  p.entregue_kg > 0 ? +((p.descarte_packing_kg / p.entregue_kg) * 100).toFixed(1) : null,
          pct_aproveitamento:    p.entregue_kg > 0 ? +((vendidoLiquido / p.entregue_kg) * 100).toFixed(1) : null
        };
      })
      .sort((a, b) => b.entregue_kg - a.entregue_kg);
  };

  const porParceiro = _agregaResumoPor('parceiro', 'parceiro', true);
  const porCultura  = _agregaResumoPor('cultura', 'cultura', false);

  const totais = porParceiro.reduce((acc, p) => {
    acc.entregue_kg          += p.entregue_kg;
    acc.vendido_kg           += p.vendido_kg;
    acc.devolvido_kg         += p.devolvido_kg;
    acc.bonificado_kg        += p.bonificado_kg;
    acc.descarte_packing_kg  += p.descarte_packing_kg;
    return acc;
  }, { entregue_kg: 0, vendido_kg: 0, devolvido_kg: 0, bonificado_kg: 0, descarte_packing_kg: 0 });
  const vendidoLiquidoTotal = totais.vendido_kg - totais.devolvido_kg;

  return {
    resumo: {
      total_entregue_kg:          +totais.entregue_kg.toFixed(1),
      total_vendido_kg:           +totais.vendido_kg.toFixed(1),
      total_devolvido_kg:         +totais.devolvido_kg.toFixed(1),
      total_bonificado_kg:        +totais.bonificado_kg.toFixed(1),
      total_descarte_packing_kg:  +totais.descarte_packing_kg.toFixed(1),
      pct_devolucao:               totais.vendido_kg  > 0 ? +((totais.devolvido_kg / totais.vendido_kg) * 100).toFixed(1) : null,
      pct_descarte_packing:        totais.entregue_kg > 0 ? +((totais.descarte_packing_kg / totais.entregue_kg) * 100).toFixed(1) : null,
      pct_aproveitamento:          totais.entregue_kg > 0 ? +((vendidoLiquidoTotal / totais.entregue_kg) * 100).toFixed(1) : null,
      num_parceiros:                porParceiro.length
    },
    porParceiro, porCultura,
    filtros: {
      // Só entram parceiros que aparecem em Entregas — é a única fonte que
      // cria linha no Resumo, então filtrar por um nome de fora dela nunca
      // traria resultado. Também respeita a cultura já selecionada (cascata):
      // marcar "Brócolis" só deixa aparecer, no dropdown de Parceiro, quem
      // entregou Brócolis — sem aplicar o próprio filtro de parceiro, senão
      // escolher um já faria os outros sumirem da lista.
      parceiros: [...new Set(_filtrarPorLista(_filtrarPorData(todosEntregas, f, 'dia'), f.culturas, 'cultura').map(r => r.parceiro))].filter(Boolean).sort(),
      // Cultura (pills) também respeita o parceiro já selecionado — marcar
      // "Fazenda Oásis" só deixa aparecer as culturas que ele realmente tem
      // lançadas em alguma das 5 fontes.
      culturas: [...new Set([
        ..._filtrarPorLista(_filtrarPorData(todosEntregas, f, 'dia'), f.parceiros, 'parceiro').map(r => r.cultura),
        ..._filtrarPorLista(_filtrarPorData(todosDescartes, f, 'data'), f.parceiros, 'parceiro').map(r => r.cultura),
        ..._filtrarPorLista(_filtrarPorData(todosDistrib, f, 'data'), f.parceiros, 'parceiro').map(r => r.cultura),
        ..._filtrarPorLista(_filtrarPorData(todosDevolucoes, f, 'data'), f.parceiros, 'parceiro').map(r => r.cultura),
        ..._filtrarPorLista(_filtrarPorData(todosBonificacoes, f, 'data'), f.parceiros, 'parceiro').map(r => r.cultura)
      ])].filter(Boolean).sort()
    }
  };
}

function fmtNum(n) { return Number(n || 0).toLocaleString('pt-BR'); }
function fmtQtde(n, tipo) {
  const un = String(tipo || '').toLowerCase().includes('kg') ? 'kg' : 'un';
  return fmtNum(n) + ' ' + un;
}
function fmtKg(n) { return Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' kg'; }
function fmtKgComUnidades(kg, unidadesEstimadas) {
  return fmtKg(kg) + (unidadesEstimadas != null ? ` <span class="text-muted">(≈${fmtNum(unidadesEstimadas)} un)</span>` : '');
}
function fmtDate(s) {
  if (!s) return '—';
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(s);
  return `${m[3]}/${m[2]}/${m[1]}`;
}

// RELATÓRIO A4 (impressão) — motor genérico reaproveitado por todas as
// abas: monta o miolo do relatório (cabeçalho, parâmetros, resumo, tabela)
// dentro de #relatorioImprimir (escondido, ver CSS) e chama window.print();
// o @media print esconde o resto da página, então só o relatório sai.
// ══════════════════════════════════════════════════════════════

function _relEscape(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
}

// f = { data_inicio, data_fim } (mesmo formato usado pelos filtros de todas
// as abas) → texto pronto pra exibir no relatório.
function _relPeriodo(f) {
  f = f || {};
  if (f.data_inicio && f.data_fim) return fmtDate(f.data_inicio) + ' a ' + fmtDate(f.data_fim);
  if (f.data_inicio) return 'A partir de ' + fmtDate(f.data_inicio);
  if (f.data_fim) return 'Até ' + fmtDate(f.data_fim);
  return 'Todo o Histórico';
}

// Array de valores selecionados num multi-seleção → texto ("Todos" quando
// vazio, já que é assim que os filtros do painel tratam "sem seleção").
function _relLista(arr) {
  return (arr && arr.length) ? arr.join(', ') : 'Todos';
}

const NOMES_MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function nomeMes(n) { return NOMES_MESES[Number(n) - 1] || n; }
function fmtMesLabel(mesISO) {
  const m = String(mesISO || '').match(/^(\d{4})-(\d{2})$/);
  if (!m) return mesISO;
  return nomeMes(m[2]) + '/' + m[1];
}

function corProduto(produto) {
  const p = (produto || '').toLowerCase();
  if (p.includes('bróc') || p.includes('broc')) return 'verde';
  if (p.includes('tomate')) return 'vermelho';
  if (p.includes('pepino')) return 'azul';
  return 'cinza';
}

// Mapa fixo string→cor da paleta categórica (mesma entidade sempre com a mesma cor
// dentro de uma renderização, sem repintar ao trocar filtro).
function corPaleta(chave, mapa) {
  if (mapa[chave] === undefined) {
    const idx = Object.keys(mapa).length % PALETA_CATEGORICA.length;
    mapa[chave] = PALETA_CATEGORICA[idx];
  }
  return mapa[chave];
}

function navigate(pagina) {
  const root = document.getElementById('appRoot');
  if (pagina === 'login') renderLogin(root);
  if (pagina === 'app')   renderApp(root);
}

function fazerLogout() {
  showLoading(true);
  _limparSessao();
  gsCacheClear();
  gs('logout', App.token).finally(() => {
    App.token = null; App.papel = null; App.nome = null;
    showLoading(false);
    navigate('login');
  });
}

function _salvarSessao(token, papel, nome) {
  localStorage.setItem('spgped_sess', JSON.stringify({ token, papel, nome }));
}
function _limparSessao() {
  localStorage.removeItem('spgped_sess');
}

window.onload = () => {
  const salvo = localStorage.getItem('spgped_sess');
  if (!salvo) { navigate('login'); return; }
  try {
    const { token, papel, nome } = JSON.parse(salvo);
    showLoading(true);
    gs('validarSessao', token).then(sess => {
      showLoading(false);
      if (sess.ok) {
        App.token = token; App.papel = sess.papel; App.nome = sess.nome;
        navigate('app');
      } else {
        _limparSessao(); navigate('login');
      }
    }).catch(() => {
      showLoading(false); navigate('login');
    });
  } catch (e) { _limparSessao(); navigate('login'); }
};
</script>

function toggleLoginPwd() {
  const inp = document.getElementById('loginSenha');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function _atualizarStatusConexao() {
  const el = document.getElementById('loginConexaoStatus');
  if (!el) return;
  const url = getGasUrl();
  el.textContent = url ? ('Conectado: …' + url.slice(-28)) : 'Nenhuma conexão configurada';
  el.style.color = url ? 'var(--good)' : 'var(--critical)';
}

function abrirConfigConexao() {
  document.getElementById('ccUrl').value = getGasUrl();
  document.getElementById('ccErro').style.display = 'none';
  document.getElementById('modalConexao').classList.add('show');
}

function salvarConfigConexao() {
  const url    = document.getElementById('ccUrl').value.trim();
  const erroEl = document.getElementById('ccErro');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
    erroEl.textContent = 'URL inválida. Deve começar com https://script.google.com/macros/s/ e terminar em /exec.';
    erroEl.style.display = 'block';
    return;
  }
  setGasUrl(url);

}

function doLogin() {
  const usuario  = (document.getElementById('loginUsuario').value || '').trim();
  const senha    = document.getElementById('loginSenha').value || '';
  const lembrar  = document.getElementById('loginLembrar').checked;
  const erroEl   = document.getElementById('loginErro');
  const btn      = document.getElementById('btnLogin');
  erroEl.style.display = 'none';
  if (!usuario || !senha) {
    erroEl.textContent = 'Preencha usuário e senha.';
    erroEl.style.display = 'block'; return;
  }
  btn.textContent = 'Entrando...'; btn.disabled = true;
  showLoading(true);
  gs('login', usuario, senha, lembrar)
    .then(res => {
      showLoading(false); btn.textContent = 'Entrar'; btn.disabled = false;
      if (!res.ok) { erroEl.textContent = res.erro || 'Erro ao autenticar.'; erroEl.style.display = 'block'; return; }
      App.token = res.token; App.papel = res.papel; App.nome = res.nome;
      if (lembrar) _salvarSessao(res.token, res.papel, res.nome);
      toast('Bem-vindo, ' + res.nome + '!', 'success');
      navigate('app');
    })
    .catch(err => {
      showLoading(false); btn.textContent = 'Entrar'; btn.disabled = false;
      erroEl.textContent = err.message || 'Erro de conexão. Tente novamente.'; erroEl.style.display = 'block';
    });
}

function fecharModal(id) { document.getElementById(id).classList.remove('show'); }

// ── Substitui window.confirm()/window.prompt() (pop-ups nativos do
// navegador) por um modal no estilo do app — os dois reaproveitam o mesmo
// #modalConfirm, só mudando se o campo de texto aparece ou não. ──
let _mcResolve = null;
function _mcResolver(ok) {
  document.getElementById('modalConfirm').classList.remove('show');
  const resolve = _mcResolve;
  _mcResolve = null;
  if (!resolve) return;
  if (!ok) { resolve(null); return; }
  const comCampo = !document.getElementById('mcCampoGrupo').classList.contains('hidden');
  if (comCampo) {
    const valor = document.getElementById('mcCampo').value.trim();
    resolve(valor || null);
  } else {
    resolve(true);
  }
}
// Resolve `true` se confirmar, `null` se cancelar — mesmo formato usado por
// promptModal(), pra quem chama poder tratar os dois com `if (!resultado) return;`.
function confirmModal(mensagem, opts = {}) {
  return new Promise(resolve => {
    _mcResolve = resolve;
    document.getElementById('mcTitulo').textContent = opts.titulo || 'Confirmar ação';
    document.getElementById('mcMensagem').textContent = mensagem;
    document.getElementById('mcCampoGrupo').classList.add('hidden');
    const btnOk = document.getElementById('mcBtnOk');
    btnOk.textContent = opts.textoOk || 'Confirmar';
    btnOk.className = 'btn ' + (opts.perigo ? 'btn-danger' : 'btn-primary');
    document.getElementById('modalConfirm').classList.add('show');
  });
}
// Resolve com o texto digitado (string não vazia) ou `null` se cancelar ou
// deixar em branco.
function promptModal(mensagem, opts = {}) {
  return new Promise(resolve => {
    _mcResolve = resolve;
    document.getElementById('mcTitulo').textContent = opts.titulo || 'Informe um valor';
    document.getElementById('mcMensagem').textContent = mensagem;
    document.getElementById('mcCampoGrupo').classList.remove('hidden');
    document.getElementById('mcCampoLabel').textContent = opts.label || '';
    const campo = document.getElementById('mcCampo');
    campo.type = opts.tipoCampo || 'text';
    campo.value = '';
    campo.onkeydown = e => { if (e.key === 'Enter') _mcResolver(true); };
    const btnOk = document.getElementById('mcBtnOk');
    btnOk.textContent = opts.textoOk || 'Confirmar';
    btnOk.className = 'btn btn-primary';
    document.getElementById('modalConfirm').classList.add('show');
    setTimeout(() => campo.focus(), 50);
  });
}

function abrirTrocarSenha() {
  document.getElementById('tsAtual').value = '';
  document.getElementById('tsNova').value = '';
  document.getElementById('modalSenha').classList.add('show');

}

function limparFiltrosPedidos() {

function _filtrosPedidos() {
  const { data_inicio, data_fim } = getDateRangeFilter('fpPeriodo');
  return {
    data_inicio, data_fim,
    clientes: getSelectedMulti('fpCliente'),
    produtos: getSelectedMulti('fpProduto'),
    culturas: getSelectedMulti('fpCultura'),
    nfe: (document.getElementById('fpNfe') || {}).value || ''

function loadPedidos() {
  const f = _filtrosPedidos();
  showLoading(true);
  Promise.all([
    gsCached('listarPedidos', App.token, {}),
    gsCached('listarDevolucoes', App.token, {})
  ]).then(([todosRaw, devolucoesRaw]) => {
    showLoading(false);

    AppState.pedidos.devolvidoMap = {};
    (devolucoesRaw || []).forEach(d => {
      const chave = d.numero_pedido + '|' + d.produto;

function _pedidoPctAproveitamento(r) {
  if (!(r.qtde_solicitada > 0)) return null;
  const util = Math.max(0, r.qtde_solicitada - _pedidoDevolvido(r));
  return +((util / r.qtde_solicitada) * 100).toFixed(1);
