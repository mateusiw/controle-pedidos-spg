function _destroyChart(store, key) { if (store[key]) { store[key].destroy(); delete store[key]; } }

// ── HELPERS DE GRÁFICO (estilo "pill label": barras cheias, arredondadas, com
// rótulo branco em cápsula escura na ponta — mesmo visual usado no SPG Estufa) ──

// Esconde o <canvas> e mostra a mensagem de "sem dados" ao lado dele — nunca
// substitui o innerHTML do container (isso apagava o <canvas> pra sempre, e a
// próxima troca de filtro com dados de verdade não achava mais o elemento
// pelo id e desistia de desenhar, deixando a mensagem antiga presa na tela).
function _emptyStateNoCanvas(ctx) {
  ctx.style.display = 'none';
  if (!ctx.parentElement.querySelector('.empty-state')) {
    const msg = document.createElement('div');
    msg.className = 'empty-state';
    msg.textContent = 'Sem dados para os filtros atuais.';
    ctx.parentElement.appendChild(msg);
  }
}
// Contrapartida: tira a mensagem e reexibe o <canvas> antes de tentar
// desenhar de novo — chamada sempre no início de cada createXChart, pra um
// filtro que passou a ter dados voltar a mostrar o gráfico normalmente.
function _clearEmptyState(ctx) {
  ctx.style.display = '';
  const msg = ctx.parentElement.querySelector('.empty-state');
  if (msg) msg.remove();
}

// Barra única (vertical ou horizontal via opts.horizontal), 1 série.
// opts: { store, key, horizontal, color, colors(array por barra), suffix, formatter, tooltipCallbacks }
function createModernBarChart(canvasId, labels, data, opts = {}) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  _clearEmptyState(ctx);
  if (opts.store) _destroyChart(opts.store, opts.key);
  if (!labels || labels.length === 0) { _emptyStateNoCanvas(ctx); return null; }
  const fmt = opts.formatter || (v => fmtNum(Math.round(v)) + (opts.suffix || ''));
  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: opts.label || '',
        data,
        backgroundColor: opts.colors || opts.color || COR_SOLICITADO,
        borderRadius: 6,
        barPercentage: 0.85,
        categoryPercentage: 0.8
      }]
    },
    options: {
      indexAxis: opts.horizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,0.92)', padding: 10, cornerRadius: 8,
          callbacks: opts.tooltipCallbacks
        },
        datalabels: {
          display: c => AppMostrarRotulos && c.dataset.data[c.dataIndex] != null && c.dataset.data[c.dataIndex] !== 0,
          anchor: 'end',
          align: opts.horizontal ? 'left' : 'top',
          color: '#fff',
          backgroundColor: 'rgba(15,23,42,0.72)',
          borderRadius: 4,
          padding: { top: 2, bottom: 2, left: 5, right: 5 },
          font: { weight: '800', size: 9 },
          formatter: fmt
        }
      },
      scales: opts.horizontal
        ? { x: { display: false, beginAtZero: true, max: opts.max }, y: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 }, color: '#475569' } } }
        : { y: { display: false, beginAtZero: true, max: opts.max }, x: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 }, color: '#475569' } } }
    }
  });
  if (opts.store) opts.store[opts.key] = chart;
  return chart;
}

// Barra agrupada, várias séries. opts.datasets: [{ label, data, color }]
function createModernGroupedBarChart(canvasId, labels, datasets, opts = {}) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  _clearEmptyState(ctx);
  if (opts.store) _destroyChart(opts.store, opts.key);
  if (!labels || labels.length === 0) { _emptyStateNoCanvas(ctx); return null; }
  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: datasets.map(d => ({
        label: d.label, data: d.data, backgroundColor: d.color,
        borderRadius: 5, barPercentage: 0.8, categoryPercentage: 0.75
      }))
    },
    options: {
      indexAxis: opts.horizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, font: { size: 10, weight: '700' } } },
        tooltip: { backgroundColor: 'rgba(15,23,42,0.92)', padding: 10, cornerRadius: 8, callbacks: opts.tooltipCallbacks },
        datalabels: {
          display: c => AppMostrarRotulos && c.dataset.data[c.dataIndex] != null && c.dataset.data[c.dataIndex] !== 0,
          anchor: 'end',
          align: opts.horizontal ? 'right' : 'top',
          color: '#fff',
          backgroundColor: 'rgba(15,23,42,0.72)',
          borderRadius: 4,
          padding: { top: 2, bottom: 2, left: 5, right: 5 },
          font: { weight: '800', size: 9 },
          formatter: v => fmtNum(Math.round(v))
        }
      },
      scales: opts.horizontal
        ? { x: { beginAtZero: true, grid: { color: '#f1f5f9' } }, y: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 } } } }
        : { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false }, ticks: { font: { weight: '700', size: 10 } } } }
    }
  });
  if (opts.store) opts.store[opts.key] = chart;
  return chart;
}

// Barra agrupada com 2 eixos Y (esquerda/direita) — para séries com escalas bem diferentes
// (ex.: kg × unidades). opts.datasets: [{ label, data, color, axis: 'y'|'y1' }]
function createDualAxisBarChart(canvasId, labels, datasets, opts = {}) {

    type: 'bar',

      labels,

        label: d.label, data: d.data, backgroundColor: d.color, yAxisID: d.axis || 'y',

      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,

        tooltip: { backgroundColor: 'rgba(15,23,42,0.92)', padding: 10, cornerRadius: 8, callbacks: opts.tooltipCallbacks },
        datalabels: {

          anchor: 'end',

          backgroundColor: 'rgba(15,23,42,0.72)',

          y: { beginAtZero: true, position: 'left', grid: { color: '#f1f5f9' }, title: { display: true, text: opts.yLabel || '', font: { weight: '700', size: 10 } } } },
        datasets.some(d => d.axis === 'y1')
          ? { y1: { beginAtZero: true, position: 'right', grid: { display: false }, title: { display: true, text: opts.y1Label || '', font: { weight: '700', size: 10 } } } }
          : {}

// Doughnut com legenda à direita/embaixo e % em cápsula escura sobre a fatia.
function createModernDoughnutChart(canvasId, labels, data, colors, opts = {}) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return null;
  _clearEmptyState(ctx);
  if (opts.store) _destroyChart(opts.store, opts.key);
  const total = (data || []).reduce((a, b) => a + b, 0);
  if (!labels || labels.length === 0 || total === 0) { _emptyStateNoCanvas(ctx); return null; }
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: { display: true, position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, padding: 10, font: { size: 10, weight: '600' }, color: '#64748b' } },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,0.92)', padding: 10, cornerRadius: 8,
          callbacks: { label: c => ` ${c.label}: ${fmtNum(c.raw)} (${total > 0 ? ((c.raw / total) * 100).toFixed(1) : 0}%)` }
        },
        datalabels: {
          display: c => AppMostrarRotulos && c.dataset.data[c.dataIndex] > 0,
          color: '#fff', backgroundColor: 'rgba(0,0,0,0.45)', borderRadius: 4,
          font: { weight: '800', size: 9 },
          formatter: v => total > 0 ? ((v / total) * 100).toFixed(1) + '%' : ''
        }
      }
    }
  });
  if (opts.store) opts.store[opts.key] = chart;
  return chart;
}

function _renderChartsPedidos(dash) {
  const store = AppState.pedidos.charts;
  const mapaCor = {};

  createModernDoughnutChart('cPStatus', dash.porStatus.map(s => s.status), dash.porStatus.map(s => s.qtde),

  populateMultiSelect('fdCultura',  f.culturas  || [], [], loadDescartes);
  loadDescartes();
}

function _filtrosDescartes() {
  const { data_inicio, data_fim } = getDateRangeFilter('fdPeriodo');
  return {
    data_inicio, data_fim,
    parceiros: getSelectedMulti('fdParceiro'),
    motivos:   getSelectedMulti('fdMotivo'),
    culturas:  getSelectedMulti('fdCultura')
  };
}

function loadDescartes() {
  const f = _filtrosDescartes();
  showLoading(true);
  gsCached('listarDescartes', App.token, {}).then(todosRaw => {
    showLoading(false);
    const todos  = _comCultura(todosRaw, 'classe');
    const dash   = _dashboardDescartesJS(todos, f);
    const linhas = _filtrarDescartesJS(todos, f);
    AppState.descartes.resumo = dash;
    AppState.descartes.dados  = linhas;
    populateMultiSelect('fdParceiro', dash.filtros.parceiros, f.parceiros, loadDescartes);
    populateMultiSelect('fdMotivo',   dash.filtros.motivos,   f.motivos,   loadDescartes);
    populateMultiSelect('fdCultura',  dash.filtros.culturas,  f.culturas,  loadDescartes);
    _renderKpisDescartes(dash.resumo);
    _renderChartsDescartes(dash);
    _renderResumoDescartes(dash.porParceiro);
    _renderTabelaDescartes(linhas);
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function _renderKpisDescartes(r) {
  document.getElementById('dKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value stat-vermelho">${fmtNum(r.total_descarte)}</div><div class="stat-label">Total Descarte</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${fmtKg(r.total_producao_kg)}</div><div class="stat-label">Produção (kg)</div></div>
    <div class="stat-card"><div class="stat-value stat-ambar">${r.pct_descarte !== null ? r.pct_descarte + '%' : '—'}</div><div class="stat-label">% Descarte</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.num_parceiros)}</div><div class="stat-label">Parceiros</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--ink-2);">${fmtNum(r.total_linhas)}</div><div class="stat-label">Registros</div></div>`;
}

function _renderChartsDescartes(dash) {
  const store = AppState.descartes.charts;
  const mapaCor = {};

  // Top 5 (já vêm ordenados por descarte desc) — com muito motivo/parceiro
  // diferente a legenda/barras ficavam grandes demais e o gráfico "quebrava".
  const top5Motivo    = dash.porMotivo.slice(0, 5);
  const top5Parceiro  = dash.porParceiro.slice(0, 5);

  createModernDoughnutChart('cDMotivo', top5Motivo.map(m => m.motivo), top5Motivo.map(m => m.descarte),
    top5Motivo.map(m => corPaleta(m.motivo, mapaCor)), { store, key: 'motivo' });

  createModernBarChart('cDParceiro', top5Parceiro.map(p => p.parceiro), top5Parceiro.map(p => p.descarte),
    { store, key: 'parceiro', horizontal: true, color: COR_DEVOLVIDO });
}

function _renderResumoDescartes(porParceiro) {
  const tbody = document.getElementById('dResumoParceiro');
  if (porParceiro.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Nenhum parceiro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = porParceiro.map(p => `
    <tr>
      <td><strong>${p.parceiro}</strong></td>
      <td>${fmtNum(p.descarte)}</td>
      <td>${fmtKg(p.producao_kg)}</td>
      <td>${p.pct !== null ? p.pct + '%' : '—'}</td>
    </tr>`).join('');
}

function _renderTabelaDescartes(linhas) {
  document.getElementById('dContagem').textContent = linhas.length + ' registro(s)';
  const tbody = document.getElementById('dTabela');
  if (linhas.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum registro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = linhas.map(r => `
    <tr>
      <td>${fmtDate(r.data)}</td>
      <td>${r.parceiro}</td>
      <td>${fmtKg(r.producao_kg)}</td>
      <td>${fmtNum(r.descarte)}</td>
      <td>${r.motivo || '—'}</td>
      <td>${r.classe || '—'}</td>
    </tr>`).join('');
}
</script>
<script>

function setModoDevolucoes(modo) {
  if (AppState.devolucoes.modo === modo) return;
  AppState.devolucoes.modo = modo;
  AppState.devolucoes.resumo = null; // força recarregar da fonte certa
  _atualizarBotoesModoDevolucoes();
  loadDevolucoes();
}

function _atualizarBotoesModoDevolucoes() {
  const modo = AppState.devolucoes.modo;
  const btnDev = document.getElementById('btnModo_devolucoes');
  const btnBon = document.getElementById('btnModo_bonificacoes');
  if (btnDev) btnDev.className = 'btn btn-sm ' + (modo === 'devolucoes' ? 'btn-primary' : 'btn-secondary');
  if (btnBon) btnBon.className = 'btn btn-sm ' + (modo === 'bonificacoes' ? 'btn-primary' : 'btn-secondary');
  const titulo = modo === 'bonificacoes' ? 'Bonificações' : 'Devoluções';
  const tRank = document.getElementById('vTituloRanking');
  if (tRank) tRank.textContent = 'Ranking por Parceiro (kg) — ' + titulo;
  const tTab = document.getElementById('vTituloTabela');
  if (tTab) tTab.textContent = '📋 ' + titulo;
}

function limparFiltrosDevolucoes() {
  clearDateRangePicker('fvPeriodo');
  const f = (AppState.devolucoes.resumo && AppState.devolucoes.resumo.filtros) || {};
  populateMultiSelect('fvParceiro', f.parceiros || [], [], loadDevolucoes);
  populateMultiSelect('fvCliente',  f.clientes  || [], [], loadDevolucoes);
  populateMultiSelect('fvProduto',  f.produtos  || [], [], loadDevolucoes);
  populateMultiSelect('fvMotivo',   f.motivos   || [], [], loadDevolucoes);
  loadDevolucoes();
}

function _filtrosDevolucoes() {
  const { data_inicio, data_fim } = getDateRangeFilter('fvPeriodo');
  return {
    data_inicio, data_fim,
    parceiros: getSelectedMulti('fvParceiro'),
    clientes:  getSelectedMulti('fvCliente'),
    produtos:  getSelectedMulti('fvProduto'),
    motivos:   getSelectedMulti('fvMotivo')
  };
}

function loadDevolucoes() {
  const f  = _filtrosDevolucoes();
  const fn = AppState.devolucoes.modo === 'bonificacoes' ? 'listarBonificacoes' : 'listarDevolucoes';
  showLoading(true);
  gsCached(fn, App.token, {}).then(todosRaw => {
    showLoading(false);
    const dash   = _dashboardRegistroJS(todosRaw, f);
    const linhas = _filtrarRegistroJS(todosRaw, f);
    AppState.devolucoes.resumo = dash;
    AppState.devolucoes.dados  = linhas;
    populateMultiSelect('fvParceiro', dash.filtros.parceiros, f.parceiros, loadDevolucoes);
    populateMultiSelect('fvCliente',  dash.filtros.clientes,  f.clientes,  loadDevolucoes);
    populateMultiSelect('fvProduto',  dash.filtros.produtos,  f.produtos,  loadDevolucoes);
    populateMultiSelect('fvMotivo',   dash.filtros.motivos,   f.motivos,   loadDevolucoes);
    _renderKpisDevolucoes(dash.resumo);
    _renderChartDevolucoes(dash.porParceiro, dash.porMotivo);
    _renderTabelaDevolucoes(linhas);
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function _renderKpisDevolucoes(r) {
  document.getElementById('vKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value" style="color:var(--ink-2);">${fmtNum(r.total_linhas)}</div><div class="stat-label">Registros</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.total_quantidade)}</div><div class="stat-label">Quantidade</div></div>
    <div class="stat-card"><div class="stat-value stat-vermelho">${fmtKg(r.total_kg)}</div><div class="stat-label">Total (kg)</div></div>
    <div class="stat-card"><div class="stat-value stat-azul">${fmtNum(r.num_parceiros)}</div><div class="stat-label">Parceiros</div></div>`;
}

function _renderChartDevolucoes(porParceiro, porMotivo) {
  const store = AppState.devolucoes.charts;
  const cor = AppState.devolucoes.modo === 'bonificacoes' ? COR_CONCLUIDO : COR_DEVOLVIDO;
  createModernBarChart('cVRanking', porParceiro.map(p => p.parceiro), porParceiro.map(p => p.kg),
    { store, key: 'ranking', horizontal: true, color: cor, suffix: ' kg' });

  const mapaCor = {};
  createModernDoughnutChart('cVMotivo', porMotivo.map(m => m.motivo), porMotivo.map(m => m.kg),
    porMotivo.map(m => corPaleta(m.motivo, mapaCor)), { store, key: 'motivo' });
}

// Mostra só a conversão (o que NÃO foi digitado) — se Tipo de Unidade já é "kg",
// repetir o mesmo kg na coluna é redundante; mostra a estimativa em unidades, e
// vice-versa.
function _fmtConversaoRegistro(r) {
  if (!r.peso_identificado) return '—';
  const ehKg = String(r.tipo || '').toLowerCase().includes('kg');
  if (ehKg) return r.unidades_estimadas != null ? `≈${fmtNum(r.unidades_estimadas)} un` : '—';
  return fmtKg(r.kg);
}

function _renderTabelaDevolucoes(linhas) {
  document.getElementById('vContagem').textContent = linhas.length + ' registro(s)';
  const tbody = document.getElementById('vTabela');
  if (linhas.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Nenhum registro encontrado para os filtros atuais.</td></tr>';
    return;
  }
  tbody.innerHTML = linhas.map(r => `
    <tr>
      <td>${fmtDate(r.data)}</td>
      <td>${r.numero_pedido || '—'}</td>
      <td>${r.cliente || '—'}</td>
      <td>${r.parceiro || '—'}</td>
      <td>${r.produto}</td>
      <td>${fmtNum(r.quantidade)}</td>
      <td>${r.tipo || '—'}</td>
      <td>${_fmtConversaoRegistro(r)}</td>
      <td>${r.motivo || '—'}</td>
    </tr>`).join('');
}

<script>
// ── ABA: RESUMO (visão executiva por parceiro) ──────────────
// Junta 5 números de 5 abas diferentes por parceiro: quanto entregou (Entregas
// Parceiros), quanto foi vendido/distribuído para pedidos (Distribuição Parceiros),
// quanto voltou do cliente final (lançado direto na aba Devoluções), quanto foi
// bonificado (lançado direto na aba Bonificações) e quanto foi descartado no
// packing (Descarte Parceiros).
const COR_DEVOLVIDO        = '#e34948';
const COR_BONIFICADO       = '#8b5cf6';
const COR_DESCARTE_PACKING = '#eb6834';
const CULTURA_ICONES = { 'Brócolis': '🥦', 'Tomate': '🍅', 'Pepino': '🥒', 'Couve-flor': '🌸', 'Alface': '🥬', 'Repolho': '🥬' };
function _iconeCultura(c) { return CULTURA_ICONES[c] || '🌱'; }

function renderResumoTab() {
  const el = document.getElementById('aba_resumo');
  el.innerHTML = `
    <div class="card mb-3 card-filtros">
      <div class="card-body" style="padding:12px 16px;">
        <div class="filter-bar">
          <div class="filter-item" style="min-width:230px;">
            <label class="form-label">Período</label>
            <input type="text" id="frPeriodo" class="form-control" placeholder="Período automático">
          </div>
          ${msFilterHtml('frParceiro', 'Parceiro')}
          ${msFilterHtml('frCultura', 'Cultura')}
          <div class="filter-item" style="flex:0 0 auto;display:flex;gap:8px;">
            <button class="btn btn-secondary" onclick="limparFiltrosResumo()">Limpar</button>

    </div>
    <div class="stats-grid mb-3" id="rKpis"></div>
    <div class="grid-auto mb-3">
      <div class="card">
        <div class="card-header"><h3>Comprado × Vendido (Kg)</h3></div>
        <div class="card-body"><canvas id="cRComparativo" height="300"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Vendido × Devolvido × Bonificado (Kg)</h3></div>

      <p class="text-muted" style="padding:0 20px 14px;">Kg e Unidades entregues por cada parceiro (campo "entrega de parceiro"), independente dos pedidos de clientes.</p>

      <div class="table-wrap table-scroll" style="max-height:420px;"><table>
        <thead><tr>
          <th>Parceiro</th><th>Entregue</th><th>Vendido</th><th>Devolvido</th><th>Bonificado</th>

      <div class="card-header">
        <h3>🏆 Ranking dos Parceiros</h3>
        <div style="display:flex;gap:4px;flex-wrap:wrap;" id="rRankBotoes">
          <button class="btn btn-sm" id="btnRank_liquido" onclick="setRankingResumo('liquido')">Venda Líquida</button>
          <button class="btn btn-sm" id="btnRank_devolucao" onclick="setRankingResumo('devolucao')">% Devolução</button>
          <button class="btn btn-sm" id="btnRank_aproveitamento" onclick="setRankingResumo('aproveitamento')">% Aproveitamento</button>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Parceiro</th><th>Vendido Líquido</th><th>% Devolução</th><th>% Aproveitamento</th></tr></thead>
        <tbody id="rRankingTabela"></tbody>
      </table></div>
      <div style="padding:10px 20px 14px;" id="rRankingToggle"></div>
      <p class="text-muted" style="padding:0 20px 14px;">
        Entregue = produção real (aba "Entregas Parceiros"). Vendido = kg alocado para atender pedidos de clientes (aba "Distribuição Parceiros").
        Devolvido = lançado direto na aba "Devoluções". Bonificado = lançado direto na aba "Bonificações" (não entra no cálculo de líquido/aproveitamento).

function limparFiltrosResumo() {
  clearDateRangePicker('frPeriodo');
  const f = (AppState.resumo.resumo && AppState.resumo.resumo.filtros) || {};
  populateMultiSelect('frParceiro', f.parceiros || [], [], loadResumo);
  populateMultiSelect('frCultura',  f.culturas  || [], [], loadResumo);
  loadResumo();
}

function _filtrosResumo() {
  const { data_inicio, data_fim } = getDateRangeFilter('frPeriodo');
  return {
    data_inicio, data_fim,
    parceiros: getSelectedMulti('frParceiro'),
    culturas:  getSelectedMulti('frCultura')
  };
}

// Pills de cultura — atalho visual pro mesmo filtro multi-seleção "frCultura".
function filtrarCulturaResumoTodos() {
  const allCb = document.querySelector('.ms-all-frCultura');
  if (allCb) { allCb.checked = true; toggleAllMultiSelect('frCultura'); }
}
function filtrarCulturaResumo(cultura) {
  selectOnlyMultiSelect('frCultura', cultura);
}
function _renderPillsCultura(culturas, selecionadas) {
  const el = document.getElementById('rPills');
  if (!el) return;
  const isTodos = !selecionadas || selecionadas.length === 0;
  let html = `<button type="button" class="pill-cultura ${isTodos ? 'active' : ''}" onclick="filtrarCulturaResumoTodos()">🌍 Todos</button>`;
  html += (culturas || []).map(c => {
    const ativo = !isTodos && selecionadas.includes(c);
    const safeJs = String(c).replace(/'/g, "\\'");
    return `<button type="button" class="pill-cultura ${ativo ? 'active' : ''}" onclick="filtrarCulturaResumo('${safeJs}')">${_iconeCultura(c)} ${c}</button>`;
  }).join('');
  el.innerHTML = html;
}

function loadResumo() {
  const f = _filtrosResumo();
  showLoading(true);
  Promise.all([
    gsCached('listarEntregas', App.token, {}),
    gsCached('listarDistribuicaoParceiros', App.token, {}),
    gsCached('listarDescartes', App.token, {}),
    gsCached('listarDevolucoes', App.token, {}),
    gsCached('listarBonificacoes', App.token, {})
  ]).then(([entregasRaw, distribRaw, descartesRaw, devolucoesRaw, bonificacoesRaw]) => {
    showLoading(false);
    const entregas     = _comCultura(entregasRaw, 'classe');
    const distrib      = _comCultura(distribRaw, 'produto');
    const descartes    = _comCultura(descartesRaw, 'classe');
    const devolucoes   = _comCultura(devolucoesRaw, 'produto');
    const bonificacoes = _comCultura(bonificacoesRaw, 'produto');
    const dash = _resumoParceirosJS(entregas, distrib, descartes, devolucoes, bonificacoes, f);
    AppState.resumo.resumo = dash;
    populateMultiSelect('frParceiro', dash.filtros.parceiros, f.parceiros, loadResumo);
    populateMultiSelect('frCultura',  dash.filtros.culturas,  f.culturas,  loadResumo);
    _renderPillsCultura(dash.filtros.culturas, f.culturas);
    _renderKpisResumo(dash.resumo);
    _renderChartsResumo(dash.porParceiro);
    _renderCardsCultura(dash.porCultura);
    _renderTabelaResumo(dash.porParceiro);
    _renderRankingResumo(dash.porParceiro);
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function _renderKpisResumo(r) {
  document.getElementById('rKpis').innerHTML = `
    <div class="stat-card"><div class="stat-value stat-azul">${fmtKg(r.total_entregue_kg)}</div><div class="stat-label">Entregue</div></div>
    <div class="stat-card"><div class="stat-value stat-verde">${fmtKg(r.total_vendido_kg)}</div><div class="stat-label">Vendido</div></div>
    <div class="stat-card"><div class="stat-value stat-vermelho">${fmtKg(r.total_devolvido_kg)}</div><div class="stat-label">Devolvido</div></div>
    <div class="stat-card"><div class="stat-value" style="color:${COR_BONIFICADO};">${fmtKg(r.total_bonificado_kg)}</div><div class="stat-label">Bonificado</div></div>
    <div class="stat-card"><div class="stat-value" style="color:${COR_DESCARTE_PACKING};">${fmtKg(r.total_descarte_packing_kg)}</div><div class="stat-label">Descarte Packing</div></div>
    <div class="stat-card"><div class="stat-value stat-vermelho">${r.pct_devolucao ?? '—'}%</div><div class="stat-label">% Devolução</div></div>
    <div class="stat-card"><div class="stat-value" style="color:${COR_DESCARTE_PACKING};">${r.pct_descarte_packing ?? '—'}%</div><div class="stat-label">% Descarte Packing</div></div>

function _corAproveitamento(pct) {
  if (pct === null || pct === undefined) return '#94a3b8';
  if (pct >= 80) return '#16a34a';
  if (pct >= 50) return '#d97706';
  return '#dc2626';
}

// ── Ranking dos Parceiros — 3 modos de ordenação + top 5 / ver todos ──
const MEDALHAS_RANKING = ['🥇', '🥈', '🥉'];
function setRankingResumo(modo) {
  AppState.resumo.rankOrdenacao = modo;
  _atualizarBotoesRankingResumo();
  if (AppState.resumo.resumo) _renderRankingResumo(AppState.resumo.resumo.porParceiro);
}
function _atualizarBotoesRankingResumo() {
  ['liquido', 'devolucao', 'aproveitamento'].forEach(m => {
    const btn = document.getElementById('btnRank_' + m);
    if (btn) btn.className = 'btn btn-sm ' + (m === AppState.resumo.rankOrdenacao ? 'btn-primary' : 'btn-secondary');
  });
}
function toggleRankingCompletoResumo() {
  AppState.resumo.rankMostrarTodos = !AppState.resumo.rankMostrarTodos;
  if (AppState.resumo.resumo) _renderRankingResumo(AppState.resumo.resumo.porParceiro);
}
function _renderRankingResumo(porParceiro) {
  const tbody = document.getElementById('rRankingTabela');
  if (!tbody) return;
  const comparadores = {
    liquido:        (a, b) => b.vendido_liquido_kg - a.vendido_liquido_kg,
    devolucao:      (a, b) => (a.pct_devolucao ?? 999) - (b.pct_devolucao ?? 999),
    aproveitamento: (a, b) => (b.pct_aproveitamento ?? -1) - (a.pct_aproveitamento ?? -1)
  };
  const ordenado = [...porParceiro].sort(comparadores[AppState.resumo.rankOrdenacao] || comparadores.liquido);
  const mostrarTodos = AppState.resumo.rankMostrarTodos;
  const lista = mostrarTodos ? ordenado : ordenado.slice(0, 5);

  if (lista.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Nenhum parceiro encontrado para os filtros atuais.</td></tr>';
  } else {
    tbody.innerHTML = lista.map((p, i) => `
      <tr>
        <td>${MEDALHAS_RANKING[i] || (i + 1)}</td>
        <td><strong>${p.parceiro}</strong></td>
        <td>${fmtKg(p.vendido_liquido_kg)}</td>
        <td>${p.pct_devolucao ?? '—'}%</td>
        <td><span class="badge" style="background:${_corAproveitamento(p.pct_aproveitamento)}20;color:${_corAproveitamento(p.pct_aproveitamento)};">${p.pct_aproveitamento ?? '—'}%</span></td>
      </tr>`).join('');
  }

  const toggleEl = document.getElementById('rRankingToggle');
  if (toggleEl) {
    toggleEl.innerHTML = ordenado.length > 5
      ? `<a href="#" onclick="toggleRankingCompletoResumo();return false;" style="font-size:12.5px;font-weight:700;color:var(--verde);">${mostrarTodos ? '← Ver top 5' : 'Ver todos os parceiros (' + ordenado.length + ') →'}</a>`
      : '';
  }
}
</script>

// Reproduz a mesma fórmula que já era usada direto na planilha (coluna
// "Número do Pedido" de Controle de Pedidos): CÓDIGO + data + semana ISO.
// O código do cliente é as 2 primeiras letras do primeiro nome + 2
// primeiras do último nome (ex.: "Ximenes Cruzeiro" → "XICR"); se o nome
// não tiver espaço, usa as 4 primeiras letras (ex.: "Trielo" → "TRIE").
function _gerarCodigoCliente(nome) {
  const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '';
  const codigo = partes.length === 1
    ? partes[0].slice(0, 4)
    : partes[0].slice(0, 2) + partes[partes.length - 1].slice(0, 2);
  return codigo.toUpperCase();
}
function _lpGerarNumeroPedido() {
  const campoData = document.getElementById('lpData');
  const campoCliente = document.getElementById('lpCliente');
  const campoNumero = document.getElementById('lpNumero');
  if (!campoData || !campoCliente || !campoNumero) return;
  const dataVal = campoData.value;
  const codigo = _gerarCodigoCliente(campoCliente.value);
  if (!dataVal || !codigo) { campoNumero.value = ''; return; }
  const [ano, mes, dia] = dataVal.split('-');
  const semana = _semanaISO(dataVal);
  campoNumero.value = `${codigo} ${dia}/${mes}/${ano} SEM ${semana}`;
}

// ── Tabela "Pedidos Registrados" — junta Pedidos + Devoluções +
// Bonificações num único lugar, editar/excluir linha a linha ──
let _pedidoEditando = null;   // { linha, numero_pedido_original }
let _registroEditando = null; // { nomeAba, linha, original:{numero_pedido,data,produto} }

function carregarPedidosRegistrados() {
  const tbody = document.getElementById('listaPedidosRegistrados');
  if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Carregando...</td></tr>';
  Promise.all([
    gs('listarPedidosGerenciar', App.token),
    gs('listarDevolucoesGerenciar', App.token),
    gs('listarBonificacoesGerenciar', App.token)
  ]).then(([pedidos, devolucoes, bonificacoes]) => {
    AppState.lancar.pedidos = pedidos;
    AppState.lancar.devolucoes = devolucoes;
    AppState.lancar.bonificacoes = bonificacoes;
    const combinados = [
      ...pedidos.map(p => ({ ...p, _tipo: 'Pedido' })),
      ...devolucoes.map(d => ({ ...d, _tipo: 'Devolução' })),
      ...bonificacoes.map(b => ({ ...b, _tipo: 'Bonificação' }))
    ].sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
    _renderTabelaPedidosRegistrados(combinados);
  }).catch(err => {
    if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Erro ao carregar.</td></tr>';
    toast(err.message, 'error');
  });
}

function _lpBadgeTipo(tipo) {
  if (tipo === 'Pedido') return '<span class="badge badge-azul">Pedido</span>';
  if (tipo === 'Devolução') return '<span class="badge badge-amarelo">Devolução</span>';
  return '<span class="badge badge-verde">Bonificação</span>';
}
function _renderTabelaPedidosRegistrados(lista) {
  const tbody = document.getElementById('listaPedidosRegistrados');
  if (!tbody) return;
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Nenhum registro ainda.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(r => {
    const ehPedido = r._tipo === 'Pedido';
    const nomeAba = r._tipo === 'Devolução' ? 'Devoluções' : 'Bonificações';
    const editarOnclick = ehPedido ? `abrirEditarPedido(${r.linha})` : `abrirEditarRegistro('${nomeAba}', ${r.linha})`;
    const excluirOnclick = ehPedido ? `excluirPedidoRegistrado(${r.linha})` : `excluirRegistroRegistrado('${nomeAba}', ${r.linha})`;
    // Num Pedido, um produto pode estar dividido entre vários parceiros —
    // mostra a quantidade exata de cada um, não só a lista de nomes
    // (senão não dá pra saber quem ficou com quanto).
    const parceiroExibido = ehPedido
      ? (r.parceiros || []).map(p => `${p.parceiro} (${fmtNum(p.quantidade)})`).join(', ')
      : (r.parceiro || '');
    return `
    <tr>
      <td>${_lpBadgeTipo(r._tipo)}</td>
      <td>${fmtDate(r.data)}</td>
      <td><strong>${r.numero_pedido || ''}</strong></td>
      <td>${r.cliente || ''}</td>
      <td>${parceiroExibido || '—'}</td>
      <td>${r.produto || ''}</td>
      <td>${fmtNum(ehPedido ? r.qtde_solicitada : r.quantidade)}</td>
      <td>${r.tipo || ''}</td>
      <td>${ehPedido ? (r.status || '') : (r.motivo || '')}</td>
      <td style="white-space:nowrap;">
        ${ehPedido ? `<button class="btn-icon" title="Distribuir para parceiro" onclick="abrirDistribuir(${r.linha})">🤝</button>` : ''}
        <button class="btn-icon" title="Editar" onclick="${editarOnclick}">✏️</button>
        <button class="btn-icon" title="Excluir" onclick="${excluirOnclick}">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}

function abrirEditarRegistro(nomeAba, linha) {
  const lista = nomeAba === 'Devoluções' ? AppState.lancar.devolucoes : AppState.lancar.bonificacoes;
  const r = (lista || []).find(x => x.linha === linha);
  if (!r) { toast('Registro não encontrado — atualize a tabela e tente de novo.', 'error'); return; }
  _registroEditando = { nomeAba, linha: r.linha, original: { numero_pedido: r.numero_pedido, data: r.data, produto: r.produto } };
  document.getElementById('erData').value = r.data;
  document.getElementById('erNumero').value = r.numero_pedido;
  document.getElementById('erCliente').value = r.cliente;
  document.getElementById('erParceiro').value = r.parceiro;
  document.getElementById('erProduto').value = r.produto;
  document.getElementById('erTipo').value = r.tipo === 'kg' ? 'kg' : 'Unidades';
  _setNumVal(document.getElementById('erQtde'), r.quantidade);
  document.getElementById('erMotivo').value = r.motivo;
  document.getElementById('erMotivo').dataset.comboList = nomeAba === 'Devoluções' ? 'dlMotivosDevolucao' : 'dlMotivosBonificacao';
  document.getElementById('modalEditarRegistroTitulo').textContent = nomeAba === 'Devoluções' ? '✏️ Editar Devolução' : '✏️ Editar Bonificação';
  document.getElementById('modalEditarRegistro').classList.add('show');

    cliente:        document.getElementById('erCliente').value.trim(),

// Número da semana ISO-8601 (mesma convenção usada nas outras abas do
// painel) calculado a partir da data escolhida — a pessoa pode ajustar
// manualmente depois se precisar.
function _semanaISO(dataStr) {
  if (!dataStr) return '';
  const d = new Date(dataStr + 'T00:00:00');
  if (isNaN(d)) return '';
  const alvo = new Date(d.valueOf());
  const diaSemana = (d.getDay() + 6) % 7;
  alvo.setDate(alvo.getDate() - diaSemana + 3);
  const primeiraQuinta = alvo.valueOf();
  alvo.setMonth(0, 1);
  if (alvo.getDay() !== 4) alvo.setMonth(0, 1 + ((4 - alvo.getDay()) + 7) % 7);
  return 1 + Math.round((primeiraQuinta - alvo) / 604800000);
}
function _lpAtualizarSemana() {
  const campoData = document.getElementById('lpData');
  const campoSemana = document.getElementById('lpSemana');
  if (!campoData || !campoSemana) return;

  if (semana) campoSemana.value = semana;
}

// ── Combobox moderno — troca o menu suspenso feio/nativo do <input
// list="..."> por uma lista estilizada igual ao resto do painel, mantendo o
// mesmo <datalist> como única fonte das opções (a lista é lida ao vivo do
// datalist toda vez que o menu abre, então _lpPreencherDatalist continua
// funcionando normalmente por trás disso).
function _comboAttach(input) {
  if (!input || input.dataset.comboAttached) return;
  const datalistId = input.getAttribute('list');
  if (!datalistId) return;
  input.dataset.comboAttached = '1';
  // Guarda o id do datalist em data-combo-list (não no atributo "list", que é
  // removido pra evitar o menu nativo) — assim, se algum lugar do código
  // trocar o datalist de origem depois (ex.: abrirEditarRegistro trocando
  // entre motivos de devolução/bonificação), basta atualizar esse data-*
  // que o combobox já lê a lista nova na próxima vez que abrir.
  input.dataset.comboList = datalistId;
  input.removeAttribute('list'); // evita o menu nativo aparecer junto com o novo
  input.setAttribute('autocomplete', 'off');
  if (!input.hasAttribute('placeholder')) input.setAttribute('placeholder', ''); // ver .combo-clear-btn no CSS

  // Envolve o input num wrapper posicionado, só pra encaixar o botão "x" de
  // limpar dentro do próprio campo (alinhado à direita) — evita ter que
  // apagar o texto manualmente pra trocar o valor.
  const wrap = document.createElement('div');
  wrap.className = 'combo-field-wrap';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const btnClear = document.createElement('button');
  btnClear.type = 'button';
  btnClear.className = 'combo-clear-btn';
  btnClear.title = 'Limpar';
  btnClear.textContent = '✕';
  btnClear.tabIndex = -1;
  wrap.appendChild(btnClear);
  btnClear.addEventListener('mousedown', e => e.preventDefault()); // não tira o foco do input antes do click
  btnClear.addEventListener('click', () => {
    input.value = '';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
    input.focus();
  });

  // O menu vai direto pro <body> (não fica aninhado dentro do card do
  // produto/parceiro) — os cards usam overflow:hidden pros cantos
  // arredondados, e isso cortava/escondia o menu sempre que ele precisava
  // ultrapassar o fundo do card. Fixed + fora do card ignora esse recorte;
  // a posição é recalculada toda vez que abre e enquanto a página rola.
  const menu = document.createElement('div');
  menu.className = 'combo-menu';
  menu.hidden = true;
  document.body.appendChild(menu);

  function opcoes() {
    const dl = document.getElementById(input.dataset.comboList);
    return dl ? [...dl.querySelectorAll('option')].map(o => o.value).filter(Boolean) : [];
  }
  function posicionar() {
    const r = input.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.width = r.width + 'px';
  }
  function render() {
    const consulta = input.value.trim().toLowerCase();
    const lista = opcoes().filter(v => !consulta || v.toLowerCase().includes(consulta));
    menu.innerHTML = lista.length
      ? lista.slice(0, 60).map(v => `<div class="combo-option">${String(v).replace(/</g, '&lt;')}</div>`).join('')
      : '<div class="combo-empty">Nenhum resultado</div>';
  }
  function abrir() { posicionar(); render(); menu.hidden = false; }
  function fechar() { menu.hidden = true; }

  let selecionando = false;
  input.addEventListener('focus', abrir);
  input.addEventListener('click', abrir);
  input.addEventListener('input', () => { if (!selecionando) abrir(); });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
  window.addEventListener('scroll', () => { if (!menu.hidden) posicionar(); }, true);
  window.addEventListener('resize', () => { if (!menu.hidden) posicionar(); });
  menu.addEventListener('mousedown', e => {
    const opt = e.target.closest('.combo-option');
    if (!opt) return;
    e.preventDefault();
    selecionando = true;
    input.value = opt.textContent;
    fechar();
    // "input"/"change" disparados pra quem escuta o campo (ex.: gerar o
    // Número do Pedido ao trocar o Cliente) reagir à seleção — a flag acima
    // impede que o próprio listener de "input" reabra o menu por causa deles.
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
    selecionando = false;
  });
  document.addEventListener('click', e => { if (e.target !== input && e.target !== btnClear && !menu.contains(e.target)) fechar(); });
}
function _comboAttachAll(raiz) {
  (raiz || document).querySelectorAll('input[list]').forEach(_comboAttach);
}

// Máscara de milhar/decimal (ex.: 9000 → "9.000") nos campos de quantidade —
// eles viram <input type="text"> (o type="number" nativo não aceita ponto de
// milhar) e formatam o valor a cada tecla, mantendo o cursor no lugar certo.
function _maskNumero(input) {
  if (!input || input.dataset.numMask) return;
  input.dataset.numMask = '1';
  input.setAttribute('inputmode', 'decimal');
  input.addEventListener('input', () => {
    const doFimAntes = input.value.length - input.selectionEnd;
    let v = input.value.replace(/[^\d,]/g, '');
    const [parteInteira, ...resto] = v.split(',');
    let inteiro = parteInteira.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const temVirgula = v.includes(',');
    const decimal = resto.join('').slice(0, 2);
    input.value = temVirgula ? inteiro + ',' + decimal : inteiro;
    const pos = Math.max(0, input.value.length - doFimAntes);
    input.setSelectionRange(pos, pos);
  });
}
function _maskNumeroAll(raiz) {
  (raiz || document).querySelectorAll('.num-mask').forEach(_maskNumero);
}
// Converte de volta "9.000,5" → 9000.5 (número de verdade), pro que é
// digitado no formato brasileiro virar o valor certo pra mandar ao backend.
function _parseNumFormatado(str) {
  const limpo = String(str || '').trim().replace(/\./g, '').replace(',', '.');
  return Number(limpo) || 0;
}
function _numVal(input) {
  return input ? _parseNumFormatado(input.value) : 0;
}
// Preenche um campo de quantidade já formatado (ex.: ao abrir um modal de
// edição) — 0 vira campo vazio, pra não ficar mostrando "0" antes de digitar.
function _setNumVal(input, valor) {
  if (!input) return;
  const n = Number(valor) || 0;
  input.value = n ? fmtNum(n) : '';
}
// Preenche o <select> de Número do Pedido — se houver uma data escolhida em
// "Filtrar pedidos lançados no dia", mostra só os pedidos daquele dia; sem
// filtro, mostra todos. Mantém a seleção atual se ela ainda estiver na lista.
function _lpPreencherSelectPedidos() {
  const sel = document.getElementById('devNumero');
  if (!sel) return;
  const filtroData = (document.getElementById('devFiltroData') || {}).value || '';
  const atual = sel.value;
  const lista = filtroData ? _lpPedidosList.filter(p => p.data === filtroData) : _lpPedidosList;
  sel.innerHTML = '<option value="">Selecione...</option>' +
    lista.map(p => `<option value="${String(p.numero_pedido).replace(/"/g, '&quot;')}">${String(p.numero_pedido).replace(/</g, '&lt;')} — ${String(p.cliente).replace(/</g, '&lt;')}</option>`).join('');
  sel.value = lista.some(p => p.numero_pedido === atual) ? atual : '';
  _lpPreencherClienteDevolucao();
}
function _lpPreencherClienteDevolucao() {
  const numero = document.getElementById('devNumero').value;
  const pedido = _lpPedidosList.find(p => p.numero_pedido === numero);
  document.getElementById('devCliente').value = pedido ? pedido.cliente : '';
}

// Depois de gravar, limpa o cache de leitura e esquece o dashboard já
// carregado dessas abas — assim, ao trocar de aba, o painel busca os
// dados de novo em vez de mostrar a versão antiga (sem o que acabou de
// ser lançado).
function _lpInvalidarCaches(abas) {
  gsCacheClear();
  if (abas.includes('pedidos'))    AppState.pedidos.resumo = null;
  if (abas.includes('parceiros'))  AppState.parceiros.resumo = null;
  if (abas.includes('devolucoes')) AppState.devolucoes.resumo = null;
  if (abas.includes('resumo'))     AppState.resumo.resumo = null;
}

function salvarNovoPedido() {
  const data          = document.getElementById('lpData').value;
  const semana        = document.getElementById('lpSemana').value;
  const numero_pedido = document.getElementById('lpNumero').value.trim();
  const nfe           = document.getElementById('lpNfe').value.trim();
  const cliente       = document.getElementById('lpCliente').value.trim();
  const status        = 'Em aberto'; // todo pedido novo começa em aberto — status é ajustado depois pela edição
  const observacoes   = '';

  if (!data || !cliente || !numero_pedido) {
    toast('Preencha a Data e o Cliente (o Número do Pedido é gerado automaticamente a partir deles).', 'error');
    return;
  }

  const produtos = [];
  let erro = '';
  document.querySelectorAll('#lpProdutosContainer [data-produto-id]').forEach(bloco => {
    if (erro) return;
    const produto = bloco.querySelector('.lp-produto-nome').value.trim();
    const tipo = bloco.querySelector('.lp-produto-tipo').value;
    const qtdeSolicitada = _numVal(bloco.querySelector('.lp-produto-qtde'));
    if (!produto || !(qtdeSolicitada > 0)) {
      erro = 'Preencha o nome e a Qtde Solicitada (maior que zero) de cada produto.';
      return;
    }
    const distribuicoes = [];
    const camposParceiro = [...bloco.querySelectorAll('.lp-parceiro-nome')];
    const camposQtde = [...bloco.querySelectorAll('.lp-parceiro-qtde')];
    camposParceiro.forEach((campo, i) => {
      const parceiro = campo.value.trim();
      const quantidade = _numVal(camposQtde[i]);
      if (!parceiro && !quantidade) return; // linha em branco, ignora
      if (!parceiro || !(quantidade > 0)) { erro = 'Preencha o parceiro e a quantidade (maior que zero) em cada linha de distribuição.'; return; }
      distribuicoes.push({ parceiro, quantidade });
    });
    if (!erro) produtos.push({ produto, tipo, qtde_solicitada: qtdeSolicitada, distribuicoes });
  });

  if (erro) { toast(erro, 'error'); return; }
  if (!produtos.length) { toast('Adicione ao menos um produto ao pedido.', 'error'); return; }

  const bonificacoes = [];
  document.querySelectorAll('#lpBonificacoesContainer [data-bon-id]').forEach(linha => {
    if (erro) return;
    const produto = linha.querySelector('.lp-bon-produto').value.trim();
    const parceiro = linha.querySelector('.lp-bon-parceiro').value.trim();
    const tipo = linha.querySelector('.lp-bon-tipo').value;
    const quantidade = _numVal(linha.querySelector('.lp-bon-qtde'));
    const motivo = linha.querySelector('.lp-bon-motivo').value.trim();
    if (!produto && !parceiro && !quantidade && !motivo) return; // linha em branco, ignora
    if (!produto || !parceiro || !(quantidade > 0)) { erro = 'Preencha Produto, Parceiro e uma Quantidade (maior que zero) em cada linha de bonificação.'; return; }
    bonificacoes.push({ produto, parceiro, tipo, quantidade, motivo });
  });

  if (erro) { toast(erro, 'error'); return; }

  showLoading(true);
  gs('lancarPedido', App.token, { data, semana, numero_pedido, nfe, cliente, status, observacoes, produtos, bonificacoes }).then(() => {
    showLoading(false);
    toast('Pedido lançado com sucesso.', 'success');
    _lpInvalidarCaches(['pedidos', 'parceiros', 'resumo', 'devolucoes']);
    renderLancarTab();
    loadLancarOpcoes();
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function salvarDevolucao() {
  const dados = {
    data:           document.getElementById('devData').value,
    numero_pedido:  document.getElementById('devNumero').value.trim(),
    cliente:        document.getElementById('devCliente').value.trim(),
    parceiro:       document.getElementById('devParceiro').value.trim(),
    produto:        document.getElementById('devProduto').value.trim(),
    quantidade:     _numVal(document.getElementById('devQtde')),
    tipo:           document.getElementById('devTipo').value,
    motivo:         document.getElementById('devMotivo').value.trim()
  };
  if (!dados.data || !dados.numero_pedido || !dados.cliente || !dados.parceiro || !dados.produto || !(Number(dados.quantidade) > 0)) {
    toast('Preencha Data, Número do Pedido, Parceiro, Produto e uma Quantidade maior que zero.', 'error');
    return;
  }
  showLoading(true);
  gs('lancarDevolucao', App.token, dados).then(() => {
    showLoading(false);
    toast('Devolução registrada com sucesso.', 'success');
    _lpInvalidarCaches(['devolucoes', 'resumo']);
    renderLancarTab();
    loadLancarOpcoes();
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

    showLoading(false);
    gsCacheClear();
    toast('Apelido de "' + apelido + '" salvo.', 'success');
    loadAdmin();
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function _renderConfigProdutos(produtos) {
  const tbody = document.getElementById('listaConfigProdutos');
  if (!tbody) return;
  if (produtos.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Nenhum produto encontrado nos pedidos ainda.</td></tr>';
    return;
  }
  tbody.innerHTML = produtos.map((p, i) => `
    <tr>
      <td><strong>${p.produto}</strong></td>
      <td>${p.tipo_predominante || '—'}</td>
      <td><input type="number" step="0.001" min="0" class="form-control" id="cpPeso_${i}" value="${p.peso_kg || ''}" style="width:110px;"></td>
      <td style="text-align:center;"><input type="checkbox" id="cpAtivo_${i}" ${p.ativo ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--verde);cursor:pointer;"></td>
      <td><input type="text" class="form-control" id="cpObs_${i}" value="${(p.observacoes || '').replace(/"/g, '&quot;')}" placeholder="opcional"></td>
      <td>${p.configurado ? '<span class="badge badge-verde">Configurado</span>' : '<span class="badge badge-amarelo">Sugerido</span>'}</td>
      <td><button class="btn btn-primary btn-sm" onclick="salvarConfigProduto('${p.produto.replace(/'/g, "\\'")}', ${i})">Salvar</button></td>
    </tr>`).join('');
}

function salvarConfigProduto(produto, i) {
  const dados = {
    produto,
    peso_kg:     Number(document.getElementById('cpPeso_' + i).value) || 0,
    ativo:       document.getElementById('cpAtivo_' + i).checked,
    observacoes: document.getElementById('cpObs_' + i).value.trim()
  };
  showLoading(true);
  gs('salvarProdutoConfig', App.token, dados).then(() => {
    showLoading(false);
    gsCacheClear();
    toast('Peso de "' + produto + '" salvo.', 'success');
    loadAdmin();
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function _renderListaUsuarios(users) {
  const el = document.getElementById('listaUsuarios');
  if (!el) return;
  if (users.length === 0) { el.innerHTML = '<div class="empty-state">Nenhum usuário cadastrado.</div>'; return; }
  el.innerHTML = users.map(u => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;">
      <div><strong style="font-size:13px;color:var(--ink);">${u.nome}</strong><div style="font-size:11px;color:var(--muted);">${u.usuario} · <span class="badge badge-${u.papel === 'admin' ? 'azul' : 'verde'}">${u.papel}</span> ${u.ativo ? '' : '· <span class="badge badge-vermelho">inativo</span>'}</div></div>
      <div style="display:flex;gap:4px;">
        <button class="btn btn-secondary btn-sm" onclick="resetSenhaAdmin('${u.id_usuario}','${u.nome.replace(/'/g, "\\'")}')">🔑 Redefinir</button>
        <button class="btn btn-${u.ativo ? 'danger' : 'secondary'} btn-sm" onclick="toggleUsuarioAdmin('${u.id_usuario}', ${!u.ativo})">${u.ativo ? 'Desativar' : 'Ativar'}</button>
      </div>
    </div>`).join('');
}

function criarUsuarioAdmin() {
  const dados = {
    nome:    document.getElementById('nuNome').value.trim(),
    usuario: document.getElementById('nuUsuario').value.trim(),
    senha:   document.getElementById('nuSenha').value,
    papel:   document.getElementById('nuPapel').value
  };
  if (!dados.nome || !dados.usuario || !dados.senha) { toast('Preencha todos os campos.', 'error'); return; }
  showLoading(true);
  gs('criarUsuario', App.token, dados).then(() => {
    showLoading(false);
    toast('Usuário criado.', 'success');
    document.getElementById('nuNome').value = '';
    document.getElementById('nuUsuario').value = '';
    document.getElementById('nuSenha').value = '';
    loadAdmin();
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function toggleUsuarioAdmin(id, ativo) {
  showLoading(true);
  gs('alterarStatusUsuario', App.token, id, ativo).then(() => {
    showLoading(false);
    toast(ativo ? 'Usuário ativado.' : 'Usuário desativado.', 'success');
    loadAdmin();
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}

function resetSenhaAdmin(id, nome) {
  const nova = prompt('Nova senha para ' + nome + ':');
  if (!nova) return;
  showLoading(true);
  gs('redefinirSenhaUsuario', App.token, id, nova).then(() => {
    showLoading(false);
    toast('Senha redefinida.', 'success');
  }).catch(err => { showLoading(false); toast(err.message, 'error'); });
}
</script>
</body>
</html>
